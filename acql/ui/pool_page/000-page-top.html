@media (prefers-reduced-motion: no-preference) {
  @keyframes wipe {
    from { clip-path: polygon(0 0, 0 0, 0 0, 0 100%, 0 100%, 0 100%); }
    to { clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px)); }
  }
}

/* panels: squared, on a hairline, a gold line fading across the top */
.module, #leaderboard {
  border-radius: var(--r-md);
  background: var(--panel-line) top left / 100% 2px no-repeat, var(--surface);
  box-shadow: inset 0 1px 0 color-mix(in srgb, var(--ink) 4%, transparent);
}
.module .module { background: none; box-shadow: none; }
.module > .mhead h2::before { width: 2px; border-radius: 0; box-shadow: 0 0 12px 1px var(--glow); }
.box, .scard, .chip, .totop, .finder, .notice { border-radius: var(--r-sm); }
.gcard { border-radius: var(--r-md); }
.bug { border-radius: var(--r-xs); }

/* switches: squared, in capitals, the current one lit */
.seg { border-radius: var(--r-sm); }
.seg button { text-transform: uppercase; letter-spacing: var(--label-tracking); font-size: 12px; }
.seg button[aria-pressed="true"], .weeks button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: #14100a; }
.weeks button { border-radius: var(--r-xs); }
.btn { border-radius: var(--r-sm); text-transform: uppercase; letter-spacing: var(--label-tracking); font-size: 13px; }

/* the podium: lit from its medal */
.podium .step { border-radius: var(--r-md); background: linear-gradient(180deg, color-mix(in srgb, var(--medal) 13%, var(--surface)), var(--surface) 70%); }
.podium .step::before { height: 2px; box-shadow: 0 0 14px 1px var(--medal); }
.podium .initials { border-radius: var(--r-lg); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--medal), 0 0 22px -2px var(--medal); }
.podium .medal { letter-spacing: 0.22em; font-size: 12px; }

/* how a game's picks split: the side most of the pool is on, in gold */
.split .barline { height: 4px; }
.split .barline span { border-radius: 1px; }
.split .barline span.lead { background: linear-gradient(90deg, var(--gold), color-mix(in srgb, var(--gold) 62%, var(--turf))); box-shadow: 0 0 10px -2px var(--glow); }

/* the phone's bottom bar */
.bottombar { border-top: 1px solid color-mix(in srgb, var(--gold) 34%, var(--rule)); }
.bottombar a { text-transform: uppercase; letter-spacing: var(--label-tracking); font-size: 10px; }
.bottombar a[aria-current="page"] { color: var(--gold-text); }
.bottombar a[aria-current="page"]::before { height: 2px; left: 22%; right: 22%; border-radius: 0; box-shadow: 0 0 14px 1px var(--glow); }

/* a phone's top bar: when the week's tag has more to say ("live", "final", "after week 4")
   the year gives it the room, so the menu button stays on the screen */
@media (max-width: 520px) {
  .wordmark { letter-spacing: 0.04em; }
  .weekpill { letter-spacing: 0.04em; white-space: nowrap; }
}
@media (max-width: 410px) {
  .topbar .inner.tight .wordmark .yr { display: none; }
}
@media (max-width: 380px) {
  /* the narrowest phones: the year goes whatever the tag says */
  .topbar .inner { gap: 6px; }
  .weekpill { padding: 4px 6px; }
  .wordmark .yr { display: none; }
}

/* ==== fewer tabs =========================================================================
   The bars carry four sections - Home, the week, Standings, Pools & money - and Me.
   A section's own pages are a row of tabs at the top of each of them, and the menu
   lists every page under its section. */
.desknav { gap: 4px; margin-left: 10px; }
a.weekpill { text-decoration: none; }

@media (min-width: 1100px) { .mechip .who { max-width: 9em; } }
@media (min-width: 1280px) {
  /* room now for the search to say what it is, and for a longer name */

  .searchbtn { width: auto; padding: 0 9px 0 10px; }
  .searchbtn .lbl { display: inline; text-transform: uppercase; letter-spacing: var(--label-tracking); font-size: 12px; color: var(--onair-muted); }
  .searchbtn kbd { display: inline-block; font: 600 11px/1 var(--body); padding: 3px 5px 2px; border: 1px solid var(--onair-rule); border-radius: var(--r-xs); color: var(--onair-muted); }
}

/* a section's pages */
.subnav {
  display: flex;
  gap: 2px;
  margin: -6px 0 22px;
  box-shadow: inset 0 -1px 0 var(--rule);
  overflow-x: auto;
  scrollbar-width: none;
}
.subnav::-webkit-scrollbar { display: none; }
.subnav a {
  flex: none;
  display: inline-flex;
  align-items: center;
  padding: 10px 14px 9px;
  border-bottom: 2px solid transparent;
  font: 600 17px/1 var(--display);
  letter-spacing: 0.04em;
  color: var(--muted);
  text-decoration: none;
  white-space: nowrap;
}

.subnav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--gold); text-shadow: 0 0 14px var(--glow); }
@media (max-width: 520px) {

}
@media (max-width: 380px) {

}
@media (prefers-reduced-motion: no-preference) { .subnav a { transition: color 0.15s ease, border-color 0.15s ease; } }

/* the menu: every page, under its section */
.sheet .group { display: grid; gap: 8px; padding: 8px 6px 14px; border-bottom: 1px solid var(--rule); }
.sheet .group > b { font: 600 11px/1 var(--body); letter-spacing: var(--label-tracking); text-transform: uppercase; color: var(--muted); }
.sheet .group .links { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.sheet .group a {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  padding: 11px 10px 10px;
  border: 1px solid var(--rule);
  border-radius: var(--r-sm);
  background: var(--raised);
  text-decoration: none;
  font-weight: 600;
}
.sheet .group a svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
.sheet .group a span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (min-width: 1100px) { .sheet { width: 372px; } }
.sheet .group a[aria-current="page"] { border-color: var(--gold); color: var(--gold-text); }
.sheet .group a[aria-current="page"] svg { color: inherit; }
@media (hover: hover) { .sheet .group a:hover { border-color: var(--rule-hover); } }

/* the week board and the home page's table: a coach's small print sits under the name, never beside it */
.weekboard .name, [data-card="table"] .name { flex-wrap: wrap; row-gap: 3px; }
.standrows .name > .meta { flex: 1 0 100%; }
.standrows .name .youtag { flex: none; margin-left: 0; white-space: nowrap; }

/* small phones: a table in a panel scrolls inside it, and never pushes the page sideways */
.box:has(> table) { overflow-x: auto; }
@media (max-width: 400px) {
  [data-card="race"] .box { padding-left: 8px; padding-right: 8px; }
  [data-card="race"] td.coach .who-link { display: inline-block; max-width: 7.4em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
}
@media print { .subnav { display: none; } }

/* ==== Sunday: the boot sequence, the ribbon, flip cards ==================================== */
/* the ribbon: always under the top bar while a week is being played */
.ticker { position: sticky; top: var(--bar-h, 56px); z-index: 19; }
.bug { text-decoration: none; color: inherit; cursor: pointer; }
.bug.post { opacity: 0.78; }
.bug .side.mine .tb { box-shadow: inset 3px 0 0 var(--c2, rgba(255,255,255,0.4)), 0 0 0 1px var(--onair), 0 0 0 2px var(--gold); }
@media (hover: hover) { .bug:hover { border-top-color: var(--gold); } }
.bug:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
@media (max-width: 560px) { .bug { min-width: 100px; padding: 4px 7px 5px; } .bug .pts { font-size: 15px; } }
/* kickoff in a headline: the exact time, the countdown only when close */
.kicktime .until { color: var(--gold); white-space: nowrap; }
.kicktime .until:not(:empty)::before { content: " \00b7  "; }
.hero h1 .kicktime .until { display: block; margin-top: 8px; font: 700 clamp(14px, 1.8vw, 18px)/1 var(--body); letter-spacing: 0.14em; text-transform: uppercase; }
.hero h1 .kicktime .until:not(:empty)::before { content: none; }
/* flip cards: the front is the matchup, the back the analysis */
.gcard .gfoot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.gcard .gfoot .meta { flex: 1 1 12em; }
.flipbtn { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; background: none; border: 1px solid var(--rule); color: var(--ink-2);
  font: 700 11px/1 var(--body); letter-spacing: 0.1em; text-transform: uppercase; padding: 6px 9px; border-radius: var(--r-xs); cursor: pointer; }

@media (hover: hover) { .flipbtn:hover { border-color: var(--gold); color: var(--ink); } }
.flipbtn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.pickchip { display: inline-flex; align-items: center; gap: 6px; font: 700 12px/1 var(--body); color: var(--gold-text); letter-spacing: 0.04em; }
.pickchip.ok { color: var(--good); }
.pickchip.no { color: var(--bad); }
.gcard.back { background: var(--raised); }
.gcard.back::before { background: var(--gold); }
.gcard .mini { display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; }
.gcard .mini .ms { display: inline-flex; align-items: center; gap: 6px; }
.gcard .mini .ms b { font: 800 20px/1 var(--display); }
.gcard .mini .ms.credit b::after { content: " \2713"; color: var(--good); font-size: 14px; }
.gcard .mini .at { color: var(--muted); font-size: 12px; }
.gcard .facts { margin: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 14px; border-top: 1px solid var(--rule); padding-top: 8px; }
.gcard .facts div { display: grid; gap: 2px; min-width: 0; }
.gcard .facts dt { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.gcard .facts dd { margin: 0; font-weight: 600; font-size: 13.5px; }
.gcard { scroll-margin-top: calc(var(--bar-h, 56px) + 70px); }
@media (prefers-reduced-motion: no-preference) {
  .gcard.turning { animation: gturn 0.32s ease-out; transform-origin: 50% 50%; }
  @keyframes gturn { from { transform: perspective(900px) rotateY(-80deg); opacity: 0.3; } to { transform: none; opacity: 1; } }
  .gcard.lit { animation: glit 1.4s ease-out; }
  @keyframes glit { 0%, 30% { box-shadow: 0 0 0 2px var(--gold), 0 0 24px color-mix(in srgb, var(--gold) 45%, transparent); } 100% { box-shadow: 0 1px 2px rgba(13, 27, 44, 0.06); } }
}
@media (prefers-reduced-motion: reduce) { .gcard.lit { outline: 2px solid var(--gold); } }
/* the boot sequence: over the page, never in its way */
.boot { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: radial-gradient(circle at 50% 42%, #0d1210, #020303 70%);
  color: #f3f6fa; cursor: pointer; animation: bootin 0.18s ease-out; transition: opacity 0.25s ease, visibility 0.25s; }
.boot.out { opacity: 0; visibility: hidden; pointer-events: none; }
@keyframes bootin { from { opacity: 0; } to { opacity: 1; } }
.boot .core { display: grid; justify-items: center; gap: 16px; padding: 24px; }
.boot .mark { position: relative; width: 92px; height: 92px; display: grid; place-items: center; }
.boot .mark .crest, .boot .mark img { width: 64px; height: 64px; animation: bootmark 0.6s ease-out both; }
.boot .ring { position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(242, 184, 58, 0.25); border-top-color: #f2b83a; animation: bootspin 1.1s linear infinite; }
.boot .ring.two { inset: 9px; border-top-color: transparent; border-bottom-color: #f2b83a; animation-duration: 1.6s; animation-direction: reverse; }
@keyframes bootspin { to { transform: rotate(360deg); } }
@keyframes bootmark { from { transform: scale(0.6); opacity: 0; } to { transform: none; opacity: 1; } }
.boot .word { display: grid; justify-items: center; gap: 4px; font: 700 30px/1 var(--display); letter-spacing: 0.32em; padding-left: 0.32em; }
.boot .word small { font: 600 11px/1 var(--body); letter-spacing: 0.3em; color: #f2b83a; text-transform: uppercase; }
.boot .checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; min-width: 240px; font: 600 12px/1.2 var(--body); letter-spacing: 0.12em; text-transform: uppercase; }
.boot .checks li { display: flex; justify-content: space-between; gap: 18px; color: #7d897f; border-bottom: 1px solid #1c2527; padding-bottom: 6px; }
.boot .checks li::before { content: ""; width: 7px; height: 7px; margin-top: 3px; border-radius: 50%; background: #3a4540; flex: none; }
.boot .checks .k { flex: 1; }
.boot .checks li.ok { color: #f3f6fa; }
.boot .checks li.ok::before { background: #4fcb85; box-shadow: 0 0 8px #4fcb85; }
.boot .checks li.ok .v { color: #4fcb85; }
.boot .checks li.warn::before { background: #f2b83a; }
.boot .checks li.warn .v { color: #f2b83a; }

@media print { .boot, .ticker { display: none; } .ticker { position: static; } }

/* ==== game day: the slate strip, card states, Cinema mode ================================== */
:root { --stale: #c27a12; --m-flash: 1400ms; --m-state: 240ms; --m-rank: 450ms; --m-count: 700ms; --m-cinema: 220ms; --ease: cubic-bezier(0.22, 1, 0.36, 1); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --stale: #f0a33a; } }
:root[data-theme="dark"] { --stale: #f0a33a; }
.score-new { border-radius: var(--r-sm); }
@media (prefers-reduced-motion: no-preference) { .score-new { animation-duration: var(--m-flash); animation-timing-function: var(--ease); } }
.live-status.warn { color: var(--stale); }
.slate { display: flex; flex-wrap: wrap; align-items: stretch; gap: 1px; margin: 0 0 var(--sp-5); background: var(--onair-rule);
  border: 1px solid var(--onair-rule); border-top: 2px solid var(--gold); border-radius: var(--r-md); overflow: hidden; color: var(--onair-ink); }
.slate > * { background: var(--onair); padding: 10px 14px; display: grid; align-content: center; gap: 3px; }
.slate .wk span, .slate .c span, .slate .next .k { font: 600 var(--label-size)/1 var(--body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--onair-muted); }
.slate .wk b { font: 800 26px/1 var(--display); color: var(--gold); }
.slate .c { min-width: 66px; justify-items: center; }
.slate .c b { font: 800 24px/1 var(--display); font-variant-numeric: tabular-nums; }
.slate .c.on b { color: var(--live); }
.slate .next { flex: 1 1 15em; justify-items: end; text-align: right; }
.slate .next .cd { font: 800 26px/1 var(--display); letter-spacing: 0.04em; color: var(--gold); font-variant-numeric: tabular-nums; }
.slate .next .m { font-size: 12px; color: var(--onair-muted); }
.slate .fresh { font: 700 11px/1.2 var(--body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--onair-muted); max-width: 13em; }
.slate .fresh.stale, .slate .fresh.failed { color: var(--stale); }
.notice.behind { border-left: 3px solid var(--stale); }
.notice.behind::before { content: "Standings"; color: var(--stale); }
.notice.behind b { color: var(--stale); }
.slate .fresh.error { color: var(--bad); }
.cinebtn { display: inline-flex; align-items: center; gap: 6px; background: var(--onair); color: var(--onair-ink); border: 0; cursor: pointer;
  font: 700 12px/1 var(--body); letter-spacing: 0.14em; text-transform: uppercase; }
.cinebtn .glyph { color: var(--gold); font-size: 15px; }
@media (hover: hover) { .cinebtn:hover { color: var(--gold); } }
.cinebtn:focus-visible { outline: 2px solid var(--gold); outline-offset: -3px; }
@media (max-width: 560px) { .slate .c { min-width: 0; flex: 1 1 0; padding: 8px 4px; }
  .slate .c span { letter-spacing: 0.08em; white-space: nowrap; } .slate .next { flex: 1 1 100%; justify-items: start; text-align: left; }
  .slate .wk { flex: 0 0 auto; padding: 8px 12px; } .slate .fresh { flex: 1 1 50%; max-width: none; } .slate .cinebtn { flex: 1 1 30%; justify-content: center; } }
/* card states: status and a data warning are separate marks, each in words */
.gcard .finaltag { letter-spacing: 0.1em; }
.gcard[data-status="final"] { border-color: var(--rule); }
.gcard[data-status="final"]::before { background: var(--muted); opacity: 0.45; }
.gcard[data-status="postponed"] { border-style: dashed; }
.gcard.gcard.warn-stale::before { background: var(--stale); }
.gcard.gcard.warn-error::before { background: var(--bad); }
.dwarn { font: 700 10.5px/1 var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--stale); white-space: nowrap; }
.dwarn.error { color: var(--bad); }
@media (prefers-reduced-motion: no-preference) {
  .gcard.turned-live, .gcard.turned-final, .ctile.turned { animation: gstate var(--m-state) var(--ease) 1; }
  @keyframes gstate { from { opacity: 0.45; } to { opacity: 1; } }
}
/* Cinema mode: the week as a broadcast */
html.cine-on, html.cine-on body { overflow: hidden; }
.cine { position: fixed; inset: 0; z-index: 300; background: var(--onair); color: var(--onair-ink); display: grid; grid-template-rows: auto minmax(0, 1fr);
  gap: 16px; padding: max(16px, env(safe-area-inset-top)) 20px 16px; overflow: hidden; }
.cine:fullscreen { padding: 20px 28px; }
@media (prefers-reduced-motion: no-preference) {
  .cine { animation: cinein var(--m-cinema) var(--ease); } .cine.out { animation: cineout var(--m-cinema) ease-in forwards; }
  @keyframes cinein { from { opacity: 0; transform: scale(0.985); } to { opacity: 1; transform: none; } }
  @keyframes cineout { to { opacity: 0; } }
}
.cine-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; border: 1px solid var(--onair-rule); border-top: 2px solid var(--gold);
  border-radius: var(--r-md); padding: 10px 14px; background: var(--onair-2); }
.cine-head .wk { display: grid; gap: 2px; } .cine-head .wk span { font: 600 11px/1 var(--body); letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
.cine-head .wk b { font: 800 32px/1 var(--display); letter-spacing: 0.06em; }
.cine-head .cnt { display: flex; gap: 18px; }
.cine-head .c { display: grid; justify-items: center; gap: 3px; } .cine-head .c b { font: 800 28px/1 var(--display); font-variant-numeric: tabular-nums; }
.cine-head .c span, .cine-head .next .k { font: 600 10.5px/1 var(--body); letter-spacing: 0.16em; text-transform: uppercase; color: var(--onair-muted); }
.cine-head .c.on b { color: var(--live); }
.cine-head .next { margin-left: auto; display: grid; justify-items: end; gap: 3px; text-align: right; }
.cine-head .next .cd { font: 800 32px/1 var(--display); color: var(--gold); font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
.cine-head .next .m { font-size: 12px; color: var(--onair-muted); }
.cine-exit { background: transparent; color: var(--onair-ink); border: 1px solid var(--onair-rule); border-radius: var(--r-sm); padding: 10px 16px; cursor: pointer;
  font: 700 12px/1 var(--body); letter-spacing: 0.14em; text-transform: uppercase; }
.cine-exit:hover, .cine-exit:focus-visible { border-color: var(--gold); outline: none; }
.cine-body { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; min-height: 0; }
.cine-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; align-content: start; overflow-y: auto; min-height: 0; padding: 2px; }
.ctile { all: unset; box-sizing: border-box; display: grid; gap: 7px; padding: 12px 14px; cursor: pointer; background: var(--onair-2); color: var(--onair-ink);
  border: 1px solid var(--onair-rule); border-left: 3px solid var(--onair-rule); border-radius: var(--r-md); }
.ctile[data-status="live"] { border-left-color: var(--live); }
.ctile[data-status="final"] { background: transparent; }
.ctile[data-status="postponed"] { border-style: dashed; }
.ctile[data-warn="stale"] { border-top: 2px solid var(--stale); } .ctile[data-warn="error"] { border-top: 2px solid var(--bad); }
.ctile[aria-pressed="true"] { border: 2px solid var(--gold); border-left-width: 3px; }
.ctile[aria-pressed="true"][data-status="live"] { border-left-color: var(--live); }
@media (hover: hover) { .ctile:hover { border-color: color-mix(in srgb, var(--gold) 55%, var(--onair-rule)); } }
.ctile:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.ctile .st { display: flex; gap: 8px; align-items: center; font: 700 11.5px/1.2 var(--body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--onair-muted); }
.ctile .st .tv { margin-left: auto; letter-spacing: 0.04em; }
.ctile[data-status="live"] .st > span:first-child { color: var(--live); }
.ctile .row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; }
.ctile .row .nm { font: 600 18px/1.1 var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctile .row.pick .nm { color: var(--gold); font-weight: 800; }
.ctile .row .sc { font: 800 32px/1 var(--display); min-width: 1.6em; text-align: right; padding: 0 4px; }
.ctile[data-status="final"] .row:not(.credit) .sc, .ctile[data-status="final"] .row:not(.credit) .nm { color: var(--onair-muted); }
.ctile .ln { font-size: 12px; color: var(--onair-muted); }
.cine-side { display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto auto auto auto; gap: 8px; min-height: 0; }
.cine-side h2 { margin: 6px 0 0; font: 700 11px/1 var(--body); letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); }
.cine-strip { list-style: none; margin: 0; padding: 0; overflow-y: auto; min-height: 120px; border-top: 1px solid var(--onair-rule); }
.cine-strip .sr { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--onair-rule);
  font-size: 14px; will-change: transform; }
.cine-strip .sr.me { background: color-mix(in srgb, var(--gold) 12%, transparent); box-shadow: inset 3px 0 0 var(--gold); }
.cine-strip .sr.me .n { color: var(--gold); font-weight: 700; }
.cine-strip .p { color: var(--onair-muted); } .cine-strip .v { font: 800 17px/1 var(--display); padding: 0 4px; }
.cine-note { margin: 0; font-size: 12px; color: var(--onair-muted); }
.cine-feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 12.5px; }
.cine-feed time { color: var(--onair-muted); margin-right: 8px; font-variant-numeric: tabular-nums; }
.cine-feed .mine span { color: var(--gold); }
.cine-health { margin: 0; font-size: 12.5px; border-left: 3px solid var(--good); padding-left: 8px; display: grid; gap: 2px; }
.cine-health small { color: var(--onair-muted); font-size: 11.5px; }
.cine-health.stale, .cine-health.failed { border-left-color: var(--stale); color: var(--stale); }
.cine-health.error { border-left-color: var(--bad); color: var(--bad); }
@media (max-width: 900px) {
  .cine { display: block; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .cine-head { margin-bottom: 14px; position: relative; }
  .cine-body, .cine-side { display: block; }
  .cine-grid { overflow: visible; grid-template-columns: minmax(0, 1fr); margin-bottom: 18px; }
  .cine-side > * + * { margin-top: 8px; }
  .cine-head .next { margin-left: 0; justify-items: start; text-align: left; flex: 1 1 100%; }
  .cine-exit { position: absolute; top: 10px; right: 12px; }
  .cine-strip { max-height: 50vh; }
}
@media print { .slate, .cine { display: none; } }
/* ---- round three mock-ups ---- */
.gcard .row .logo:has(img) .tb { display: none; }
.gcard .row.picked .logo:has(img) .tl { border-radius: 50%; box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--gold); }
.trophy .ic.drawn { display: grid; place-items: center; width: 40px; height: 40px; border-radius: var(--r-md);
  color: var(--gold-text); background: var(--gold-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--gold) 40%, transparent); }
.trophy .ic.drawn svg { width: 24px; height: 24px; }
.form svg { width: 1.05em; height: 1.05em; vertical-align: -0.15em; }
.form.hot { color: #e8590c; } .form:not(.hot) { color: #3b82c4; }
@media (max-width: 560px) {
  .weeks { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; max-width: 100%; min-width: 0; padding: 2px; }
  .weeks::-webkit-scrollbar { display: none; }

}
@media (min-width: 900px) {
