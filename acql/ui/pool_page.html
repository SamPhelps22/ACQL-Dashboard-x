<title>ACQL · Arm Chair Quarterback League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,700..900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&display=swap">

<style id="pool-style">
/* ACQL - the pool's website. "Sunday broadcast": what's on air (the live
   week, the week's headline) wears the studio navy; everything else is quiet
   paper. Team colour only ever appears in the small team badges. */
:root {
  --ground: #f3f5f7;
  --surface: #ffffff;
  --raised: #f7f9fb;
  --ink: #0f1c2b;
  --ink-2: #3a4757;
  --muted: #5c6b7d;
  --rule: #d9dfe6;
  --rule-strong: #0f1c2b;
  --turf: #1d6a44;
  --turf-ink: #ffffff;
  --turf-soft: #e3f0e8;
  --gold: #e8b23a;           /* fills and accents */
  --gold-text: #8a5d00;      /* gold that has to be read */
  --gold-soft: #fbf1db;
  --live: #d33a26;
  --good: #1d7a46;
  --bad: #b3361f;
  --onair: #0d1b2c;
  --onair-2: #14273d;
  --onair-ink: #f3f6fa;
  --onair-muted: #9fb0c3;
  --onair-rule: #24405f;
  --me-mark: #b07a12;        /* the viewer's own line on a chart */
  --context: #b9c3cf;        /* everyone else's */
  --context-strong: #6b7a8c;
  --grid: #e6eaef;
  --shadow: 0 10px 30px rgba(13, 27, 44, 0.18);
  --display: "Big Shoulders", "Big Shoulders Display", "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #07111d;
    --surface: #0e1c2c;
    --raised: #122437;
    --ink: #ecf2f8;
    --ink-2: #c0ccd8;
    --muted: #93a4b8;
    --rule: #1d3249;
    --rule-strong: #c0ccd8;
    --turf: #43c084;
    --turf-ink: #06120c;
    --turf-soft: #12301f;
    --gold: #f0b43c;
    --gold-text: #f0b43c;
    --gold-soft: #2a2312;
    --live: #ff6450;
    --good: #4fcb85;
    --bad: #ff7a64;
    --onair: #050c15;
    --onair-2: #0b1828;
    --onair-ink: #f3f6fa;
    --onair-muted: #93a4b8;
    --onair-rule: #1d3249;
    --me-mark: #f0b43c;
    --context: #33475d;
    --context-strong: #8796a8;
    --grid: #172a3e;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #07111d;
  --surface: #0e1c2c;
  --raised: #122437;
  --ink: #ecf2f8;
  --ink-2: #c0ccd8;
  --muted: #93a4b8;
  --rule: #1d3249;
  --rule-strong: #c0ccd8;
  --turf: #43c084;
  --turf-ink: #06120c;
  --turf-soft: #12301f;
  --gold: #f0b43c;
  --gold-text: #f0b43c;
  --gold-soft: #2a2312;
  --live: #ff6450;
  --good: #4fcb85;
  --bad: #ff7a64;
  --onair: #050c15;
  --onair-2: #0b1828;
  --onair-ink: #f3f6fa;
  --onair-muted: #93a4b8;
  --onair-rule: #1d3249;
  --me-mark: #f0b43c;
  --context: #33475d;
  --context-strong: #8796a8;
  --grid: #172a3e;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; margin: 0; line-height: 1.02; text-wrap: balance; }
h1 { font-size: 40px; letter-spacing: 0.005em; }
h2 { font-size: 27px; }
h3 { font-size: 21px; }
p { margin: 0; }
a { color: inherit; }
.num { font-variant-numeric: tabular-nums; }
button, select, input { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, a:focus-visible, input:focus-visible, summary:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--turf);
  outline-offset: 2px;
}
.note { color: var(--muted); font-size: 14px; }
.sub { color: var(--muted); font-size: 14px; }
.lede { font-size: 17px; color: var(--ink-2); max-width: 62ch; }
.page { min-height: 100vh; display: flex; flex-direction: column; }

/* ---- the on-air bar ---------------------------------------------------------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--onair);
  color: var(--onair-ink);
  padding-top: env(safe-area-inset-top, 0px);
  border-bottom: 3px solid var(--gold);
}
.topbar .inner {
  max-width: 1180px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 10px 16px;
  padding: 8px 16px;
}
.brandmark { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; flex: none; }
.brandmark svg { width: 32px; height: 36px; display: block; }
.wordmark { font: 800 26px/1 var(--display); letter-spacing: 0.02em; }
.wordmark .yr { color: var(--gold); margin-left: 4px; }
.weekpill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font: 600 13px/1 var(--body);
  color: var(--onair-muted);
  border: 1px solid var(--onair-rule);
  border-radius: 999px;
  padding: 5px 10px;
  white-space: nowrap;
}
.weekpill.live { color: var(--onair-ink); border-color: var(--live); }
.weekpill.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--live); }
@media (prefers-reduced-motion: no-preference) {
  .weekpill.live::before, .dot-live { animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
}
.desknav { display: flex; gap: 2px; margin-left: 6px; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.desknav::-webkit-scrollbar { display: none; }
.desknav a {
  padding: 8px 9px 7px;
  font: 700 18px/1 var(--display);
  letter-spacing: 0.01em;
  color: var(--onair-muted);
  text-decoration: none;
  border-bottom: 3px solid transparent;
  white-space: nowrap;
}
.desknav a:hover { color: var(--onair-ink); }
.desknav a[aria-current="page"] { color: var(--onair-ink); border-bottom-color: var(--gold); }
.topbar .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.mechip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--onair-rule);
  background: transparent;
  color: var(--onair-ink);
  border-radius: 999px;
  padding: 3px 12px 3px 3px;
  cursor: pointer;
  max-width: 44vw;
  text-decoration: none;
}
.mechip .initials, .initials {
  flex: none;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--turf);
  color: var(--turf-ink);
  font: 800 13px/1 var(--display);
  letter-spacing: 0.02em;
}
.mechip .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: 14px; }
.mechip.empty .initials { background: transparent; border: 1px dashed var(--onair-muted); color: var(--onair-muted); }
.iconbtn {
  border: 1px solid var(--onair-rule);
  background: transparent;
  color: var(--onair-ink);
  border-radius: 8px;
  width: 36px;
  height: 34px;
  display: grid;
  place-items: center;
  cursor: pointer;
}
.iconbtn svg { width: 20px; height: 20px; }
#owner { display: flex; gap: 6px; }
#owner .btn { padding: 5px 10px; }

/* ---- the score ticker -------------------------------------------------------- */
.ticker { background: var(--onair-2); color: var(--onair-ink); border-bottom: 1px solid var(--onair-rule); }
.ticker .track {
  max-width: 1180px;
  margin: 0 auto;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 6px 16px;
  scrollbar-width: none;
  scroll-snap-type: x proximity;
}
.ticker .track::-webkit-scrollbar { display: none; }
.bug {
  flex: none;
  scroll-snap-align: start;
  display: grid;
  grid-template-columns: auto auto;
  align-items: center;
  column-gap: 10px;
  row-gap: 2px;
  min-width: 112px;
  padding: 5px 8px 6px;
  background: var(--onair);
  border-radius: 3px;
  border-top: 2px solid var(--onair-rule);
  font-variant-numeric: tabular-nums;
}
.bug.in { border-top-color: var(--live); }
.bug .state { grid-column: 1 / -1; font: 700 11px/1.2 var(--body); color: var(--onair-muted); letter-spacing: 0.02em; white-space: nowrap; }
.bug.in .state { color: var(--live); }
.bug .pts { font: 800 17px/1 var(--display); text-align: right; color: var(--onair-muted); }
.bug .credited + .pts, .bug .pts.credited { color: var(--onair-ink); }
.bug .side { display: flex; align-items: center; gap: 5px; }
.bug .side.credited::after { content: "\2713"; color: var(--gold); font-weight: 700; font-size: 12px; }

/* team badges: the team's colour, its letters, a stripe of its second colour */
.tb {
  display: inline-grid;
  place-items: center;
  min-width: 34px;
  height: 21px;
  padding: 0 5px 0 7px;
  border-radius: 3px;
  font: 800 13px/1 var(--display);
  letter-spacing: 0.05em;
  background: var(--c1, #556);
  color: var(--ct, #fff);
  box-shadow: inset 3px 0 0 var(--c2, rgba(255,255,255,0.4));
  white-space: nowrap;
  vertical-align: middle;
}
.tb.lg { min-width: 44px; height: 28px; font-size: 16px; }
.ticker .tb, .hero .tb, .tape .tb, .toast .tb { box-shadow: inset 3px 0 0 var(--c2, rgba(255,255,255,0.4)), 0 0 0 1px rgba(255, 255, 255, 0.16); }
.team { display: inline-flex; align-items: center; gap: 7px; }

/* ---- the page ------------------------------------------------------------------ */
main {
  flex: 1;
  width: 100%;
  max-width: 1180px;
  margin: 0 auto;
  padding: 18px 16px calc(96px + env(safe-area-inset-bottom, 0px));
}
.view { display: grid; gap: 30px; }
.view > * { min-width: 0; }
.pagehead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; }
.pagehead h1 { font-size: 40px; }
.cols { display: grid; gap: 30px; }
.cols > * { min-width: 0; display: grid; gap: 30px; align-content: start; }
@media (min-width: 960px) {
  .cols { grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 36px; }
  .cols.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
}

/* a module: a heading on a heavy rule, then its content - no box around it */
.module { display: grid; gap: 12px; align-content: start; }
.module > * { min-width: 0; }
.module > .mhead {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 4px 14px;
  border-top: 3px solid var(--rule-strong);
  padding-top: 8px;
}
.module > .mhead h2 { font-size: 24px; }
.module > .mhead .aside { color: var(--muted); font-size: 14px; }
.box {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 14px 16px;
  display: grid;
  gap: 10px;
}
.box > * { min-width: 0; }

/* the announcement */
.notice {
  background: var(--gold-soft);
  border-left: 5px solid var(--gold);
  padding: 12px 16px;
  display: grid;
  gap: 2px;
}
.notice b { font-family: var(--display); font-size: 19px; font-weight: 800; }
.notice .when { color: var(--muted); font-size: 13px; }

/* ---- the lower third: the one loud thing on a page ------------------------------ */
.hero {
  position: relative;
  background: var(--onair);
  color: var(--onair-ink);
  padding: 18px 44px 22px 22px;
  clip-path: polygon(0 0, 100% 0, calc(100% - 26px) 100%, 0 100%);
  border-left: 7px solid var(--gold);
  display: grid;
  gap: 6px;
  overflow: hidden;
}
.hero::after {
  content: "";
  position: absolute;
  right: 40px;
  top: 0;
  bottom: 0;
  width: 70px;
  background: var(--gold);
  transform: skewX(-14deg);
  opacity: 0.12;
  pointer-events: none;
}
.hero .kicker { font: 700 15px/1.2 var(--body); color: var(--gold); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.hero .kicker .live-tag { background: var(--live); color: #fff; font: 800 13px/1 var(--display); letter-spacing: 0.06em; padding: 4px 7px 3px; border-radius: 2px; }
.hero h1, .hero h2 { font-size: clamp(34px, 7.6vw, 64px); line-height: 0.96; max-width: 20ch; }
.hero .deck { color: var(--onair-muted); font-size: 17px; max-width: 62ch; }
.hero .deck b { color: var(--onair-ink); font-weight: 600; }
.hero .stats { display: flex; flex-wrap: wrap; gap: 10px 26px; margin-top: 8px; }
.hero .stat { display: grid; gap: 0; }
.hero .stat .v { font: 800 30px/1 var(--display); color: var(--onair-ink); }
.hero .stat .k { font-size: 13px; color: var(--onair-muted); }
.hero .btn { justify-self: start; margin-top: 6px; }
@media (prefers-reduced-motion: no-preference) {
  .hero.enter { animation: wipe 560ms cubic-bezier(0.2, 0.7, 0.2, 1) both; }
  @keyframes wipe {
    from { clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); }
    to { clip-path: polygon(0 0, 100% 0, calc(100% - 26px) 100%, 0 100%); }
  }
}

/* buttons */
.btn {
  border: 1px solid var(--rule);
  background: var(--surface);
  color: var(--ink);
  border-radius: 6px;
  padding: 8px 14px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.btn:hover { border-color: var(--turf); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn:disabled { opacity: 0.6; cursor: default; }
.btn.primary { background: var(--turf); border-color: var(--turf); color: var(--turf-ink); }
.btn.onair { background: transparent; border-color: var(--onair-rule); color: var(--onair-ink); }
.btn.onair:hover { border-color: var(--gold); }
.linkish { border: 0; background: none; padding: 0; color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.linkish:hover { color: var(--turf); }
.more-link { font-weight: 600; color: var(--turf); text-decoration: none; justify-self: start; }
.more-link:hover { text-decoration: underline; text-underline-offset: 3px; }
.who-link { border: 0; background: none; padding: 0; margin: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; }
.who-link:hover { color: var(--turf); text-decoration: underline; text-underline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--ground); }
.weeks { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.weeks button {
  border: 1px solid var(--rule);
  background: var(--surface);
  border-radius: 4px;
  min-width: 36px;
  padding: 5px 8px;
  cursor: pointer;
  font: 700 17px/1 var(--display);
}
.weeks button[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }

/* ---- rows: the default way to list things ------------------------------------------ */
.rows { display: grid; }
.rows > .r {
  display: grid;
  align-items: center;
  gap: 4px 12px;
  padding: 10px 2px;
  border-bottom: 1px solid var(--rule);
}
.rows > .r:last-child { border-bottom: 0; }
.rows > .r.me { background: var(--gold-soft); box-shadow: inset 4px 0 0 var(--gold); padding-left: 12px; padding-right: 8px; }
.r .pos { font: 800 22px/1 var(--display); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.r .name { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.r .big { font: 800 24px/1 var(--display); text-align: right; font-variant-numeric: tabular-nums; }
.r .meta { color: var(--muted); font-size: 13px; }
.r .meta b { color: var(--ink-2); font-weight: 600; }
.youtag { font: 800 11px/1 var(--display); letter-spacing: 0.06em; background: var(--gold); color: #0d1b2c; padding: 3px 5px 2px; border-radius: 2px; margin-left: 6px; vertical-align: 2px; }

/* standings rows */
.standrows > .r { grid-template-columns: 30px 30px minmax(0, 1fr) auto; }
.standrows .mv { font-size: 13px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
.standrows .meta { grid-column: 3 / -1; }
@media (min-width: 720px) {
  .standrows > .r { grid-template-columns: 34px 34px minmax(0, 1fr) 70px 62px 64px 70px 92px; }
  .standrows .meta { display: none; }
}
.standrows .col { display: none; text-align: right; font-variant-numeric: tabular-nums; }
@media (min-width: 720px) { .standrows .col { display: block; } }
.standrows .hdr { font-size: 12px; color: var(--muted); font-weight: 600; padding-top: 0; padding-bottom: 6px; }
.standrows .hdr .col, .standrows .hdr .big { font: 600 12px var(--body); color: var(--muted); }
.rows > .r.avgtop { border-top: 2px dashed var(--context-strong); }
.up { color: var(--good); }
.down { color: var(--bad); }
.flat { color: var(--muted); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
/* words for screen readers where the page shows only a mark */
.vh { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
.dot.alive { background: var(--turf); }
.dot.out { background: var(--muted); opacity: 0.4; }
.star { color: var(--gold-text); }

/* ---- tables --------------------------------------------------------------------- */
.scroll-wrap { position: relative; }
.scroll { overflow-x: auto; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); }
.scroll-wrap::after {
  content: "";
  position: absolute;
  top: 1px;
  bottom: 1px;
  right: 1px;
  width: 28px;
  border-radius: 0 5px 5px 0;
  background: linear-gradient(to right, transparent, rgba(13, 27, 44, 0.18));
  pointer-events: none;
  opacity: 0;
  transition: opacity 150ms;
}
.scroll-wrap.more::after { opacity: 1; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--rule); white-space: nowrap; background: var(--surface); }
tbody tr:last-child td { border-bottom: 0; }
th { font: 600 12px var(--body); color: var(--muted); }
td.n, th.n { text-align: right; }
td.coach { font-weight: 600; }
td.total { font: 800 19px var(--display); }
td.latest, th.latest { background: var(--turf-soft); }
.stick-a { position: sticky; left: 0; z-index: 1; width: 44px; min-width: 44px; max-width: 44px; }
.stick-b { position: sticky; left: 44px; z-index: 1; box-shadow: 1px 0 0 var(--rule); }
tr.me td { background: var(--gold-soft); }
tr.me td.coach { box-shadow: inset 4px 0 0 var(--gold); }
tr.me td.stick-b { box-shadow: inset 4px 0 0 var(--gold), 1px 0 0 var(--rule); }
td.pk { text-align: center; font: 700 12px var(--body); color: var(--muted); }
td.pk.ok { background: var(--turf-soft); color: var(--good); }
td.pk.no { color: var(--bad); text-decoration: line-through; opacity: 0.8; }
td.pk.ok.live, td.pk.no.live { font-style: italic; }
td.pk.no.live { text-decoration: none; }
th.gk { text-align: center; font-size: 11px; }
.sui-ok { color: var(--good); font-weight: 600; }
.sui-no { color: var(--bad); font-weight: 600; }
.box table td, .box table th { padding: 6px 8px 6px 0; background: transparent; }
.split-row td { white-space: normal; min-width: 6em; }
.split-row td.ok { color: var(--good); font-weight: 600; }
.split-row td.no { color: var(--bad); }
td.won-it { font-weight: 700; }
td.game, td.winner { white-space: normal; }

/* ---- the week being played ---------------------------------------------------- */
.live-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.live-status { color: var(--muted); font-size: 14px; }
.live-status.bad { color: var(--bad); }
.dot-live { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--live); margin-right: 6px; vertical-align: 1px; }
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }

  function fetchScores() {
    var L = DATA.live;
    if (!L || live.busy) return;
    live.busy = true;
    live.lastTry = Date.now();
    var year = String(seasonYear());
    var url = SCORES + "?seasontype=2&week=" + L.week + "&dates=" + year + "&_=" + Date.now();
    fetch(url, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("status " + r.status);
      return r.json();
    }).then(function (json) {
      var got = {};
      (json.events || []).forEach(function (ev) {
        var comp = (ev.competitions || [])[0] || {};
        var teams = {};
        (comp.competitors || []).forEach(function (c) {
          teams[c.homeAway] = { code: code(c.team && c.team.abbreviation), score: Number(c.score || 0) };
        });
        if (!teams.home || !teams.away) return;
        var status = comp.status || ev.status || {};
        var st = status.type || {};
        var key = gameKey(teams.home.code, teams.away.code);
        // The betting line: "BUF -8.5" means Buffalo by 8.5. Kept with ESPN's
        // home team, which isn't always the sheet's (a neutral-site game).
        var details = String(((comp.odds || [])[0] || {}).details || "");
        var m = details.match(/^([A-Za-z]+)\s+(-?\d+(?:\.\d+)?)/);

  // Whether what's on screen follows the scores.

    if (states.some(function (s) { return s === "in"; })) return LIVE_REFRESH_MS;

  // ---- keeping the viewer's place when the page redraws itself ---------------------------

  // ---- the week's story, from its numbers ---------------------------------------------
  function secondBest(w) {
    var below = w.scores.map(function (s) { return s.total; }).filter(function (v) { return v < w.top; });
    return below.length ? Math.max.apply(null, below) : null;
  }
  function headline(w) {
    var n = w.winners;

    return cap((WORDS[n.length] || n.length) + "-way split of week " + w.week);
  }
  function story(w) {
    var bits = [];

    if (w.winners.length === 1 && second != null) {
      bits.push(plural(w.top, "win") + ", " + numberWord(w.top - second) + " clear of " + listNames(runners, 2) + ".");
    } else if (w.winners.length > 1) {
      bits.push("All on " + plural(w.top, "win") + ".");
    }
    if (w.payout_each) bits.push(money(w.payout_each) + (w.winners.length > 1 ? " each." : " to the winner."));
    bits.push("The pool averaged " + w.average.toFixed(1) + " of " + w.games + ", and the crowd’s card went " + w.crowd.right + " for " + w.crowd.games + ".");
    var u = (w.upsets || [])[0];

  // ---- all over, not yet entered ---------------------------------------------------------

  // ---- this week's side pools, and the picks nobody else made -------------------
  // One row per team: who has it, how it stands, and the coaches' names

    function pickRow(r) {

        el("div", { class: "top" }, [el("span", { class: "team" }, [r.badge ? badge(r.badge) : null, el("b", { text: r.name })]),
          el("span", { class: "count num", text: count })]),

  }
  // How one Big Loser pick stands. `by` is how many points the team is
  // losing by (null before kickoff); a point needs 15 or more at the end.
  function loserState(x, team) {
    if (!x) return { text: "not on this week’s sheet", tone: "muted", by: null, chance: null };
    var chance = blownChance(x, team);
    var by = x.state !== "pre" && x.hs != null ? (x.g.hc === team ? x.as - x.hs : x.hs - x.as) : null;
    if (by == null) return { text: pct(chance) + " to lose by 15+", tone: "muted", by: null, chance: chance };
    if (x.state === "post") {

        tone: by >= 15 ? "good" : "bad", by: by, chance: chance };
    }
    return { text: upDown(-by) + " · " + liveDetail(x) + " · " + pct(chance) + " to lose by 15+",
      tone: by >= 15 ? "good live" : "live", by: by, chance: chance };
  }
  // How one suicide pick stands, with the pool's line applied.
  function survivalState(x, team) {
    if (!x) return { text: "not on this week’s sheet", tone: "muted", now: "", chance: null };
    var chance = creditChance(x, team);
    var lined = x.g.line != null && x.g.fav;
    if (x.state === "pre") {
      return { text: pct(chance) + " to survive" + (lined ? " · pool line " + teamName(x, x.g.fav) + " by " + x.g.line : ""),

    }

    var margin = team === x.g.hc ? x.hs - x.as : x.as - x.hs;
    return { text: (now === "level" ? "" : now + " · ") + upDown(margin) + (lined ? " (line " + x.g.line + ")" : "") +
      " · " + liveDetail(x) + " · " + pct(chance) + " to survive", tone: now === "ahead" ? "good live" : now === "behind" ? "bad live" : "live", now: now, chance: chance };
  }

  // Every Big Loser the pool picked this week, how it stands, and who has it.
  function weekLosersCard(t) {
    var L = DATA.live, held = {}, cards = 0;
    L.coaches.forEach(function (c) {
      if (c.bl.length) cards++;
      c.bl.forEach(function (team) { (held[team] = held[team] || []).push(c.name); });
    });
    var teams = Object.keys(held);

      if (s.by != null && s.by >= 15) { if (x.state === "post") banked += who.length; else holding += who.length; }
      expected += (s.chance || 0) * who.length;
      return { team: team, badge: team, name: teamName(x, team), who: who, share: cards ? who.length / cards : null,
        chance: s.chance || 0, status: s.text, tone: s.tone, point: s.by != null && s.by >= 15 };
    });

  // The suicide pool this week: who is on which team, and how it stands.
  function weekSuicideCard(t) {
    var L = DATA.live, season = {}, on = {}, none = [], alive = 0;

    });

  // Picks almost nobody made, and how the crowd's own card is doing.
  function limbCard(t) {
    var L = DATA.live, n = L.coaches.length, few = Math.max(2, Math.round(n * 0.1));

        else if (x.state === "post") { status = x.credit === team ? "came in ✓" : "missed"; tone = x.credit === team ? "good" : "bad"; }

  // How the pool picked every game: the split between the two sides.

  // One coach's whole card for the week being played: every pick, the Big

      else if (x.state === "post") { var ok = x.credit === pick; s = { text: ok ? "✓ right" : "✗ wrong", tone: ok ? "good" : "bad" }; if (ok) right++; else wrong++; }
      else {

  // Who a coach should cheer for in the games still to finish.

    var mine = sim.chance[whom] || 0;

        ? el("p", { class: "note", text: "No way to finish top this week any more - but the season total still counts." }) : null,

        return el("div", { class: "r", style: "grid-template-columns: 52px minmax(0,1fr)" }, [
          el("span", { class: "big", style: "font-size:20px", text: "+" + Math.round(r.gain * 100) + "%" }),
          el("span", {}, [el("span", { class: "team" }, [badge(r.team), el("b", { text: "Root for " + teamFull(r.team) })]),
            el("span", { class: "meta", style: "display:block", text: "over " + teamFull(r.other) + " · " + pct(r.withIt) + " if they’re credited, " + pct(r.without) + " if not" })])

  // The games still to finish that move the week most.
  function swingCard(t, sim) {
    var L = DATA.live, n = L.coaches.length;
    var rows = sim.open.map(function (gi, o) {
      var sp = sim.split[o];
      if (!sp.h[0] || !sp.a[0]) return null;
      var moved = 0, bestH = -1, bestA = -1, whoH = "", whoA = "";
      for (var c = 0; c < n; c++) {

        el("div", {}, [module("Records", past.length ? "across " + plural(past.length + 1, "season") : "this season so far",
          recs.length ? [el("div", { class: "records" }, recs.map(function (r) {
            return el("div", { class: "record" }, [el("span", { class: "k", text: r.k }), el("span", { class: "v", text: r.v }),
              el("span", { class: "w", text: r.w }), el("span", { class: "d", text: r.d })]);
          }))] : [el("p", { class: "note", text: "Records start once a week is done." })], { "data-card": "records" })])
      ])
    ];
    if (past.length) kids.push(allTimeModule(seasons, champs));
    else kids.push(el("p", { class: "note", text: "All-time standings start with the next season: the dashboard keeps each season as it publishes, and this one joins the history when it’s done." }));
    return el("div", { class: "view", "data-view": "history" }, kids);
  }
  function allTimeModule(seasons, champs) {
    var by = {};
    seasons.forEach(function (s) {
      (s.standings || []).forEach(function (x) {
        var r = by[x.name] = by[x.name] || { name: x.name, seasons: 0, wins: 0, weeks: 0, best: null, titles: 0 };
        r.seasons++;
        r.wins += x.wins || 0;
        r.weeks += x.weeks_won || 0;
        if (x.place != null && (r.best == null || x.place < r.best)) r.best = x.place;
      });
    });
    Object.keys(champs).forEach(function (y) { splitNames(champs[y].names).forEach(function (n) { if (by[n]) by[n].titles++; }); });
    var list = Object.keys(by).map(function (k) { return by[k]; }).sort(function (a, b) { return b.titles - a.titles || b.wins - a.wins || a.name.localeCompare(b.name); });
    return module("All-time", plural(seasons.length, "season"), [scroller(el("table", { id: "all-time" }, [
      el("thead", {}, [el("tr", {}, [el("th", { text: "Coach" }), el("th", { class: "n", text: "Titles" }), el("th", { class: "n", text: "Seasons" }),
        el("th", { class: "n", text: "Wins" }), el("th", { class: "n", text: "Weeks won" }), el("th", { class: "n", text: "Best finish" })])]),
      el("tbody", {}, list.map(function (r) {
        return el("tr", { class: isMe(r.name) ? "me" : null }, [el("td", { class: "coach" }, [player(r.name) ? who(r.name) : r.name]),
          el("td", { class: "n num", text: r.titles ? String(r.titles) : "–" }), el("td", { class: "n num", text: String(r.seasons) }),
          el("td", { class: "n num", text: String(r.wins) }), el("td", { class: "n num", text: String(r.weeks) }),
          el("td", { class: "n num", text: r.best != null ? ordinal(r.best) : "–" })]);
      }))
    ])), el("p", { class: "note", text: "Includes this season so far. Names are matched exactly as each season’s sheet wrote them." })], { "data-card": "all-time" });
  }

  // ---- share my week: a picture for the group chat -----------------------------------------
  // Drawn on the phone itself - no server - in the site's on-air colours. It
  // opens the phone's share sheet where there is one, and offers the file to
  // save everywhere else.
  function shareWeek(name) {
    var p = player(name);
    if (!p) return;
    var W = 1080, H = 1350;
    var canvas = document.createElement("canvas");
    canvas.width = W;
    canvas.height = H;
    var g = canvas.getContext("2d");
    var DISPLAY = '"Big Shoulders", "Big Shoulders Display", "Barlow Condensed", "Arial Narrow", sans-serif';
    var BODY = '"Barlow", "Segoe UI", system-ui, sans-serif';
    var fontsReady = document.fonts && document.fonts.load ? Promise.all([
      document.fonts.load("800 120px " + DISPLAY), document.fonts.load("600 40px " + BODY)
    ]).catch(function () {}) : Promise.resolve();
    var img = new Image();
    var crestReady = new Promise(function (resolve) {
      img.onload = resolve;
      img.onerror = resolve;
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(CREST.replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" '));
    });
    var timeout = new Promise(function (resolve) { setTimeout(resolve, 1500); });
    Promise.race([Promise.all([fontsReady, crestReady]), timeout]).then(function () {
      draw();
      canvas.toBlob(function (blob) { if (blob) offer(blob); }, "image/png");
    });

    function fit(text, size, weight, family, room) {
      var s = size;
      g.font = weight + " " + s + "px " + family;
      while (g.measureText(text).width > room && s > size * 0.45) { s -= 2; g.font = weight + " " + s + "px " + family; }
      return s;
    }
    function draw() {
      g.fillStyle = "#0d1b2c";
      g.fillRect(0, 0, W, H);
      // a gold slash in the corner, like the lower third's
      g.save();
      g.fillStyle = "rgba(232, 178, 58, 0.14)";
      g.beginPath(); g.moveTo(W - 300, 0); g.lineTo(W - 160, 0); g.lineTo(W - 420, H); g.lineTo(W - 560, H); g.closePath(); g.fill();
      g.restore();
      g.fillStyle = "#e8b23a";
      g.fillRect(0, 0, 14, H);
      if (img.complete && img.naturalWidth) g.drawImage(img, 70, 64, 120, 134);
      g.textBaseline = "alphabetic";
      g.fillStyle = "#f3f6fa";
      g.font = "800 84px " + DISPLAY;
      g.fillText("ACQL", 214, 150);
      var w1 = g.measureText("ACQL ").width;
      g.fillStyle = "#e8b23a";
      g.fillText(String(seasonYear()), 214 + w1, 150);
      g.fillStyle = "#9fb0c3";
      g.font = "600 30px " + BODY;
      g.fillText("Arm Chair Quarterback League", 216, 192);

      g.fillStyle = "#f3f6fa";
      var size = fit(p.name, 150, 800, DISPLAY, W - 140);
      g.fillText(p.name, 70, 380);

      // this week, or the last one played
      var lines = weekLines(p);
      g.fillStyle = "#14273d";
      g.fillRect(70, 440, W - 140, 330);
      g.fillStyle = "#e8b23a";
      g.fillRect(70, 440, W - 140, 8);
      g.fillStyle = "#e8b23a";
      g.font = "700 36px " + BODY;
      g.fillText(lines.kicker, 110, 520);
      g.fillStyle = "#f3f6fa";
      fit(lines.big, 120, 800, DISPLAY, W - 220);
      g.fillText(lines.big, 110, 640);
      g.fillStyle = "#c0ccd8";
      g.font = "500 38px " + BODY;
      g.fillText(lines.small, 110, 718);

      // the season, the side pools
      var s = p.suicide;
      var rows = [
        ["Season", plural(p.wins, "win") + (p.place != null ? ", " + ordinal(p.place) + " of " + DATA.entrants : "") + (p.move ? (p.move > 0 ? "  ▲" : "  ▼") + Math.abs(p.move) : "")],
        ["Suicide pool", s.alive ? "still in" : s.out ? "out in week " + s.out : "not in it"],
        ["Big Loser", plural(p.big_loser || 0, "point")]
      ];
      var y = 880;
      rows.forEach(function (r) {
        g.fillStyle = "#9fb0c3";
        g.font = "600 34px " + BODY;
        g.fillText(r[0], 70, y);
        g.fillStyle = "#f3f6fa";
        g.font = "800 60px " + DISPLAY;
        g.fillText(r[1], 70, y + 64);
        y += 140;
      });
      g.fillStyle = "#9fb0c3";
      g.font = "500 28px " + BODY;
      var site = LIVE.hosted ? location.origin + location.pathname : "";
      g.fillText(site.replace(/^https?:\/\//, "").replace(/\/$/, ""), 70, H - 50);
      return size;
    }
    function offer(blob) {
      var file = null;
      var fileName = "ACQL " + seasonYear() + " - " + p.name.replace(/[^\w .-]+/g, "") + ".png";
      try { file = new File([blob], fileName, { type: "image/png" }); } catch (e) { file = null; }
      var url = URL.createObjectURL(blob);
      var canShare = !!(file && navigator.canShare && navigator.canShare({ files: [file] }));
      var view = el("div", { class: "shareview", role: "dialog", "aria-modal": "true", "aria-label": "Share " + p.name + "’s week",
        onclick: function (e) { if (e.target === view) close(); }, onkeydown: function (e) { if (e.key === "Escape") close(); }, tabindex: "-1" }, [
        el("div", { class: "inner" }, [
          el("img", { src: url, alt: p.name + "’s week, as a picture" }),
          el("div", { class: "acts" }, [
            canShare ? el("button", { class: "btn primary", type: "button", onclick: function () {
              navigator.share({ files: [file], title: "ACQL", text: p.name + "’s week" }).catch(function () { /* closed: fine */ });
            } }, [icon("share"), "Share"]) : null,
            el("a", { class: "btn" + (canShare ? "" : " primary"), href: url, download: fileName, text: "Save picture" }),
            el("button", { class: "btn", type: "button", text: "Close", onclick: close })
          ]),
          el("p", { class: "note", style: "color:#c0ccd8;text-align:center", text: "On a phone you can also press and hold the picture to save it." })
        ])
      ]);
      function close() { view.remove(); URL.revokeObjectURL(url); }
      document.body.appendChild(view);
      view.focus();
    }
  }
  // What the picture says about the week: the one being played if it has
  // started, else the last one finished.
  function weekLines(p) {
    if (hasLive() && live.fetched) {
      var t = liveTally();
      var r = t.rows.filter(function (x) { return x.c.name === p.name; })[0];
      if (r && t.games.some(function (x) { return x.state !== "pre"; })) {
        var place = 1 + t.rows.filter(function (o) { return o.now > r.now; }).length;
        var over = weekOver(t);
        return { kicker: "Week " + DATA.live.week + (over ? ", final" : " live"),
          big: plural(r.now, "win") + ", " + ordinal(place),
          small: over ? (place === 1 ? "Won the week" : "of " + t.rows.length) : pct(simulate(t).chance[p.name] || 0) + " to win the week" };
      }
    }
    var w = weekData(DATA.through_week);
    var mine = w ? w.scores.filter(function (s) { return s.name === p.name; })[0] : null;
    if (!mine) return { kicker: "After week " + DATA.through_week, big: plural(p.wins, "win"), small: "this season" };
    var rank = 1 + w.scores.filter(function (o) { return o.total > mine.total; }).length;
    var won = w.winners.indexOf(p.name) >= 0;
    return { kicker: "Week " + w.week, big: plural(mine.total, "win") + ", " + ordinal(rank) + (won ? " ★" : ""),
      small: won ? "Won the week" + (w.payout_each ? ", " + money(w.payout_each) : "") : "of " + w.scores.length + ", the pool averaged " + w.average.toFixed(1) };
  }

  // ---- starting up -----------------------------------------------------------------
  // Whatever DATA the page shows, the things worked out from it start afresh.
  function dataChanged() {
    poolProfile = null;
    historyData = null;
    historyError = "";
    simCache = { key: "", sim: null };
  }
  function route(hash) {
    var wanted = String(hash || "").replace("#", "");
    state.coach = "";
    if (wanted.indexOf("coach=") === 0) {
      try { state.coach = decodeURIComponent(wanted.slice(6)); } catch (e) { state.coach = ""; }
    } else if (wanted.indexOf("vs=") === 0) {
      // a shared matchup: #vs=First%20coach&Second%20coach
      var both = wanted.slice(3).split("&");
      try { state.a = decodeURIComponent(both[0] || ""); state.b = decodeURIComponent(both[1] || ""); } catch (e) { state.a = state.b = ""; }
      state.view = "h2h";
    } else if (wanted) {
      var v = ALIASES[wanted] || wanted;
      if (VIEWS[v]) state.view = v;
    }
    if (!available(state.view)) state.view = "home";
  }
  route(location.hash);
  window.addEventListener("hashchange", function () { route(location.hash); render({ top: true }); freshen(); });
  if (live.fetched && hasLive()) lastSeen = seen(liveTally());
  if (hasLive()) setTimeout(fetchScores, 0);
  render();
  // Saved to a phone's home screen, the site opens at once and works with no signal.
  if (LIVE.hosted === "web" && "serviceWorker" in navigator &&
      (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { /* the site works the same without it */ });
    });
  }

  // ---- updating the page (only whoever can edit it sees any of this) -----------------
  function pageSource(data) {
    var style = document.getElementById("pool-style").textContent;
    var code = document.getElementById("pool-app").textContent;
    var json = JSON.stringify(data).replace(/</g, "\\u003c");
    return "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">" +
      "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">" +
      "<title>" + TITLE + "</title>" +
      "<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">" +
      "<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>" +
      FONTS.map(function (f) { return "<link rel=\"stylesheet\" href=\"" + f + "\">"; }).join("") +
      "<style id=\"pool-style\">" + style + "</style></head><body>" +
      "<div id=\"app\" class=\"page\"></div>" +
      "<script type=\"application/json\" id=\"pool-data\">" + json + "<\/script>" +
      "<script id=\"pool-app\">" + code + "<\/script></body></html>";
  }
  function checkData(d) {
    if (!d || d.schema !== 1 || !Array.isArray(d.players) || !Array.isArray(d.weeks) || typeof d.through_week !== "number") {
      return "That isn’t a pool page file. In the dashboard click Results › Pool page, then choose the file it saves (ACQL pool page - week N.json, in Downloads).";
    }
    if (!d.players.length) return "That file has no coaches in it.";
    if (!d.weeks.length) return "That file has no finished weeks in it yet.";
    return "";
  }
  // Who can update the page: the top button shows once the page knows this
  // viewer can edit it. Everyone else gets a small link at the bottom that
  // offers the same thing - and, where this view can't publish, says why -
  // so the owner is never left without a way in.
  // On the pool's own website (DATA.hosted) the dashboard publishes the page, so there is nothing to update here.
  var caps = { checking: !LIVE.hosted && !!(window.claude && typeof window.claude.use === "function"), artifact: null, editor: null };
  var ownerShown = false;
  var input = el("input", { type: "file", accept: ".json,application/json", hidden: true });
  var updateBox = el("div", { class: "update", role: "status" });
  function show(kids) {
    updateBox.textContent = "";
    kids.forEach(function (k) { if (k) updateBox.appendChild(k); });
    updateBar = updateBox;
    render();
    try { window.scrollTo({ top: 0, behavior: "smooth" }); } catch (e) { window.scrollTo(0, 0); }
  }
  function close() {
    updateBar = null;
    DATA = LIVE;
    dataChanged();
    input.value = "";
    render();
  }
  function closeButton() {
    return el("div", { class: "owner" }, [el("button", { class: "btn", type: "button", text: "Close", onclick: close })]);
  }
  function startUpdate() {
    if (caps.checking) {
      show([el("p", { text: "Still checking whether this view can update the page. Try again in a few seconds." }), closeButton()]);
    } else if (!caps.artifact) {
      show([el("p", { class: "error", text: "This view can’t update the page. Open it signed in to your Claude account on a computer (claude.ai in a browser, or the Claude app), then try again." }), closeButton()]);
    } else {
      input.click();
    }
  }
  function publishing(data) {
    var publish = el("button", { class: "btn primary", type: "button", text: "Publish for everyone" });
    var cancel = el("button", { class: "btn", type: "button", text: "Cancel", onclick: close });
    publish.addEventListener("click", function () {
      publish.disabled = true;
      cancel.disabled = true;
      publish.textContent = "Publishing…";
      caps.artifact.publish(pageSource(data)).then(function () {
        publish.textContent = "Published · reloading";
      }).catch(function (err) {
        var code = err && err.code;
        if (code === "conflict") return;          // a newer version won; the page is reloading to it
        cancel.disabled = false;
        var readOnly = ["not_writer", "not_granted", "not_declared", "consent_required", "capability_disabled", "capability_removed"].indexOf(code) >= 0;
        publish.disabled = readOnly;
        publish.textContent = "Publish for everyone";
        updateBox.appendChild(el("p", { class: "error", text:
          readOnly ? "This view can’t publish the page (" + code + "). Only the page’s owner can, signed in to their Claude account on a computer." :
          code === "too_large" ? "That file is too big for the page." :
          code === "rate_limited" ? "Published too often just now. Wait a minute, then try again." :
          "Couldn’t publish just now (" + (code || "unknown") + "). Try again in a minute." }));
      });
    });
    return el("div", { class: "owner" }, [publish, cancel]);
  }
  function read(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onerror = function () { show([el("p", { class: "error", text: "Couldn’t read that file." }), closeButton()]); };
    reader.onload = function () {
      var data = null, problem = "";
      try { data = JSON.parse(String(reader.result)); } catch (e) { problem = "That isn’t a pool page file (it isn’t readable JSON)."; }
      problem = problem || checkData(data);
      if (problem) { show([el("p", { class: "error", text: problem }), closeButton()]); return; }
      var older = data.through_week < LIVE.through_week;
      DATA = data;
      dataChanged();
      state.week = data.through_week;
      show([
        el("p", {}, [el("b", { text: "Preview: after week " + data.through_week }),
          " · " + plural(data.players.length, "coach", "coaches") + " · made " + when(data.generated) +
          ". Nobody else sees this until you publish."]),
        older ? el("p", { class: "error", text: "This file is older than the page (week " + data.through_week + ", the page shows week " + LIVE.through_week + ")." }) : null,
        publishing(data)
      ]);
    };
    reader.readAsText(file);
  }
  input.addEventListener("change", function () { read(input.files && input.files[0]); });
  document.body.appendChild(input);
  function ownerFooter() {
    if (ownerShown || LIVE.hosted) return null;
    return el("button", { class: "linkish", type: "button", onclick: startUpdate, text: "Page owner: update this page" });
  }
  function showOwnerButton() {
    var box = document.getElementById("owner");
    if (ownerShown || !box) return;
    ownerShown = true;
    box.appendChild(el("button", { class: "btn", type: "button", onclick: startUpdate, text: "Update this page" }));
    // A file dragged onto the page works too.
    var depth = 0;
    document.addEventListener("dragenter", function (e) {
      if (!e.dataTransfer || Array.prototype.indexOf.call(e.dataTransfer.types || [], "Files") < 0) return;
      depth++;
      document.body.classList.add("dropping");
    });
    document.addEventListener("dragleave", function () {
      depth = Math.max(0, depth - 1);
      if (!depth) document.body.classList.remove("dropping");
    });
    document.addEventListener("dragover", function (e) { e.preventDefault(); });
    document.addEventListener("drop", function (e) {
      e.preventDefault();
      depth = 0;
      document.body.classList.remove("dropping");
      read(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]);
    });
  }
  function settle(promise, ms) {
    return new Promise(function (resolve) {
      var done = false;
      function finish(v) { if (!done) { done = true; resolve(v); } }
      setTimeout(function () { finish(null); }, ms);
      Promise.resolve(promise).then(finish, function () { finish(null); });
    });
  }
  function isEditor(user) {
    if (!user) return Promise.resolve(null);
    var asks = [
      typeof user.canEdit === "function" ? user.canEdit() : null,
      typeof user.isOwner === "function" ? user.isOwner() : null,
      typeof user.can === "function" ? user.can("files.write") : null
    ];
    return Promise.all(asks.map(function (a) { return settle(a, 8000); })).then(function (r) {
      return r[0] === true || r[1] === true || r[2] === true;
    });
  }
  if (caps.checking) {
    Promise.all([settle(window.claude.use("user"), 12000), settle(window.claude.use("artifact"), 12000)])
      .then(function (found) {
        caps.artifact = found[1];
        return isEditor(found[0]).then(function (editor) { caps.editor = editor; });
      })
      .catch(function () { /* treated as a view that can't publish */ })
      .then(function () {
        caps.checking = false;
        if (caps.artifact && caps.editor) showOwnerButton();
        render();
      });
  }

})();
</script>
