name: Build standalone executables

# Produces a Windows .exe, a macOS .app and a Linux binary. PyInstaller cannot
# cross-compile, so each one is built on its own runner.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact: ACQL-Dashboard-windows
          - os: macos-latest
            label: macOS
            artifact: ACQL-Dashboard-macos
          - os: ubuntu-latest
            label: Linux
            artifact: ACQL-Dashboard-linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt's runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      - name: Build
        run: python packaging/build.py

      - name: Smoke-test the binary
        shell: bash
        run: |
          # Confirm the frozen app starts and shuts down cleanly rather than
          # only that a file was produced.
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN="dist/ACQL Dashboard.exe"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            BIN="dist/ACQL Dashboard.app/Contents/MacOS/ACQL Dashboard"
          else
            BIN="dist/ACQL Dashboard"
          fi
          test -e "$BIN" || { echo "No executable at $BIN"; ls -R dist; exit 1; }
          QT_QPA_PLATFORM=offscreen ACQL_SMOKE_TEST=1 "$BIN" || {
            echo "The frozen app failed to start."; exit 1; }
          echo "Started and exited cleanly."

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  release:
    name: Attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Zip each platform
        run: |
          cd artifacts
          for d in */; do (cd "$d" && zip -qr "../${d%/}.zip" .); done
          ls -la *.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
