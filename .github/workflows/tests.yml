name: Tests

# Every push and pull request: the test suites, the app's own checks, and a
# start-to-finish run of the window (every page drawn once, then closed).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: ubuntu-latest
            label: Linux
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt's runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: The dashboard's tests
        run: python tests/run_tests.py

      - name: The training ground's tests
        run: python tests/test_training.py

      - name: The PFM ratings feed and study (shadow only)
        run: python tests/test_pfm.py

      - name: The smaller suites (chaos, model lab, phone alerts, Sunday brief, calibration, game day live)
        run: |
          python tests/test_chaos.py
          python tests/test_model_lab.py
          python tests/test_pushalerts.py
          python tests/test_sunday.py
          python tests/test_calibration.py
          python tests/test_gameday_live.py

      - name: Operation Sunday (weekly learning and Thursday lock, shadow only)
        run: python tests/test_operation_sunday.py

      - name: The app's own checks
        run: python -m acql.checks

      - name: Open every page once
        run: python -m acql.ui.app --smoke-test
