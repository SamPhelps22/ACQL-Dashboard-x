<style id="pool-style">
/* tokens:begin - spacing, corners, labels, icon stroke and motion, shared with the
   dashboard window. Written from acql/ui/tokens.py each time the site is published. */
:root { --sp-1: 2px; --sp-2: 4px; --sp-3: 8px; --sp-4: 12px; --sp-5: 16px; --sp-6: 24px; --sp-7: 32px; --r-xs: 2px; --r-sm: 4px; --r-md: 6px; --r-lg: 10px; --r-pill: 999px; --label-size: 11px; --label-weight: 600; --label-tracking: 0.08em; --icon-stroke: 1.7; --motion: 150ms; --hover-tint: 45%; }
/* tokens:end */
/* ACQL - the pool's website. "Sunday broadcast": what's on air (the live
   week, the week's headline) wears the studio navy; everything else is quiet
   paper. Team colour only ever appears in the small team badges. */
:root {
  --ground: #f4f5f1;
  --surface: #ffffff;
  --raised: #f8f9f5;
  --ink: #101512;
  --ink-2: #3c4640;
  --muted: #5e6a62;
  --rule: #dbe0da;
  --rule-strong: #101512;
  --turf: #1d6a44;
  --turf-ink: #ffffff;
  --turf-soft: #e3f0e8;
  --gold: #efb32f;           /* fills and accents */
  --gold-text: #8a5d00;      /* gold that has to be read */
  --gold-soft: #fbf1db;
  --live: #d33a26;
  --good: #1d7a46;
  --bad: #b3361f;
  --onair: #0a0c0b;
  --onair-2: #151b17;
  --onair-ink: #f3f6fa;
  --onair-muted: #a9b3ab;
  --onair-rule: #2a332d;
  --me-mark: #b07a12;        /* the viewer's own line on a chart */
  --context: #bcc5be;        /* everyone else's */
  --context-strong: #6d7a70;
  --grid: #e6eae5;
  --shadow: 0 10px 30px rgba(10, 14, 11, 0.18);
  --rule-hover: color-mix(in srgb, var(--turf) var(--hover-tint), var(--rule));
  --display: "Big Shoulders", "Big Shoulders Display", "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0a0d0b;
    --surface: #131815;
    --raised: #1a211c;
    --ink: #f1f4f1;
    --ink-2: #c5cdc6;
    --muted: #98a39a;
    --rule: #263029;
    --rule-strong: #c5cdc6;
    --turf: #43c084;
    --turf-ink: #06120c;
    --turf-soft: #12301f;
    --gold: #f2b83a;
    --gold-text: #f2b83a;
    --gold-soft: #2a2312;
    --live: #ff6450;
    --good: #4fcb85;
    --bad: #ff7a64;
    --onair: #050706;
    --onair-2: #0d120f;
    --onair-ink: #f3f6fa;
    --onair-muted: #98a39a;
    --onair-rule: #263029;
    --me-mark: #f2b83a;
    --context: #36423a;
    --context-strong: #8a968c;
    --grid: #1b241e;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0a0d0b;
  --surface: #131815;
  --raised: #1a211c;
  --ink: #f1f4f1;
  --ink-2: #c5cdc6;
  --muted: #98a39a;
  --rule: #263029;
  --rule-strong: #c5cdc6;
  --turf: #43c084;
  --turf-ink: #06120c;
  --turf-soft: #12301f;
  --gold: #f2b83a;
  --gold-text: #f2b83a;
  --gold-soft: #2a2312;
  --live: #ff6450;
  --good: #4fcb85;
  --bad: #ff7a64;
  --onair: #050706;
  --onair-2: #0d120f;
  --onair-ink: #f3f6fa;
  --onair-muted: #98a39a;
  --onair-rule: #263029;
  --me-mark: #f2b83a;
  --context: #36423a;
  --context-strong: #8a968c;
  --grid: #1b241e;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; margin: 0; line-height: 1.02; text-wrap: balance; }
h1 { font-size: 40px; letter-spacing: 0.005em; }
h2 { font-size: 27px; }
h3 { font-size: 21px; }
p { margin: 0; }
a { color: inherit; }
.num { font-variant-numeric: tabular-nums; }
button, select, input { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, a:focus-visible, input:focus-visible, summary:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--turf);
  outline-offset: 2px;
}
.note { color: var(--muted); font-size: 14px; }
.sub { color: var(--muted); font-size: 14px; }
.lede { font-size: 17px; color: var(--ink-2); max-width: 62ch; }
.page { min-height: 100vh; display: flex; flex-direction: column; }

/* ---- the on-air bar ---------------------------------------------------------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--onair);
  color: var(--onair-ink);
  padding-top: env(safe-area-inset-top, 0px);
  border-bottom: 3px solid var(--gold);
}
.topbar .inner {
  max-width: 1180px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 10px 16px;
  padding: 8px 16px;
}
.brandmark { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; flex: none; }
.brandmark svg { width: 32px; height: 36px; display: block; }
.wordmark { font: 800 26px/1 var(--display); letter-spacing: 0.02em; }
.wordmark .yr { color: var(--gold); margin-left: 4px; }
.weekpill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font: 600 13px/1 var(--body);
  color: var(--onair-muted);
  border: 1px solid var(--onair-rule);
  border-radius: var(--r-pill);
  padding: 5px 10px;
  white-space: nowrap;
}
.weekpill.live { color: var(--onair-ink); border-color: var(--live); }
.weekpill.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--live); }
@media (prefers-reduced-motion: no-preference) {
  .weekpill.live::before, .dot-live { animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
}
/* a score that has just changed: one short gold wash, never on an unchanged score */
.score-new { border-radius: var(--r-sm); }
@media (prefers-reduced-motion: no-preference) {
  .score-new { animation: scorenew 2.4s ease-out 1; }
  @keyframes scorenew { 0% { background: color-mix(in srgb, var(--gold, #d4a017) 35%, transparent); } 100% { background: transparent; } }
}
@media (prefers-reduced-motion: reduce) { .score-new { outline: 1px solid var(--gold, #d4a017); } }
.desknav { display: flex; gap: 2px; margin-left: 6px; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.desknav::-webkit-scrollbar { display: none; }
.desknav a {
  padding: 8px 9px 7px;
  font: 700 18px/1 var(--display);
  letter-spacing: 0.01em;
  color: var(--onair-muted);
  text-decoration: none;
  border-bottom: 3px solid transparent;
  white-space: nowrap;
}
.desknav a:hover { color: var(--onair-ink); }
.desknav a[aria-current="page"] { color: var(--onair-ink); border-bottom-color: var(--gold); }
.topbar .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.mechip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--onair-rule);
  background: transparent;
  color: var(--onair-ink);
  border-radius: var(--r-pill);
  padding: 3px 12px 3px 3px;
  cursor: pointer;
  max-width: 44vw;
  text-decoration: none;
}
.mechip .initials, .initials {
  flex: none;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--turf);
  color: var(--turf-ink);
  font: 800 13px/1 var(--display);
  letter-spacing: 0.02em;
}
.mechip .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: 14px; }
.mechip.empty .initials { background: transparent; border: 1px dashed var(--onair-muted); color: var(--onair-muted); }
.iconbtn {
  border: 1px solid var(--onair-rule);
  background: transparent;
  color: var(--onair-ink);
  border-radius: var(--r-md);
  width: 36px;
  height: 34px;
  display: grid;
  place-items: center;
  cursor: pointer;
}
.iconbtn svg { width: 20px; height: 20px; }
#owner { display: flex; gap: 6px; }
#owner .btn { padding: 5px 10px; }

/* ---- the score ticker -------------------------------------------------------- */
.ticker { background: var(--onair-2); color: var(--onair-ink); border-bottom: 1px solid var(--onair-rule); }
.ticker .track {
  max-width: 1180px;
  margin: 0 auto;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 6px 16px;
  scrollbar-width: none;
  scroll-snap-type: x proximity;
}
.ticker .track::-webkit-scrollbar { display: none; }
.bug {
  flex: none;
  scroll-snap-align: start;
  display: grid;
  grid-template-columns: auto auto;
  align-items: center;
  column-gap: 10px;
  row-gap: 2px;
  min-width: 112px;
  padding: 5px 8px 6px;
  background: var(--onair);
  border-radius: var(--r-xs);
  border-top: 2px solid var(--onair-rule);
  font-variant-numeric: tabular-nums;
}
.bug.in { border-top-color: var(--live); }
.bug .state { grid-column: 1 / -1; font: 700 11px/1.2 var(--body); color: var(--onair-muted); letter-spacing: 0.02em; white-space: nowrap; }
.bug.in .state { color: var(--live); }
.bug .pts { font: 800 17px/1 var(--display); text-align: right; color: var(--onair-muted); }
.bug .credited + .pts, .bug .pts.credited { color: var(--onair-ink); }
.bug .side { display: flex; align-items: center; gap: 5px; }
.bug .side.credited::after { content: "\2713"; color: var(--gold); font-weight: 700; font-size: 12px; }

/* team badges: the team's colour, its letters, a stripe of its second colour */
.tb {
  display: inline-grid;
  place-items: center;
  min-width: 34px;
  height: 21px;
  padding: 0 5px 0 7px;
  border-radius: var(--r-xs);
  font: 800 13px/1 var(--display);
  letter-spacing: 0.05em;
  background: var(--c1, #556);
  color: var(--ct, #fff);
  box-shadow: inset 3px 0 0 var(--c2, rgba(255,255,255,0.4));
  white-space: nowrap;
  vertical-align: middle;
}
.tb.lg { min-width: 44px; height: 28px; font-size: 16px; }
/* the team's logo, ahead of its badge; hidden again if it can't be fetched */
.tl { width: 22px; height: 22px; object-fit: contain; flex: none; vertical-align: middle; }
.tl.lg { width: 30px; height: 30px; }
.logo { display: inline-flex; align-items: center; gap: 5px; vertical-align: middle; }
.ticker .tb, .hero .tb, .tape .tb, .toast .tb { box-shadow: inset 3px 0 0 var(--c2, rgba(255,255,255,0.4)), 0 0 0 1px rgba(255, 255, 255, 0.16); }
.team { display: inline-flex; align-items: center; gap: 7px; }

/* ---- the page ------------------------------------------------------------------ */
main {
  flex: 1;
  width: 100%;
  max-width: 1180px;
  margin: 0 auto;
  padding: 18px 16px calc(96px + env(safe-area-inset-bottom, 0px));
}
.view { display: grid; gap: 30px; }
.view > * { min-width: 0; }
.pagehead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; }
.pagehead h1 { font-size: 40px; position: relative; padding-bottom: 10px; }
.pagehead h1::after { content: ""; position: absolute; left: 0; bottom: 0; width: 44px; height: 4px; border-radius: var(--r-xs); background: var(--gold); }
.cols { display: grid; gap: 30px; }
.cols > * { min-width: 0; display: grid; gap: 30px; align-content: start; }
@media (min-width: 960px) {
  .cols { grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 36px; }
  .cols.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
}

/* a module: a heading on a heavy rule, then its content - no box around it */
.module { display: grid; gap: 12px; align-content: start; }
.module > * { min-width: 0; }
.module > .mhead {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 4px 14px;
  border-top: 3px solid var(--rule-strong);
  padding-top: 8px;
}
.module > .mhead h2 { font-size: 24px; }
.module > .mhead .aside { color: var(--muted); font-size: 14px; }
.box {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--r-md);
  padding: 14px 16px;
  display: grid;
  gap: 10px;
}
.box > * { min-width: 0; }

/* the announcement */
.notice {
  background: var(--gold-soft);
  border-left: 5px solid var(--gold);
  padding: 12px 16px;
  display: grid;
  gap: 2px;
}
.deadline { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 16px; padding: 12px 16px; border: 1px solid var(--rule); border-left: 5px solid var(--turf); background: var(--surface); }
.deadline .dl-label { font: 700 11px/1.4 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.deadline .dl-count { grid-row: span 2; font: 800 30px/1 var(--display); letter-spacing: 0.02em; color: var(--ink); }
.deadline .dl-when { font-weight: 600; color: var(--ink-2); }
.deadline.soon { border-left-color: var(--live); }
.deadline.soon .dl-count { color: var(--live); }
.notice::before { content: "League notice"; font: 700 11px/1.4 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold-text); }
.notice b { font-family: var(--display); font-size: 19px; font-weight: 800; }
.notice .when { color: var(--muted); font-size: 13px; }

/* ---- the lower third: the one loud thing on a page ------------------------------ */
.hero {
  position: relative;
  background: var(--onair);
  color: var(--onair-ink);
  padding: 18px 44px 22px 22px;
  clip-path: polygon(0 0, 100% 0, calc(100% - 26px) 100%, 0 100%);
  border-left: 7px solid var(--gold);
  display: grid;
  gap: 6px;
  overflow: hidden;
}
.hero::after {
  content: "";
  position: absolute;
  right: 40px;
  top: 0;
  bottom: 0;
  width: 70px;
  background: var(--gold);
  transform: skewX(-14deg);
  opacity: 0.12;
  pointer-events: none;
}
.hero .kicker { font: 700 15px/1.2 var(--body); color: var(--gold); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.hero .kicker .live-tag { background: var(--live); color: #fff; font: 800 13px/1 var(--display); letter-spacing: 0.06em; padding: 4px 7px 3px; border-radius: var(--r-xs); }
.hero h1, .hero h2 { font-size: clamp(34px, 7.6vw, 64px); line-height: 0.96; max-width: 20ch; }
.hero .deck { color: var(--onair-muted); font-size: 17px; max-width: 62ch; }
.hero .deck b { color: var(--onair-ink); font-weight: 600; }
/* on Weeks the week's story is a header, not the page's one loud thing again */
.hero.compact { padding-top: 14px; padding-bottom: 16px; }
.hero.compact h2 { font-size: clamp(26px, 5vw, 40px); max-width: 26ch; }
.hero.compact .deck { font-size: 15px; }
.hero.compact .stat .v { font-size: 24px; }
.hero .stats { display: flex; flex-wrap: wrap; gap: 10px 26px; margin-top: 8px; }
.hero .stat { display: grid; gap: 0; }
.hero .stat .v { font: 800 30px/1 var(--display); color: var(--onair-ink); }
.hero .stat .k { font-size: 13px; color: var(--onair-muted); }
.hero .btn { justify-self: start; margin-top: 6px; }
.hero-main { display: grid; gap: 6px; min-width: 0; align-content: center; position: relative; z-index: 1; }
.hero-side { min-width: 0; position: relative; z-index: 1; }
/* the hero's numbers: a 2 x 2 scoreboard, beside the headline on a wide screen */
.hero.sided .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; margin-top: 12px; border-top: 1px solid var(--onair-rule); }
.hero.sided .stat { padding: 11px 12px 11px 0; border-bottom: 1px solid var(--onair-rule); align-content: start; }
.hero.sided .stat:nth-child(even) { padding-left: 14px; border-left: 1px solid var(--onair-rule); }
.hero.sided .stat .v { font-size: 36px; letter-spacing: 0.01em; }
.hero.sided .stat .k { margin-top: 3px; line-height: 1.25; }
.hero .stat.money.up .v { color: #5fd391; }
.hero .stat.lead .v { color: var(--gold); }
.hero .stat.alarm .v { color: #ff6b5b; }
.hero .stat.alarm .k { color: #ffb3aa; }
.hero .hero-foot { font-size: 14px; color: var(--onair-muted); margin-top: 4px; }
@media (min-width: 900px) {
  .hero.sided { grid-template-columns: minmax(0, 1fr) minmax(250px, 320px); column-gap: 44px; align-items: center; padding: 24px 72px 26px 28px; }
  .hero.sided .stats { margin-top: 0; background: var(--onair-2); border: 1px solid var(--onair-rule); border-radius: var(--r-sm); padding: 2px 18px; }
  .hero.sided .stat:nth-last-child(-n+2) { border-bottom: 0; }
  .hero.sided .stat .v { font-size: 42px; }
}
@media (prefers-reduced-motion: no-preference) {
  .hero.enter { animation: wipe 560ms cubic-bezier(0.2, 0.7, 0.2, 1) both; }
  /* @keyframes wipe: defined once, with the cut-corner panel further down */
}

/* every hover and focus change eases in the same time */
@media (prefers-reduced-motion: no-preference) {
  .btn, .chip, .seg button, .weeks button, .namegrid button, .filter, .vs select, .module, .jumpbar a,
  .searchbtn, .iconbtn, .linkish, .more-link, .who-link, .desknav a, .sheet .group a, .weekpill {
    transition: border-color var(--motion) ease, background-color var(--motion) ease, color var(--motion) ease;
  }
}
/* buttons */
.btn {
  border: 1px solid var(--rule);
  background: var(--surface);
  color: var(--ink);
  border-radius: var(--r-md);
  padding: var(--sp-3) var(--sp-5);
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.btn:hover { border-color: var(--rule-hover); }
.btn svg { width: 18px; height: 18px; flex: none; }
.ico { stroke-width: var(--icon-stroke); }
.btn:disabled { opacity: 0.6; cursor: default; }
.btn.primary { background: var(--turf); border-color: var(--turf); color: var(--turf-ink); }
.btn.onair { background: transparent; border-color: var(--onair-rule); color: var(--onair-ink); }
.btn.onair:hover { border-color: var(--gold); }
.linkish { border: 0; background: none; padding: 0; color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.linkish:hover { color: var(--turf); text-underline-offset: 3px; }
.more-link { font-weight: 600; color: var(--turf); text-decoration: none; justify-self: start; }
.more-link:hover { color: var(--turf); text-decoration: underline; text-underline-offset: 3px; }
.who-link { border: 0; background: none; padding: 0; margin: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; }
.who-link:hover { color: var(--turf); text-decoration: underline; text-underline-offset: 3px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: var(--r-md); overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--ground); }
.weeks { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.weeks button {
  border: 1px solid var(--rule);
  background: var(--surface);
  border-radius: var(--r-sm);
  min-width: 36px;
  padding: 5px 8px;
  cursor: pointer;
  font: 700 17px/1 var(--display);
}
.weeks button[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }

/* ---- rows: the default way to list things ------------------------------------------ */
.rows { display: grid; }
.rows > .r {
  display: grid;
  align-items: center;
  gap: 4px 12px;
  padding: 10px 2px;
  border-bottom: 1px solid var(--rule);
}
.rows > .r:last-child { border-bottom: 0; }
.rows > .r.me { background: var(--gold-soft); box-shadow: inset 4px 0 0 var(--gold); padding-left: 12px; padding-right: 8px; }
.r .pos { font: 800 22px/1 var(--display); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.r .name { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.r .big { font: 800 24px/1 var(--display); text-align: right; font-variant-numeric: tabular-nums; }
.r .meta { color: var(--muted); font-size: 13px; }
.r .meta b { color: var(--ink-2); font-weight: 600; }
.youtag { font: 800 11px/1 var(--display); letter-spacing: 0.06em; background: var(--gold); color: #0a0c0b; padding: 3px 5px 2px; border-radius: var(--r-xs); margin-left: 6px; vertical-align: 2px; }
:root[data-text="l"] body { zoom: 1.12; }
:root[data-text="xl"] body { zoom: 1.25; }
/* the bars keep their size: their buttons are big enough, and wider ones run off a phone */
:root[data-text="l"] .topbar, :root[data-text="l"] .bottombar { zoom: 0.893; }
:root[data-text="xl"] .topbar, :root[data-text="xl"] .bottombar { zoom: 0.8; }
.trophies { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.trophy { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1px solid var(--rule); border-radius: var(--r-md); background: var(--raised); }
.trophies.shelf { grid-template-columns: 1fr; gap: 8px; }
.trophy.title { border-color: var(--gold); }
.trophy.mine { border-color: var(--gold); background: var(--gold-soft); }
.trophy .ic { font-size: 26px; line-height: 1; flex: none; }
.trophy > div { display: grid; gap: 3px; min-width: 0; }
.trophy b { font: 800 15px/1.1 var(--display); letter-spacing: 0.04em; text-transform: uppercase; }
.trophy .who { font-weight: 600; overflow-wrap: anywhere; }
.form { flex: none; font-size: 0.95em; line-height: 1; margin-left: 4px; cursor: help; }
.podname { display: inline-flex; align-items: center; gap: 2px; max-width: 100%; }

/* standings rows */
.standrows > .r { grid-template-columns: 30px 30px minmax(0, 1fr) auto; }
.standrows .mv { font-size: 13px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
.standrows .meta { grid-column: 3 / -1; }
@media (min-width: 720px) {
  .standrows > .r { grid-template-columns: 34px 34px minmax(0, 1fr) 70px 62px 64px 70px 92px; }
  .standrows .meta { display: none; }
}
.standrows .col { display: none; text-align: right; font-variant-numeric: tabular-nums; }
@media (min-width: 720px) { .standrows .col { display: block; } }
.standrows .hdr { font-size: 12px; color: var(--muted); font-weight: 600; padding-top: 0; padding-bottom: 6px; }
.standrows .hdr .col, .standrows .hdr .big { font: 600 12px var(--body); color: var(--muted); }
.rows > .r.avgtop { border-top: 2px dashed var(--context-strong); }
.up { color: var(--good); }
.down { color: var(--bad); }
.flat { color: var(--muted); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
/* words for screen readers where the page shows only a mark */
.vh { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
.dot.alive { background: var(--turf); }
.dot.out { background: var(--muted); opacity: 0.4; }
.star { color: var(--gold-text); }

/* ---- tables --------------------------------------------------------------------- */
.scroll-wrap { position: relative; }
.scroll { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--r-md); background: var(--surface); }
.scroll-wrap::after {
  content: "";
  position: absolute;
  top: 1px;
  bottom: 1px;
  right: 1px;
  width: 28px;
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
  background: linear-gradient(to right, transparent, rgba(10, 14, 11, 0.18));
  pointer-events: none;
  opacity: 0;
  transition: opacity 150ms;
}
.scroll-wrap.more::after { opacity: 1; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--rule); white-space: nowrap; background: var(--surface); }
tbody tr:last-child td { border-bottom: 0; }
th { font: 600 12px var(--body); color: var(--muted); }
td.n, th.n { text-align: right; }
td.coach { font-weight: 600; }
td.total { font: 800 19px var(--display); }
td.latest, th.latest { background: var(--turf-soft); }
.stick-a { position: sticky; left: 0; z-index: 1; width: 44px; min-width: 44px; max-width: 44px; }
.stick-b { position: sticky; left: 44px; z-index: 1; box-shadow: 1px 0 0 var(--rule); }
tr.me td { background: var(--gold-soft); }
tr.me td.coach { box-shadow: inset 4px 0 0 var(--gold); }
tr.me td.stick-b { box-shadow: inset 4px 0 0 var(--gold), 1px 0 0 var(--rule); }
td.pk { text-align: center; font: 700 12px var(--body); color: var(--muted); }
td.pk.ok { background: var(--turf-soft); color: var(--good); }
td.pk.no { color: var(--bad); text-decoration: line-through; opacity: 0.8; }
td.pk.ok.live, td.pk.no.live { font-style: italic; }
td.pk.no.live { text-decoration: none; }
th.gk { text-align: center; font-size: 11px; }
/* everyone's picks: a row a coach, a column a game */
#picks-table .stick-b { left: 0; }
#picks-table td.pk, #picks-table th.gk { padding-left: 6px; padding-right: 6px; }
@media (max-width: 719px) {
  #picks-table td.coach .who-link, #picks-side td.coach .who-link { display: inline-block; max-width: 7.4em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
  #picks-side td.coach .who-link { max-width: 6.6em; }
  #picks-side .tb { min-width: 30px; padding: 0 4px 0 6px; font-size: 12px; }
  #picks-side td.sidepicks .sp { margin-right: 5px; gap: 3px; }
  /* how the pool picked: no room for a tag beside the count, so "you: DAL" goes under the bar */
  .split .side .mine-pick { display: none; }
}
@media (max-width: 380px) { .split .at { visibility: hidden; } }
.split .lineinfo .you { color: var(--gold-text); font-weight: 700; }
th.gk span { display: block; line-height: 1.35; }
th.gk span.won { color: var(--good); }
th.gk span.live { font-style: italic; }
td.pk.apart { box-shadow: inset 0 -2px 0 var(--gold); }
td.pk small { display: inline-block; width: 100%; font: 600 10px/1.3 var(--body); color: var(--muted); }
tr.crowd td { border-bottom-color: var(--context-strong); }
tr.crowd td.pk { white-space: normal; }
tr.crowd td.pk:not(.ok):not(.no) { color: var(--ink); }
td.sidepicks .sp { display: inline-flex; align-items: center; gap: 4px; margin: 2px 10px 2px 0; font-size: 13px; }
.sui-ok { color: var(--good); font-weight: 600; }
.sui-no { color: var(--bad); font-weight: 600; }
.box table td, .box table th { padding: 6px 8px 6px 0; background: transparent; }
.split-row td { white-space: normal; min-width: 6em; }
.split-row td.ok { color: var(--good); font-weight: 600; }
.split-row td.no { color: var(--bad); }
td.won-it { font-weight: 700; }
td.game, td.winner { white-space: normal; }

/* ---- the week being played ---------------------------------------------------- */
.live-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.live-status { color: var(--muted); font-size: 14px; }
.live-status.bad { color: var(--bad); }
.live-status .linkish { margin-left: 6px; padding: 0; border: 0; background: none; color: var(--turf); text-decoration: underline; cursor: pointer; font-size: inherit; }
/* empty and error states: what's missing, why, and what to do about it */
.state-msg { display: grid; gap: 4px; justify-items: start; margin: 8px 0; padding: 12px 14px; border: 1px solid var(--rule); border-left: 3px solid var(--muted); border-radius: var(--r-sm); }
.state-msg strong { font-size: 15px; }
.state-msg .btn { margin-top: 6px; }
.state-msg.bad { border-left-color: var(--bad); }
.state-msg.bad strong { color: var(--bad); }
.dot-live { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--live); margin-right: 6px; vertical-align: 1px; }
/* ---- a game, as a scoreboard card ------------------------------------------------- */
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 12px; }
.gcard {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--r-md);
  padding: 12px 14px 11px;
  display: grid;
  gap: 7px;
  align-content: start;
  overflow: hidden;
  box-shadow: 0 1px 2px rgba(13, 27, 44, 0.06);
  grid-template-columns: minmax(0, 1fr);
}
.gcard > * { min-width: 0; }
.gcard::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--rule); }
.gcard.in::before { background: var(--live); }
.gcard.post::before { background: var(--ink-2); }
.gcard.rz::before { height: 6px; }
.gcard .top { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-height: 20px; }
.gcard .when { color: var(--muted); font: 700 12px/1.2 var(--body); letter-spacing: 0.02em; text-transform: uppercase; }
.gcard .when.in { color: var(--live); }
.gcard .when .dot-live { width: 7px; height: 7px; margin-right: 5px; }
.gcard .tv { margin-left: auto; color: var(--muted); font: 700 11px/1 var(--body); letter-spacing: 0.04em; border: 1px solid var(--rule); border-radius: var(--r-xs); padding: 3px 5px; }
.gcard .rztag, .bug.rz .state::after { background: var(--live); color: #fff; font: 800 11px/1 var(--display); letter-spacing: 0.06em; padding: 3px 5px 2px; border-radius: var(--r-xs); }
.gcard .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-variant-numeric: tabular-nums; }
.gcard .row .team { min-width: 0; gap: 9px; }
.gcard .row .team b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 700 20px/1.1 var(--display); letter-spacing: 0.01em; }
.gcard .row.credit .team::after { content: "\2713"; flex: none; margin-left: -3px; color: var(--good); font: 700 16px/1 var(--body); }
.gcard .row .pts { font: 800 32px/1 var(--display); color: var(--ink); min-width: 1.6ch; text-align: right; }
.gcard .row.lost .pts { color: var(--muted); }
.gcard .row .rec { color: var(--muted); font: 600 13px/1 var(--body); }
.gcard .row.picked .tb { box-shadow: inset 3px 0 0 var(--c2, rgba(255,255,255,0.4)), 0 0 0 2px var(--surface), 0 0 0 4px var(--gold); }
.gcard .play { margin: 0; font-size: 13px; line-height: 1.35; color: var(--ink-2); border-left: 2px solid var(--rule); padding-left: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.gcard .down { font: 700 15px/1.2 var(--body); color: var(--ink); }
.gcard.rz .down { color: var(--live); }
.gcard .gline { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; border-top: 1px solid var(--rule); padding-top: 8px; margin-top: 1px; }
.gcard .line { color: var(--muted); font-size: 12px; font-weight: 600; }
.gcard .stand { font: 700 12px/1.2 var(--body); padding: 3px 8px; border-radius: var(--r-pill); background: var(--raised); color: var(--ink-2); }
.gcard .stand.good { background: var(--turf-soft); color: var(--good); }
.gcard .stand.warn { background: var(--gold-soft); color: var(--gold-text); }
.gcard .chance { display: grid; grid-template-columns: auto minmax(30px, 1fr) auto; align-items: center; gap: 8px; font: 700 12px/1 var(--body); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.gcard .chance .p.fav { color: var(--ink); }
.gcard .chance .track { display: flex; gap: 2px; height: 8px; }
.gcard .chance .track i { display: block; height: 100%; border-radius: var(--r-xs); background: var(--context); min-width: 2px; }
.gcard .chance .track i.fav { background: var(--ink-2); }
.gcard .chance .track i.mine { background: var(--gold); }
.gcard .meta { color: var(--muted); font-size: 12px; }
.gcard .you { color: var(--gold-text); font-weight: 600; }
/* the strip of field: end zones, the red zone, the line of scrimmage, the line to gain, the ball */
.field {
  position: relative;
  height: 24px;
  border-radius: var(--r-xs);
  overflow: hidden;
  background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.3) 0 1px, transparent 1px 8.3333%), #2f7b4d;
}
.field .ez { position: absolute; top: 0; bottom: 0; width: 8.3333%; display: grid; place-items: center; background: #1e5434; color: rgba(255, 255, 255, 0.9); font: 800 9px/1 var(--display); letter-spacing: 0.04em; }
.field .ez.l { left: 0; }
.field .ez.r { right: 0; }
.field .zone { position: absolute; top: 0; bottom: 0; background: rgba(255, 90, 70, 0.32); }
.field .los { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #62b0ff; }
.field .gain { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: #ffd60a; }
.field .fball { position: absolute; top: 50%; width: 15px; height: 9px; margin: -4.5px 0 0 -7.5px; border-radius: 50%; background: #8d4f22; box-shadow: 0 0 0 1.5px #fff; }
.field .fball::after { content: ""; position: absolute; top: 50%; margin-top: -4px; border: 4px solid transparent; }
.field .fball.right::after { left: 100%; margin-left: 3px; border-left: 6px solid #fff; border-right-width: 0; }
.field .fball.left::after { right: 100%; margin-right: 3px; border-right: 6px solid #fff; border-left-width: 0; }
/* the ball: who has it */
.ball { flex: none; display: inline-block; width: 13px; height: 8px; border-radius: 50%; background: #9a5b2a; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.6); }
.bug.rz .state::after { content: "RZ"; margin-left: 6px; font-size: 10px; padding: 2px 4px 1px; vertical-align: 1px; }
/* the week board: the chance of winning, and the money if it ended now */
.weekboard .odds { display: grid; justify-items: end; gap: 4px; font-variant-numeric: tabular-nums; }
.weekboard .odds b { font: 800 18px/1 var(--display); }
.weekboard .odds .cash { font: 700 12px/1 var(--body); padding: 3px 7px; border-radius: var(--r-pill); background: var(--raised); }
.weekboard .odds .cash.up { background: var(--turf-soft); }
.weekboard .hdr .odds { gap: 1px; }
.weekboard .r.lead .pos { color: var(--gold-text); }
.weekboard .hdr .odds span { font: 600 12px var(--body); color: var(--muted); padding: 0; background: none; }
/* a coach's week in four numbers */
.minis { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 8px; }
.mini-fig { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4); display: grid; gap: 4px; align-content: start; }
.mini-fig .v { font: 800 28px/1 var(--display); font-variant-numeric: tabular-nums; }
.mini-fig .k { font-size: 12px; color: var(--muted); line-height: 1.25; }
.mini-fig.money.up .v { color: var(--good); }
/* the rooting guide: what to root for, and what it does to the chance of the week */
.roots { display: grid; }
.root { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; row-gap: 3px; padding: 11px 0; border-bottom: 1px solid var(--rule); }
.root:last-child { border-bottom: 0; }
.root .team { grid-column: 1; grid-row: 1; min-width: 0; gap: 9px; align-items: flex-start; }
.root .team .tb { flex: none; }
.root .team b { font: 700 19px/1.15 var(--display); letter-spacing: 0.01em; padding-top: 3px; }
.root .swing { grid-column: 2; grid-row: 1 / span 2; align-self: center; font: 800 26px/1 var(--display); color: var(--good); font-variant-numeric: tabular-nums; }
.root .meta { grid-column: 1; grid-row: 2; color: var(--muted); font-size: 13px; padding-left: 53px; }
.root .jump { grid-column: 1 / -1; grid-row: 3; display: flex; align-items: center; gap: 9px; padding-left: 53px; color: var(--ink-2); font-size: 13px; }
.root .mini { flex: none; position: relative; width: 72px; height: 8px; border-radius: var(--r-sm); background: var(--rule); overflow: hidden; }
.root .mini i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: var(--r-sm); }
.root .mini i.so { background: var(--gold); }
.root .mini i.not { background: var(--ink-2); }
@media (max-width: 420px) { .root .meta, .root .jump { padding-left: 0; } }
.cash.up { color: var(--good); }
.cash.down { color: var(--muted); }
.cash.flat { color: var(--muted); }
.final-banner { background: var(--gold-soft); border-left: 5px solid var(--gold); padding: 12px 16px; display: grid; gap: 2px; }
.final-banner b { font-family: var(--display); font-size: 26px; font-weight: 800; }
.final-banner .btn { justify-self: start; margin-top: 6px; }

/* the pick lists (Big Losers, suicide, long shots) */
.picks-list { display: grid; gap: 8px; }
.pick-row { display: grid; gap: 2px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); }
.pick-row:last-child { border-bottom: 0; padding-bottom: 0; }
.pick-row .top { display: flex; align-items: center; justify-content: space-between; gap: 4px 12px; }
.pick-row .top b { font-weight: 600; }
.pick-row .count { font: 800 16px/1 var(--display); color: var(--muted); white-space: nowrap; }
.pick-row.mine { background: var(--gold-soft); border-radius: var(--r-sm); padding: 6px 8px; border-bottom-color: transparent; }
.pick-row .names { font-size: 13px; color: var(--ink-2); }
.pick-row .names mark { background: none; color: var(--ink); font-weight: 700; }
.pick-row details { font-size: 13px; }
.pick-row summary { cursor: pointer; color: var(--muted); }
.pick-row details .names { margin-top: 2px; }
.picks-more > summary { cursor: pointer; color: var(--turf); font-weight: 600; font-size: 14px; padding-top: 2px; }
.picks-more[open] > summary { margin-bottom: 8px; }
.state { font-size: 13px; color: var(--ink-2); }
.state.good { color: var(--good); font-weight: 600; }
.state.bad { color: var(--bad); font-weight: 600; }
.state.muted { color: var(--muted); }
.state.live { font-style: italic; }
.week-card table td { vertical-align: top; white-space: normal; }
.week-card td.game { min-width: 6.5em; }
.week-card td.coach { min-width: 5em; }
.week-card td.state { min-width: 6em; }
.week-card td .sub { display: block; font-size: 12px; color: var(--muted); }

/* how the pool picked: one bar per game, the split between the two sides */
.splits { display: grid; gap: 2px; }
.split {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  gap: 4px 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--rule);
}
.split:last-child { border-bottom: 0; }
.split .side { display: flex; align-items: center; gap: 8px; min-width: 0; }
.split .side.home { justify-content: flex-end; }
.split .side .n { font: 800 20px/1 var(--display); font-variant-numeric: tabular-nums; }
.split .side .mine-pick { font: 800 11px/1 var(--display); letter-spacing: 0.06em; background: var(--gold); color: #0a0c0b; padding: 3px 5px 2px; border-radius: var(--r-xs); }
.split .at { color: var(--muted); font-size: 13px; }
.split .barline { grid-column: 1 / -1; display: flex; height: 6px; gap: 2px; }
.split .barline span { display: block; border-radius: var(--r-xs); background: var(--context); }
.split .barline span.lead { background: var(--ink-2); }
.split .lineinfo { grid-column: 1 / -1; color: var(--muted); font-size: 12px; text-align: center; }

/* ---- side pools --------------------------------------------------------------------- */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--rule); border-radius: var(--r-pill); padding: var(--sp-1) var(--sp-4); background: var(--surface); font-size: 14px; }
.chip.alive { border-color: var(--turf); background: var(--turf-soft); }
/* three or fewer left in the suicide pool: they get a headline, not chips */
.survivor { display: grid; gap: 4px; padding: 12px 14px; background: var(--turf-soft); border-left: 5px solid var(--turf); border-radius: var(--r-sm); }
.survivor .k { font: 700 11px/1.4 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.survivor .names { display: flex; flex-wrap: wrap; gap: 2px 18px; }
.survivor b { font: 800 clamp(24px, 5vw, 32px)/1.05 var(--display); }
.survivor b.me { color: var(--gold-text); }
/* the leader's bar, in gold */
.bar.top { background: var(--gold); }
.chip.me { border-color: var(--gold); background: var(--gold-soft); font-weight: 600; }
.chip.strong { border-color: var(--turf); font-weight: 600; }
.grave { display: grid; gap: 8px; }
.grave-row { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 10px; align-items: baseline; }
.grave-row .when { font: 700 16px var(--display); color: var(--muted); }
.grave-row .who { color: var(--ink-2); }
.grave-row .who b { color: var(--ink); font-weight: 600; }
.grave-row .who mark { background: var(--gold-soft); color: var(--ink); font-weight: 600; border-radius: var(--r-xs); padding: 0 2px; }
.sboard { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.scard { border: 1px solid var(--rule); border-radius: var(--r-sm); padding: var(--sp-3) var(--sp-4); display: grid; gap: 4px; align-content: start; background: var(--surface); }
.scard.me { border-color: var(--gold); background: var(--gold-soft); }
.scard .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.scard .top .who-link { font-weight: 600; }
.scard .small { font-size: 13px; color: var(--ink-2); }
.scard .thin { color: var(--bad); font-weight: 600; }
.scard details { font-size: 13px; }
.scard summary { cursor: pointer; color: var(--muted); }
.scard .chips { margin-top: 6px; gap: 4px; }
.scard .chip { font-size: 12px; padding: 1px 7px; }
/* the survivor wall: a row of logos a coach, the knocked-out greyed */
.swall { overflow-x: auto; }
.swall table { border-collapse: separate; border-spacing: 0 3px; min-width: 100%; }
.swall th { font-size: 11px; font-weight: 600; color: var(--muted); text-align: center; padding: 0 2px; }
.swall td { padding: 0 2px; text-align: center; vertical-align: middle; }
.swall td.coach, .swall th.coach { text-align: left; position: sticky; left: 0; background: var(--surface); padding-right: 10px; white-space: nowrap; z-index: 1; }
.swall tr.me td.coach { color: var(--gold); }
.swall .cell { width: 30px; height: 30px; border-radius: var(--r-sm); display: inline-grid; place-items: center; position: relative; background: var(--surface-2, rgba(127,127,127,.08)); }
.swall .cell img { width: 26px; height: 26px; object-fit: contain; }
.swall .cell .tb { font-size: 9px; }
.swall .cell.lost { background: color-mix(in srgb, var(--bad) 22%, transparent); }
.swall .cell.lost::after { content: ""; position: absolute; inset: 3px; background:
  linear-gradient(45deg, transparent 46%, var(--bad) 46% 54%, transparent 54%),
  linear-gradient(-45deg, transparent 46%, var(--bad) 46% 54%, transparent 54%); }
.swall .cell.now { outline: 2px dashed var(--gold); outline-offset: -2px; }
.swall .cell.gone { background: none; }
.swall tr.out .cell:not(.lost) > * { filter: grayscale(1); opacity: .55; }
.swall tr.out td.coach { color: var(--muted); }
.swall tr.out td.coach a { color: inherit; }
.swall tr.cut td { border-top: 1px solid var(--rule); padding-top: 6px; }
/* the power map */
.pmap svg image { cursor: default; }
.pmap .quad { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; fill: var(--muted); opacity: .8; }
.pmap .axis { stroke: var(--rule); }
.pmap .fit { stroke: var(--gold); stroke-dasharray: 4 4; opacity: .7; }
.pmap .spot { fill: var(--gold); opacity: .18; }
.pmap-lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 8px; }
.pmap-lists .chips { gap: 6px; }
.bar { height: 6px; border-radius: var(--r-xs); background: var(--turf); }
.bar-cell { width: 40%; min-width: 80px; }
.race-sum { color: var(--ink-2); }
td.pct { font: 800 17px var(--display); }
td.gone, span.gone { color: var(--muted); }
.close-one { display: grid; gap: 2px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); }
.close-one:last-of-type { border-bottom: 0; padding-bottom: 0; }
.close-one .who { font-weight: 600; }
.close-one ul { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 14px; }
.award { display: grid; gap: 1px; padding: 8px 0; border-bottom: 1px solid var(--rule); }
.award:last-child { border-bottom: 0; }
.award .t { font: 700 11px/1.4 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold-text); }
.award .w { font: 800 18px/1.2 var(--display); }
.award .why { color: var(--ink-2); font-size: 14px; }
.upset { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 8px 0; border-bottom: 1px solid var(--rule); }
.upset:last-child { border-bottom: 0; }
.upset .game { font-weight: 600; }
.upset .had { font: 800 18px var(--display); color: var(--bad); text-align: right; }
.upset .how { color: var(--ink-2); font-size: 14px; grid-column: 1 / -1; }
/* how much of the pool had the winner, as a bar: 0 of 35 reads at a glance */
.upset .share { grid-column: 1 / -1; height: 4px; border-radius: var(--r-xs); background: var(--rule); overflow: hidden; }
.upset .share i { display: block; height: 100%; min-width: 2px; background: var(--bad); }
/* the week's stories sit two across when the card is wide enough */
.awards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); column-gap: 28px; }
.awards .award:last-child { border-bottom: 1px solid var(--rule); }
/* the replay keeps its chart's height while it loads, so nothing below jumps */
.chart-wait { min-height: 230px; display: grid; place-items: center; border: 1px dashed var(--rule); border-radius: var(--r-md); }
@media (prefers-reduced-motion: no-preference) {
  /* bars grow out from zero, so the eye reads them as amounts */
  .bar, .upset .share i { transform-origin: left center; animation: grow 700ms cubic-bezier(.2, .7, .2, 1) both; }
  @keyframes grow { from { transform: scaleX(0); } }
  /* the stories arrive one after another */
  .awards .award { animation: settle 360ms ease-out both; }
  .awards .award:nth-child(2) { animation-delay: 50ms; }
  .awards .award:nth-child(3) { animation-delay: 100ms; }
  .awards .award:nth-child(4) { animation-delay: 150ms; }
  .awards .award:nth-child(5) { animation-delay: 200ms; }
  .awards .award:nth-child(n+6) { animation-delay: 250ms; }
  @keyframes settle { from { opacity: 0; transform: translateY(6px); } }
  /* the replay placeholder breathes, so it reads as working, not empty */
  .chart-wait .note { animation: breathe 1.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: 0.4; } }
}

/* ---- head-to-head: the tale of the tape ------------------------------------------- */
.vs { display: grid; grid-template-columns: minmax(0, 14em) auto minmax(0, 14em) auto; align-items: center; justify-content: start; gap: 8px; }
.vs select { border: 1px solid var(--rule); background: var(--surface); border-radius: var(--r-md); padding: var(--sp-3); width: 100%; min-width: 0; font-weight: 600; }
.vs .and { font: 800 18px var(--display); color: var(--muted); }
@media (max-width: 720px) { .vs { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto; width: 100%; } }
.tape { background: var(--onair); color: var(--onair-ink); padding: 16px 18px 18px; display: grid; gap: 6px; border-top: 4px solid var(--gold); }
.tape .names { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--onair-rule); }
.tape .names b { font: 800 clamp(22px, 5vw, 36px)/1 var(--display); overflow-wrap: anywhere; }
.tape .names b:last-child { text-align: right; }
.tape .names span { color: var(--onair-muted); font: 700 16px var(--display); }
.tape .line { display: grid; grid-template-columns: 1fr minmax(8em, auto) 1fr; align-items: center; gap: 8px; padding: 5px 0; }
.tape .line .l, .tape .line .rr { font: 800 26px/1 var(--display); font-variant-numeric: tabular-nums; }
.tape .line .rr { text-align: right; }
.tape .line .k { text-align: center; color: var(--onair-muted); font-size: 13px; }
.tape .line .ahead { color: var(--gold); }

/* ---- the Me page --------------------------------------------------------------------- */
.mehead { display: grid; gap: 10px; }
.mehead .idrow { display: flex; align-items: center; gap: 14px; }
.mehead .initials.xl { width: 58px; height: 58px; font-size: 24px; }
.mehead .nickname { font: 700 14px/1 var(--body); color: var(--gold-text); letter-spacing: 0.02em; cursor: help; }
.mehead h1 { font-size: clamp(34px, 8vw, 52px); overflow-wrap: anywhere; }
.figures { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--rule); }
@media (min-width: 720px) { .figures { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.figure { display: grid; gap: 2px; padding: 12px 12px 12px 0; border-bottom: 1px solid var(--rule); align-content: start; }
.figure .v { font: 800 34px/1 var(--display); }
.figure .k { font-size: 14px; color: var(--muted); }
.figure .d { font-size: 13px; color: var(--ink-2); }
.profile { display: grid; gap: 12px; }
.meter { display: grid; gap: 4px; }
.meter .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.meter .top b { font-weight: 600; }
.meter .top span { font: 800 20px/1 var(--display); }
.meter .track { position: relative; height: 8px; border-radius: var(--r-sm); background: var(--grid); }
.meter .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: var(--r-sm); background: var(--me-mark); }
.meter .pool { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
.meter .why { font-size: 13px; color: var(--muted); }
.teamrec { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.teamrec .box { gap: 4px; }
.teamrec .box b { font: 800 22px var(--display); }
/* the week, replayed: chart, scrubber, then the moment and the standings at it */
.replay { display: grid; gap: 12px; }
.chart .day { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .now { stroke: var(--gold); stroke-width: 2.5; }
.chart .hit.scrub { cursor: ew-resize; }
.rp-controls { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.rp-controls .btn { min-width: 40px; justify-content: center; }
.rp-play-btn { min-width: 96px !important; }
.rp-slider { width: 100%; accent-color: var(--gold); height: 28px; margin: 0; }
.rp-read { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 12px; }
.rp-moment { display: grid; gap: 4px; align-content: start; background: var(--onair); color: var(--onair-ink);
  border-left: 5px solid var(--gold); border-radius: var(--r-sm); padding: 12px 14px; min-height: 96px; align-self: start; }
.rp-when { font: 700 13px/1 var(--body); letter-spacing: var(--label-tracking); text-transform: uppercase; color: var(--gold); }
.rp-head { font: 800 22px/1.15 var(--display); font-variant-numeric: tabular-nums; }
.rp-play { color: var(--onair-muted); font-size: 14px; line-height: 1.35; }
.rp-standing { display: grid; gap: 6px; align-content: start; }
.rp-lead { font-weight: 600; }
.rp-board { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.rp-board li { display: grid; grid-template-columns: 30px minmax(0, 1fr) 30px 30px; gap: 8px; align-items: center;
  padding: 4px 6px; border-bottom: 1px solid var(--rule); font-size: 15px; }
.rp-board li:last-child { border-bottom: 0; }
.rp-board li.me { background: var(--gold-soft); box-shadow: inset 4px 0 0 var(--gold); }
.rp-board .pos { color: var(--muted); font: 800 16px/1 var(--display); text-align: right; }
.rp-board .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.rp-board .tot { font: 800 18px/1 var(--display); text-align: right; }
.rp-board .mv { font-size: 13px; font-weight: 700; text-align: right; }
.rp-board .mv.up { color: var(--good); }
.rp-board .mv.down { color: var(--bad); }
@media (max-width: 719px) { .rp-read { grid-template-columns: minmax(0, 1fr); } }
.beat .beat-foot { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; margin-top: 2px; }
.beat .when { color: var(--muted); font-size: 13px; }
/* pick twins and nemeses: four people, each a way into the head-to-head */
.twins { display: grid; gap: 0; }
.twin { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 12px; text-align: left; width: 100%;
  background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 10px 2px; cursor: pointer; color: inherit; font: inherit; }
.twin:hover .nm { text-decoration: underline; text-underline-offset: 2px; }
.twin .k { grid-column: 1; font: 700 12px/1.2 var(--body); letter-spacing: var(--label-tracking); text-transform: uppercase; color: var(--gold-text); }
.twin .nm { grid-column: 1; font-weight: 700; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.twin .big { grid-column: 2; grid-row: 1 / span 2; align-self: center; font: 800 28px/1 var(--display); }
.twin .meta { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }
.twins .race-sum { margin-top: 10px; }
.rival { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.rival:last-child { border-bottom: 0; }
.rival .gap { font: 800 22px/1 var(--display); text-align: right; }
.rival .meta { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }
.namegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.namegrid button { border: 1px solid var(--rule); background: var(--surface); border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4); text-align: left; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.namegrid button:hover, .filter:hover, .vs select:hover { border-color: var(--rule-hover); }
.namegrid .initials { width: 26px; height: 26px; font-size: 12px; }
.filter { border: 1px solid var(--rule); background: var(--surface); border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4); width: 100%; max-width: 360px; }

/* ---- charts ------------------------------------------------------------------------- */
.chart { position: relative; display: grid; gap: 8px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart svg text { font-family: var(--body); font-size: 12px; fill: var(--muted); }
.chart svg .lbl { font-size: 12px; font-weight: 600; fill: var(--ink-2); }
.chart svg .lbl.me { fill: var(--ink); font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid var(--context-strong); }
.legend i.me { border-top: 3px solid var(--me-mark); }
.legend i.ctx { border-top-color: var(--context); }
.legend i.dot { width: 9px; height: 9px; border: 0; border-radius: 50%; background: var(--me-mark); }
.legend i.rng { width: 4px; height: 14px; border: 0; border-radius: var(--r-xs); background: var(--context); }
.chart .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .ln.ctx { stroke: var(--context); stroke-width: 1.25; }
.chart .ln.strong { stroke: var(--context-strong); }
.chart .ln.mid { stroke: var(--context-strong); stroke-width: 1.5; opacity: 0.45; }
.chart .end.mid { opacity: 0.6; }
.chart .ln.me { stroke: var(--me-mark); stroke-width: 3; }
.chart .grid line { stroke: var(--grid); stroke-width: 1; }
.chart .zero { stroke: var(--context-strong); stroke-width: 1; }
.chart .end { stroke: var(--surface); stroke-width: 2; }
.chart .end.me { fill: var(--me-mark); }
.chart .end.strong { fill: var(--context-strong); }
.chart .rng { stroke: var(--context); stroke-width: 7; stroke-linecap: round; }
.chart .avgtick { stroke: var(--ink-2); stroke-width: 2; }
.chart .medot { fill: var(--me-mark); stroke: var(--surface); stroke-width: 2; }
.chart .cross { stroke: var(--ink-2); stroke-width: 1; }
.chart .hit { fill: transparent; cursor: crosshair; outline: none; }
.chart .hit:focus-visible { stroke: var(--turf); stroke-width: 2; }
.tip {
  position: absolute;
  z-index: 5;
  pointer-events: none;
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--rule);
  border-radius: var(--r-md);
  box-shadow: var(--shadow);
  padding: 8px 10px;
  font-size: 13px;
  min-width: 150px;
  display: grid;
  gap: 3px;
}
.tip .t { font-weight: 700; color: var(--muted); font-size: 12px; }
.tip .ln { display: flex; align-items: center; gap: 8px; }
.tip .ln b { font-variant-numeric: tabular-nums; min-width: 3ch; }
.tip .ln i { width: 12px; height: 0; border-top: 2px solid var(--context-strong); }
.tip .ln i.me { border-top: 3px solid var(--me-mark); }
.tableview { margin-top: 4px; }
.tableview summary { cursor: pointer; color: var(--muted); font-size: 14px; }

/* ---- history ----------------------------------------------------------------------- */
.timeline { display: grid; }
.season-row { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 4px 18px; padding: 14px 0; border-bottom: 1px solid var(--rule); align-items: baseline; }
.season-row:last-child { border-bottom: 0; }
.season-row .yr { font: 900 40px/0.9 var(--display); color: var(--muted); font-variant-numeric: tabular-nums; }
.season-row.now .yr { color: var(--gold-text); }
.season-row .champ { font: 800 26px/1.05 var(--display); }
.season-row .what { color: var(--ink-2); font-size: 15px; grid-column: 2; }
.records { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 0 24px; }
.record { display: grid; gap: 2px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.record .k { color: var(--muted); font-size: 14px; }
.record .v { font: 800 30px/1 var(--display); }
.record .w { font-weight: 600; }
.record .d { font-size: 13px; color: var(--muted); }

/* ---- the phone's bottom bar ------------------------------------------------------- */
.bottombar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 30;
  background: var(--surface);
  border-top: 1px solid var(--rule);
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-shadow: 0 -4px 16px rgba(13, 27, 44, 0.06);
}
.bottombar a {
  display: grid;
  justify-items: center;
  gap: 3px;
  padding: 8px 2px 7px;
  font: 600 11px/1 var(--body);
  color: var(--muted);
  text-decoration: none;
  position: relative;
}
.bottombar a svg { width: 23px; height: 23px; }
.bottombar a[aria-current="page"] { color: var(--ink); }
.bottombar a[aria-current="page"]::before { content: ""; position: absolute; top: -1px; left: 26%; right: 26%; height: 3px; background: var(--gold); border-radius: 0 0 var(--r-xs) var(--r-xs); }
.bottombar a .livedot { position: absolute; top: 6px; right: calc(50% - 18px); width: 8px; height: 8px; border-radius: 50%; background: var(--live); border: 2px solid var(--surface); }
@media (min-width: 1100px) {
  .bottombar { display: none; }
  main { padding-bottom: 48px; }
}
@media (max-width: 1099px) {
  .desknav { display: none; }
}

/* ---- the menu sheet ------------------------------------------------------------------- */
.scrim { position: fixed; inset: 0; background: rgba(5, 12, 21, 0.55); z-index: 40; }
.sheet {
  position: fixed;
  z-index: 41;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--surface);
  color: var(--ink);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  padding: 14px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  display: grid;
  gap: 4px;
  max-height: 86vh;
  overflow-y: auto;
  box-shadow: var(--shadow);
}
@media (min-width: 1100px) {
  .sheet { left: auto; right: 24px; bottom: auto; top: 70px; width: 340px; border-radius: var(--r-md); }
}
.sheet .sh-head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 6px; }
.sheet a.item, .sheet button.item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 6px;
  border: 0;
  border-bottom: 1px solid var(--rule);
  background: none;
  text-decoration: none;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
  width: 100%;
}
.sheet .item svg { width: 22px; height: 22px; color: var(--muted); flex: none; }
.sheet .item small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
.sheet .themes { padding: 12px 6px 4px; display: grid; gap: 8px; }

/* ---- toasts: a game swung while you were watching -------------------------------------- */
.toasts {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(78px + env(safe-area-inset-bottom, 0px));
  z-index: 50;
  display: grid;
  gap: 8px;
  width: min(460px, calc(100% - 32px));
  pointer-events: none;
}
@media (min-width: 1100px) { .toasts { bottom: 24px; left: auto; right: 24px; transform: none; } }
.toast {
  pointer-events: auto;
  background: var(--onair);
  color: var(--onair-ink);
  border-left: 5px solid var(--gold);
  border-radius: var(--r-sm);
  padding: 10px 12px 10px 14px;
  box-shadow: var(--shadow);
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 2px 10px;
  font-size: 14px;
}
.toast.mine { border-left-color: var(--turf); }
.toast.bad { border-left-color: var(--live); }
.toast b { font: 800 17px/1.15 var(--display); }
.toast button { grid-row: 1 / span 2; grid-column: 2; align-self: start; border: 0; background: none; color: var(--onair-muted); cursor: pointer; font-size: 18px; line-height: 1; }
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: rise 260ms ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
}
.feed { display: grid; }
.feed .f { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
.feed .f:last-child { border-bottom: 0; }
.feed .f time { color: var(--muted); font-variant-numeric: tabular-nums; }
.feed .f.mine b { color: var(--good); }

/* ---- the share picture -------------------------------------------------------------- */
.shareview { position: fixed; inset: 0; z-index: 60; background: rgba(5, 12, 21, 0.82); display: grid; place-items: center; padding: 20px; }
.shareview .inner { display: grid; gap: 12px; justify-items: center; max-width: 420px; width: 100%; }
.shareview img { width: 100%; height: auto; border-radius: var(--r-md); box-shadow: var(--shadow); }
.shareview .acts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

/* ---- updating (only whoever can edit the page sees this) --------------------------- */
.update { border: 1px dashed var(--turf); background: var(--turf-soft); border-radius: var(--r-md); padding: 12px 14px; display: grid; gap: 8px; }
.update p { margin: 0; }
.update .owner { display: flex; gap: 8px; flex-wrap: wrap; }
.error { color: var(--bad); }
body.dropping .page { outline: 2px dashed var(--turf); outline-offset: -6px; }

footer { max-width: 1180px; width: 100%; margin: 0 auto; color: var(--muted); font-size: 13px; border-top: 1px solid var(--rule); padding: 14px 16px calc(92px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; justify-items: start; }
@media (min-width: 1100px) { footer { padding-bottom: 28px; } }
.narrow-only { display: none; }
@media (max-width: 719px) {
  h1 { font-size: 34px; }
  .pagehead h1 { font-size: 34px; }
  .hide-narrow { display: none; }
  .narrow-only { display: inline; }
  th, td { padding: 8px 6px; }
  td.game { min-width: 8em; }
  .stick-a { width: 34px; min-width: 34px; max-width: 34px; }
  .stick-b { left: 34px; }
  .hero { padding: 16px 34px 18px 16px; }
  .wordmark { font-size: 23px; }
  .teamrec { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .mechip .who { display: none; }
  .mechip { padding: 3px; }
  .topbar .inner { gap: 8px; padding: 7px 12px; }
  .weekpill { font-size: 12px; padding: 4px 8px; }
  .wordmark { font-size: 22px; }
  .brandmark { gap: 7px; }
  .brandmark svg { width: 28px; height: 32px; }
}
@media (max-width: 340px) {
  .topbar .weekpill { display: none; }
}
@media print {
  .topbar, .ticker, .bottombar, .toasts, footer { display: none; }
}

.pick-coach { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.howto summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.howto p { margin-top: 6px; }

/* ==== 2.16: the league's logo and colours, panels, search, section links ============== */
.brandmark img.logo { width: 46px; height: 46px; display: block; margin: -6px -2px -6px -4px; filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.5)); }
.topbar { box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22); }
@supports ((backdrop-filter: blur(2px)) or (-webkit-backdrop-filter: blur(2px))) {
  .topbar { background: color-mix(in srgb, var(--onair) 86%, transparent); -webkit-backdrop-filter: saturate(150%) blur(14px); backdrop-filter: saturate(150%) blur(14px); }
  .bottombar { background: color-mix(in srgb, var(--surface) 88%, transparent); -webkit-backdrop-filter: saturate(150%) blur(14px); backdrop-filter: saturate(150%) blur(14px); }
}

/* the lower third: a floodlit field behind the headline, the logo faint in it */
.hero { background: radial-gradient(130% 150% at 0% 0%, color-mix(in srgb, var(--turf) 30%, var(--onair)) 0%, var(--onair) 60%); }
.hero::before {
  content: "";
  position: absolute;
  right: 56px;
  top: 50%;
  width: min(44%, 280px);
  aspect-ratio: 1;
  transform: translateY(-50%) rotate(-5deg);
  background: var(--logo, none) center / contain no-repeat;
  opacity: 0.14;
  pointer-events: none;
}
.hero.sided::before { right: auto; left: 44%; width: min(30%, 240px); opacity: 0.06; }

/* a module is a panel now: its own surface, a gold tick by its heading */
.module {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--r-lg);
  padding: var(--sp-4) var(--sp-5) var(--sp-5);
  box-shadow: 0 1px 2px rgba(10, 14, 11, 0.04), 0 8px 24px rgba(10, 14, 11, 0.05);
  scroll-margin-top: calc(var(--bar-h, 56px) + 62px);
}
.module .module { background: none; border: 0; border-radius: 0; padding: 0; box-shadow: none; }
.module > .mhead { border-top: 0; padding-top: 0; }
.module > .mhead h2 { position: relative; padding-left: 13px; }
.module > .mhead h2::before { content: ""; position: absolute; left: 0; top: 0.1em; bottom: 0.14em; width: 4px; border-radius: var(--r-xs); background: var(--gold); }
.module .box { background: var(--raised); }
#leaderboard { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-lg); padding: var(--sp-3) var(--sp-4) var(--sp-2); }
@media (hover: hover) {
  .standrows > .r:not(.hdr):not(.me):hover { background: var(--raised); }
  .module:hover { border-color: var(--rule-hover); }
}
@media (max-width: 719px) {
  .module { padding: var(--sp-4); border-radius: var(--r-lg); }
  #leaderboard { padding: 6px 10px 2px; border-radius: var(--r-lg); }
}

/* coaches wear their own colour */
.initials.sm { width: 24px; height: 24px; font-size: 11px; }
.standrows .name { display: flex; align-items: center; gap: 8px; }

/* the podium: the top three above the table */
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: end; }
.podium .step {
  --medal: #b9c0c7;
  position: relative;
  display: grid;
  justify-items: center;
  text-align: center;
  gap: 5px;
  padding: 16px 8px 12px;
  border-radius: var(--r-lg);
  border: 1px solid var(--rule);
  background: var(--surface);
  background: linear-gradient(180deg, color-mix(in srgb, var(--medal) 16%, var(--surface)), var(--surface) 72%);
  overflow: hidden;
  min-width: 0;
}
.podium .step::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--medal); }
.podium .p1 { --medal: var(--gold); order: 2; padding-top: 26px; padding-bottom: 18px; }
.podium .p2 { order: 1; }
.podium .p3 { --medal: #c8813f; order: 3; }
.podium .medal { font: 800 14px/1 var(--display); letter-spacing: 0.1em; color: var(--medal); text-transform: uppercase; }
.podium .initials { width: 44px; height: 44px; font-size: 18px; box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--medal); margin: 4px 0; }
.podium .p1 .initials { width: 58px; height: 58px; font-size: 23px; }
.podium .who-link { font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
.podium .wins { font: 800 36px/1 var(--display); }
.podium .p1 .wins { font-size: 48px; }
.podium .sub { font-size: 12px; color: var(--muted); }
.podium .step.me { box-shadow: inset 0 0 0 2px var(--gold); }

/* back to the top */
.totop {
  position: fixed;
  right: 16px;
  bottom: calc(86px + env(safe-area-inset-bottom, 0px));
  z-index: 25;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid var(--rule);
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow);
  display: grid;
  place-items: center;
  cursor: pointer;
  opacity: 0;
  transform: translateY(10px);
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.totop svg { width: 20px; height: 20px; }
html.scrolled .totop { opacity: 1; transform: none; pointer-events: auto; }
@media (min-width: 1100px) { .totop { bottom: 24px; right: 24px; } }

/* find: any coach, week or page */
.searchbtn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 36px;
  height: 34px;
  padding: 0;
  border: 1px solid var(--onair-rule);
  background: transparent;
  color: var(--onair-ink);
  border-radius: var(--r-md);
  cursor: pointer;
  font: 600 14px/1 var(--body);
}
.searchbtn:hover { border-color: var(--gold); }
.searchbtn svg { width: 18px; height: 18px; }
.searchbtn .lbl, .searchbtn kbd { display: none; }
@media (min-width: 1100px) {
  .topbar .inner { max-width: 1280px; }
}
html.finding { overflow: hidden; }
.finder-wrap { position: fixed; inset: 0; z-index: 60; }
.finder-scrim { position: absolute; inset: 0; background: rgba(4, 7, 5, 0.62); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.finder {
  position: absolute;
  left: 50%;
  top: min(12vh, 110px);
  transform: translateX(-50%);
  width: min(620px, calc(100vw - 20px));
  max-height: min(72vh, 620px);
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--rule);
  border-radius: var(--r-lg);
  box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
  overflow: hidden;
}
.finder .fhead { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 16px; border-bottom: 1px solid var(--rule); }
.finder .fhead > svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
.finder input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: inherit; font: 500 18px/1.3 var(--body); padding: 6px 0; }
.finder input::-webkit-search-cancel-button { display: none; }
.fresults { list-style: none; margin: 0; padding: 6px; overflow-y: auto; }
.fresults li { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-lg); cursor: pointer; }
.fresults li[aria-selected="true"] { background: var(--raised); box-shadow: inset 3px 0 0 var(--gold); }
.fresults .t { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fresults .t small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.fresults .k { font: 700 11px/1 var(--body); letter-spacing: var(--label-tracking); text-transform: uppercase; color: var(--muted); }
.fresults .fic { width: 30px; height: 30px; border-radius: var(--r-md); display: grid; place-items: center; background: var(--raised); color: var(--ink-2); }
.fresults .fic svg { width: 18px; height: 18px; }
.fresults .initials { width: 30px; height: 30px; }
.fresults li.none { display: block; color: var(--muted); cursor: default; padding: 16px; }
.finder .fhint { margin: 0; padding: 8px 16px 10px; border-top: 1px solid var(--rule); font-size: 12px; }
@media (max-width: 719px) {
  .finder { top: 8px; max-height: calc(100vh - 16px); max-height: calc(100dvh - 16px); }
  .finder .fhint { display: none; }
}

/* the footer signs off with the league's name */
footer .fbrand { display: flex; align-items: center; gap: 10px; font: 800 19px/1 var(--display); letter-spacing: 0.02em; color: var(--ink-2); margin-bottom: 8px; }
footer .fbrand img { width: 44px; height: 44px; }

/* a page arrives; it doesn't just appear - but only when you went there */
@media (prefers-reduced-motion: no-preference) {
  .view.enter > * { animation: arrive 0.36s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
  .view.enter > *:nth-child(2) { animation-delay: 0.04s; }
  .view.enter > *:nth-child(3) { animation-delay: 0.08s; }
  .view.enter > *:nth-child(4) { animation-delay: 0.12s; }
  .view.enter > *:nth-child(n + 5) { animation-delay: 0.16s; }
  @keyframes arrive { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .finder { animation: drop 0.18s ease-out both; }
  @keyframes drop { from { opacity: 0; transform: translateX(-50%) translateY(-8px); } to { opacity: 1; transform: translateX(-50%); } }
  .module, .podium .step { transition: border-color 0.15s ease, background-color 0.15s ease, color 0.15s ease; }
}
@media (max-width: 719px) {
  /* on a phone the logo sits in the corner of the lower third, clear of the figures */
  .hero::before, .hero.sided::before { left: auto; right: 26px; top: 8px; width: 92px; transform: rotate(-5deg); opacity: 0.16; }
}
@media (max-width: 520px) {
  /* a panel costs a phone some width: the page gives a little back */
  main { padding-left: 10px; padding-right: 10px; }
  .module { padding: 12px 10px 14px; }
  .brandmark img.logo { width: 40px; height: 40px; margin: -5px -2px -5px -3px; }
  .podium { gap: 6px; }
  .podium .step { padding: 14px 4px 10px; }
  .podium .wins { font-size: 30px; }
  .podium .p1 .wins { font-size: 40px; }
}
@media print { .totop, .finder-wrap { display: none; } }

/* ==== the future skin ===================================================================
   The league's own black, gold and green, as a control room rather than a broadcast:
   squared panels on hairlines with a gold line fading across the top, a squarer
   display face, small spaced capitals for labels, a lit edge on whatever is current.
   Sentence case stays for headings and names - capitals are for labels only, so
   nothing long has to fit a phone in wide letters. */
:root {
  --display: "Rajdhani", "Barlow Condensed", "Arial Narrow", sans-serif;
  --glow: color-mix(in srgb, var(--gold) 58%, transparent);
  --panel-line: linear-gradient(90deg, var(--gold), color-mix(in srgb, var(--gold) 0%, transparent) 46%);
  --dots: color-mix(in srgb, var(--ink) 9%, transparent);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #050708; --surface: #0b0f10; --raised: #111719; --rule: #1c2527; --grid: #151c1e;
    --onair: #030405; --onair-2: #090d0e; --onair-rule: #1c2527; --dots: color-mix(in srgb, var(--ink) 6%, transparent);
  }
}
:root[data-theme="dark"] {
  --ground: #050708; --surface: #0b0f10; --raised: #111719; --rule: #1c2527; --grid: #151c1e;
  --onair: #030405; --onair-2: #090d0e; --onair-rule: #1c2527; --dots: color-mix(in srgb, var(--ink) 6%, transparent);
}
body { background-image: radial-gradient(var(--dots) 1px, transparent 1.3px); background-size: 22px 22px; }

/* type: a squarer face; capitals only where the words are short */
h1, h2, h3 { font-weight: 700; letter-spacing: 0.012em; line-height: 1.05; }
.pagehead h1 { text-transform: uppercase; letter-spacing: 0.07em; font-size: clamp(26px, 7vw, 38px); padding-bottom: 12px; }
.pagehead h1::after { width: 56px; height: 2px; border-radius: 0; box-shadow: 0 0 14px 1px var(--glow); }
.hero .stat .k, .figure .k, .mini-fig .k, .record .k, .module > .mhead .aside, .bug .state, .gcard .when, .gcard .tv {
  text-transform: uppercase; letter-spacing: var(--label-tracking); font-size: var(--label-size); font-weight: var(--label-weight);
}
th { text-transform: uppercase; letter-spacing: var(--label-tracking); font-size: var(--label-size); }
.hero .kicker { text-transform: uppercase; letter-spacing: var(--label-tracking); font-size: 12px; }
.hero .stat .v, .figure .v, .mini-fig .v, .r .big, td.total, .podium .wins, .bug .pts, .gcard .row .pts { font-weight: 700; letter-spacing: 0.02em; }
.r .pos { font-weight: 600; }

/* the bar across the top: a lit gold line under it */
.topbar { border-bottom: 1px solid color-mix(in srgb, var(--gold) 80%, transparent); box-shadow: 0 1px 20px -3px var(--glow), 0 8px 24px rgba(0, 0, 0, 0.22); }
.wordmark { font-weight: 700; letter-spacing: 0.07em; }
.weekpill { border-radius: var(--r-xs); text-transform: uppercase; letter-spacing: var(--label-tracking); font-size: 11px; }
.iconbtn, .mechip, .searchbtn { border-radius: var(--r-sm); }
.initials, .mechip .initials { border-radius: var(--r-md); }
.desknav a { text-transform: uppercase; letter-spacing: var(--label-tracking); font-size: 15px; font-weight: 600; padding-left: 12px; padding-right: 12px; }
.desknav a[aria-current="page"] { text-shadow: 0 0 14px var(--glow); }

/* the headline panel: cut corners, a faint grid, the gold edge */
.hero {
  clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
  border-left: 0;
  padding: 20px 22px 22px 24px;
  background:
    linear-gradient(var(--gold), var(--gold)) 0 0 / 3px 100% no-repeat,
    linear-gradient(color-mix(in srgb, var(--onair-ink) 5%, transparent) 1px, transparent 1px) 0 0 / 100% 26px,
    linear-gradient(90deg, color-mix(in srgb, var(--onair-ink) 5%, transparent) 1px, transparent 1px) 0 0 / 26px 100%,
    radial-gradient(130% 150% at 0% 0%, color-mix(in srgb, var(--turf) 34%, var(--onair)) 0%, var(--onair) 62%);
}
.hero::after { display: none; }
/* the week's banner: the winning number lit gold, thin meters out of the card,
   the logo off the headline and tucked behind the figures on the right */
.hero h1 { text-shadow: 0 2px 24px rgba(0, 0, 0, 0.55); }
.hero .deck b { color: var(--gold); font-weight: 600; }
.hero .stat.lead .v { color: var(--gold); text-shadow: 0 0 18px var(--glow); }
.hero .stat .meter { display: block; height: 3px; margin: 7px 0 2px; max-width: 120px; background: color-mix(in srgb, var(--onair-ink) 12%, transparent); border-radius: var(--r-xs); overflow: hidden; }
.hero .stat .meter i { display: block; height: 100%; background: var(--onair-muted); border-radius: inherit; }
.hero .stat.lead .meter i { background: var(--gold); box-shadow: 0 0 8px var(--glow); }
@media (min-width: 720px) {
  .hero.sided .stats { border-top: 1px solid color-mix(in srgb, var(--gold) 55%, transparent); }
}
.hero .deck + .deck { margin-top: 4px; }
.hero .kicker .hello { color: var(--onair-ink); }
.maxweeks .r { grid-template-columns: 44px 74px minmax(0,1fr) 44px; }
.maxweeks .r.best .num b { color: var(--gold); }
@media (prefers-reduced-motion: no-preference) {
  /* a number that just changed glows once, then settles; nothing repeats */
  @keyframes ticked {
    0%, 25% { color: var(--gold); text-shadow: 0 0 16px var(--glow); background-color: color-mix(in srgb, var(--gold) 18%, transparent); }
    100% { background-color: transparent; }
  }
  .ticked { animation: ticked 1400ms ease-out 1; border-radius: var(--r-xs); }
}
.hero .deck.more { font-size: 15px; }
@media (prefers-reduced-motion: no-preference) {
  @keyframes wipe {
    from { clip-path: polygon(0 0, 0 0, 0 0, 0 100%, 0 100%, 0 100%); }
    to { clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px)); }
  }
}

/* panels: squared, on a hairline, a gold line fading across the top */
.module, #leaderboard {
  border-radius: var(--r-md);
  background: var(--panel-line) top left / 100% 2px no-repeat, var(--surface);
  box-shadow: inset 0 1px 0 color-mix(in srgb, var(--ink) 4%, transparent);
}
.module .module { background: none; box-shadow: none; }
.module > .mhead h2::before { width: 2px; border-radius: 0; box-shadow: 0 0 12px 1px var(--glow); }
.box, .scard, .chip, .totop, .finder, .notice { border-radius: var(--r-sm); }
.gcard { border-radius: var(--r-md); }
.bug { border-radius: var(--r-xs); }

/* switches: squared, in capitals, the current one lit */
.seg { border-radius: var(--r-sm); }
.seg button { text-transform: uppercase; letter-spacing: var(--label-tracking); font-size: 12px; }
