.seg button[aria-pressed="true"], .weeks button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: #14100a; }
.weeks button { border-radius: var(--r-xs); }
.btn { border-radius: var(--r-sm); text-transform: uppercase; letter-spacing: var(--label-tracking); font-size: 13px; }

/* the podium: lit from its medal */
.podium .step { border-radius: var(--r-md); background: linear-gradient(180deg, color-mix(in srgb, var(--medal) 13%, var(--surface)), var(--surface) 70%); }
.podium .step::before { height: 2px; box-shadow: 0 0 14px 1px var(--medal); }
.podium .initials { border-radius: var(--r-lg); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--medal), 0 0 22px -2px var(--medal); }
.podium .medal { letter-spacing: 0.22em; font-size: 12px; }

/* how a game's picks split: the side most of the pool is on, in gold */
.split .barline { height: 4px; }
.split .barline span { border-radius: 1px; }
.split .barline span.lead { background: linear-gradient(90deg, var(--gold), color-mix(in srgb, var(--gold) 62%, var(--turf))); box-shadow: 0 0 10px -2px var(--glow); }

/* the phone's bottom bar */
.bottombar { border-top: 1px solid color-mix(in srgb, var(--gold) 34%, var(--rule)); }
.bottombar a { text-transform: uppercase; letter-spacing: var(--label-tracking); font-size: 10px; }
.bottombar a[aria-current="page"] { color: var(--gold-text); }
.bottombar a[aria-current="page"]::before { height: 2px; left: 22%; right: 22%; border-radius: 0; box-shadow: 0 0 14px 1px var(--glow); }

/* a phone's top bar: when the week's tag has more to say ("live", "final", "after week 4")
   the year gives it the room, so the menu button stays on the screen */
@media (max-width: 520px) {
  .wordmark { letter-spacing: 0.04em; }
  .weekpill { letter-spacing: 0.04em; white-space: nowrap; }
}
@media (max-width: 410px) {
  .topbar .inner.tight .wordmark .yr { display: none; }
}
@media (max-width: 380px) {
  /* the narrowest phones: the year goes whatever the tag says */
  .topbar .inner { gap: 6px; }
  .weekpill { padding: 4px 6px; }
  .wordmark .yr { display: none; }
}

/* ==== fewer tabs =========================================================================
   The bars carry four sections - Home, the week, Standings, Pools & money - and Me.
   A section's own pages are a row of tabs at the top of each of them, and the menu
   lists every page under its section. */
.desknav { gap: 4px; margin-left: 10px; }
a.weekpill { text-decoration: none; }
@media (hover: hover) { a.weekpill:hover { border-color: var(--gold); color: var(--onair-ink); } }
@media (min-width: 1100px) { .mechip .who { max-width: 9em; } }
@media (min-width: 1280px) {
  /* room now for the search to say what it is, and for a longer name */
  .mechip .who { max-width: 13em; }
  .searchbtn { width: auto; padding: 0 9px 0 10px; }
  .searchbtn .lbl { display: inline; text-transform: uppercase; letter-spacing: var(--label-tracking); font-size: 12px; color: var(--onair-muted); }

  function isTie(u) { return /^tie$/i.test(String(u.winner || "").trim()); }
  function story(w) {
    var bits = [];

    if (w.winners.length === 1 && second != null) {
      bits.push(w.top + " of " + w.games + " was enough, " + (w.top - second === 1 ? "one game ahead of " : numberWord(w.top - second) + " games ahead of ") + listNames(runners, 2) + ".");

      bits.push("All on " + w.top + " of " + w.games + ".");

  // The rest of the week, for the home banner: how it was won, how the games

  function weekTold(w) {
    var bits = [];
    var lc = function (s) { return s ? s.charAt(0).toLowerCase() + s.slice(1) : s; };
    var beat = function (kind) { return (w.beats || []).filter(function (b) { return b.kind === kind; })[0]; };
    var dec = beat("decider"), bad = beat("bad-beat");
    if (dec) bits.push(dec.who + " was " + lc(dec.detail).replace(/\.?$/, "."));
    if (bad && (!dec || bad.who !== dec.who)) bits.push(bad.who + " was " + lc(bad.detail).replace(/\.?$/, "."));
    var climb = (w.awards || []).filter(function (a) { return a.title === "Biggest climber"; })[0];
    if (climb) bits.push(climb.who + " moved " + climb.detail + ".");
    var c = w.chaos;
    if (c && c.upsets != null) {
      bits.push(cap(plural(c.upsets, "upset")) + " against " + c.expected.toFixed(1) + " expected" +
        (c.label ? ", a " + c.label.toLowerCase() + " week" : "") + (c.biggest ? "; the biggest was " + c.biggest + "." : "."));
    }
    var res = (w.results || []).filter(function (g) { return g.right != null; });
    if (res.length) {
      var best = res.reduce(function (a, g) { return g.right > a.right ? g : a; });
      bits.push("Best-called game: " + best.winner + " over " + best.loser + ", " + best.right + " of " + w.entrants + " had it.");
    }
    if (w.scores && w.scores.length) {

  // How many coaches went out of the suicide pool in a week, whichever team did it.

  // A week's story as the lower third: on the home page the latest week (its

  // A sentence with the coaches' names in bold, longest names first so "Jim T" doesn't eat "Jim".

  // ---- results in: the recap -----------------------------------------------------------

  // The top of the table, and where the viewer is.

      el("div", { class: "rows standrows" }, shown.map(function (p) {

          el("span", { class: "pos", text: p.place != null ? String(p.place) : "" }),

  // ---- this week's side pools, and the picks nobody else made -------------------

  // How one Big Loser pick stands. `by` is how many points the team is

  function loserState(x, team) {

    var chance = blownChance(x, team);
    var by = x.state !== "pre" && x.hs != null ? (x.g.hc === team ? x.as - x.hs : x.hs - x.as) : null;
    if (by == null) return { text: pct(chance) + " to lose by 15+", tone: "muted", by: null, chance: chance };

      tone: by >= 15 ? "good live" : "live", by: by, chance: chance };
  }
  // How one suicide pick stands, with the pool's line applied.
  function survivalState(x, team) {
    if (!x) return { text: "not on this week’s sheet", tone: "muted", now: "", chance: null };

    var lined = x.g.line != null && x.g.fav;

    return { text: (now === "level" ? "" : now + " · ") + upDown(margin) + (lined ? " (line " + x.g.line + ")" : "") +
      " · " + liveDetail(x) + " · " + pct(chance) + " to survive", tone: now === "ahead" ? "good live" : now === "behind" ? "bad live" : "live", now: now, chance: chance };
  }

  // Every Big Loser the pool picked this week, how it stands, and who has it.
  function weekLosersCard(t) {

  // The suicide pool this week: who is on which team, and how it stands.

  // Picks almost nobody made, and how the crowd's own card is doing.

  }

  function replayChart(rep, width, pos, focus) {
    var H = width < 520 ? 210 : 250, narrow = width < 520;
    var padL = 34, padR = narrow ? 92 : 128, padT = 12, padB = 26;
    var frames = rep.frames, n = frames.length;
    var totals = frames.map(frameTotals);
    var behind = totals.map(function (t) { var top = Math.max.apply(null, t); return t.map(function (v) { return top - v; }); });
    var hi = 3;
    behind.forEach(function (row) { row.forEach(function (v) { if (v > hi) hi = v; }); });
    hi = Math.min(hi, 12);
    function X(i) { return padL + (n > 1 ? i * (width - padL - padR) / (n - 1) : 0); }
    function Y(v) { return padT + Math.min(v, hi) / hi * (H - padT - padB); }
    var svg = svgEl("svg", { viewBox: "0 0 " + width + " " + H, width: width, height: H, role: "img",
      "aria-label": "Wins behind the week’s leader after every score" });
    var grid = svgEl("g", { class: "grid" });
    ticksFor(0, hi, 3).forEach(function (v) {
      grid.appendChild(svgEl("line", { x1: padL, x2: width - padR + 8, y1: Y(v), y2: Y(v) }));
      grid.appendChild(svgEl("text", { x: padL - 6, y: Y(v) + 4, "text-anchor": "end", text: v === 0 ? "lead" : "−" + v }));
    });
    svg.appendChild(grid);
    // the days along the bottom, where each begins; the steps are one per score,
    // not by the clock, so a day with few scores would put its name under the
    // next day's - that one moves right to clear it (or is left off at the edge)
    var last = "", free = 0;
    frames.forEach(function (f, i) {
      var d = frameDay(f);
      if (d === last) return;
      last = d;
      svg.appendChild(svgEl("line", { class: "day", x1: X(i), x2: X(i), y1: padT, y2: H - padB }));
      var lx = Math.max(X(i) + 3, free), lw = d.length * 8;
      if (lx + lw > width) return;
      free = lx + lw + 6;
      svg.appendChild(svgEl("text", { x: lx, y: H - 8, text: d }));
    });
    var top = rep.coaches.slice(0, 1).concat(rep.coaches.filter(function (c, i) { return i > 0 && totals[n - 1][i] === totals[n - 1][0]; }));
    var marked = {};
    top.forEach(function (c) { marked[c] = "strong"; });
    (rep.beatsFor || []).forEach(function (c) { if (!marked[c]) marked[c] = "mid"; });
    if (focus) marked[focus] = "me";
    function path(ci) {
      var d = "";
      behind.forEach(function (row, i) {
        d += i ? "H" + X(i).toFixed(1) + "V" + Y(row[ci]).toFixed(1) : "M" + X(0).toFixed(1) + " " + Y(row[ci]).toFixed(1);
      });
      return d;
    }
    var order = { ctx: 0, mid: 1, strong: 2, me: 3 };
    rep.coaches.map(function (c, ci) { return { c: c, ci: ci, role: marked[c] || "ctx" }; })
      .sort(function (a, b) { return order[a.role] - order[b.role]; })
      .forEach(function (ln) { svg.appendChild(svgEl("path", { class: "ln " + ln.role, d: path(ln.ci) })); });
    // end labels: names that finish level share one; one that would collide is left off
    var ends = {};
    rep.coaches.forEach(function (c, ci) {
      if (!marked[c]) return;
      var v = behind[n - 1][ci];
      svg.appendChild(svgEl("circle", { class: "end " + marked[c], cx: X(n - 1), cy: Y(v), r: 4 }));
      (ends[v] = ends[v] || []).push(c);
    });
    var taken = [];
    Object.keys(ends).map(Number).sort(function (a, b) { return a - b; }).forEach(function (v) {
      var yy = Y(v), who_ = ends[v];
      if (taken.some(function (t) { return Math.abs(t - yy) < 14; })) return;
      taken.push(yy);
      var mineHere = who_.indexOf(focus) >= 0;
      var text = who_.length > 1 ? who_[0] + " +" + (who_.length - 1) : who_[0];
      if (who_.length === 2 && (who_[0] + who_[1]).length < (narrow ? 14 : 24)) text = who_[0] + " & " + who_[1];
      if (text.length > (narrow ? 14 : 24)) text = text.slice(0, narrow ? 13 : 23) + "…";
      svg.appendChild(svgEl("text", { class: "lbl" + (mineHere ? " me" : ""), x: X(n - 1) + 8, y: yy + 4, text: text }));
    });
    var marker = svgEl("line", { class: "now", x1: X(pos), x2: X(pos), y1: padT - 4, y2: H - padB });
    svg.appendChild(marker);
    var hit = svgEl("rect", { class: "hit scrub", x: padL, y: 0, width: Math.max(1, width - padL - padR), height: H });
    function pick(evt) {
      var box = svg.getBoundingClientRect();
      var px = (evt.clientX - box.left) * (width / box.width);
      var i = Math.round((px - padL) / Math.max(1, width - padL - padR) * (n - 1));
      return Math.max(0, Math.min(n - 1, i));
    }
    var dragging = false;
    hit.addEventListener("pointerdown", function (e) { dragging = true; replayGo(rep, pick(e)); });
    hit.addEventListener("pointermove", function (e) { if (dragging) replayGo(rep, pick(e)); });
    ["pointerup", "pointerleave", "pointercancel"].forEach(function (k) { hit.addEventListener(k, function () { dragging = false; }); });
    svg.appendChild(hit);
    rep.moveMarker = function (i) { marker.setAttribute("x1", X(i)); marker.setAttribute("x2", X(i)); };
    return svg;
  }

  // Move the replay to frame i: the marker, the slider and the readout, no redraw.
  function replayGo(rep, i) {
    i = Math.max(0, Math.min(rep.frames.length - 1, i));
    replayPos[rep.week] = i;
    if (rep.moveMarker) rep.moveMarker(i);
    if (rep.slider && Number(rep.slider.value) !== i) rep.slider.value = String(i);
    if (rep.fill) rep.fill(i);
  }
  function stopReplay() {
    if (replayTimer) { clearInterval(replayTimer); replayTimer = null; }
  }

  function replayModule(w) {
    var got = replayOf(w);
    if (!got) return null;
    var info = w.replay;
    var aside = plural(info.scores || 0, "score") + " · lead changed hands " + plural(info.lead_changes || 0, "time");
    if (got.state === "loading") return module("The week, replayed", aside, [el("div", { class: "chart-wait" }, [el("p", { class: "note", text: "Loading the replay…" })])], { "data-card": "replay" });
    if (got.state === "failed") return module("The week, replayed", aside, [stateMsg("Replay unavailable", "This week’s replay file couldn’t be loaded - check the connection. The week’s results are unaffected.",
      { text: "Try again", go: function () { delete replays[w.week]; render({ quiet: true }); } }, "bad")], { "data-card": "replay" });
    var rep = got.data;
    var n = rep.frames.length;
    if (!n) return null;
    rep.beatsFor = (w.beats || []).filter(function (b) { return b.kind === "bad-beat" || b.kind === "front-runner"; }).map(function (b) { return b.who; });
    var start = replayPos[w.week];
    if (start == null || start >= n) start = n - 1;
    replayPos[w.week] = start;
    var focus = highlighted();
    var mine = rep.coaches.indexOf(focus);

    var when = el("span", { class: "rp-when" });
    var head = el("b", { class: "rp-head" });
    var play = el("span", { class: "rp-play" });
    var board = el("ol", { class: "rp-board", "aria-live": "polite" });
    rep.fill = function (i) {
      var f = rep.frames[i];
      var words = frameWords(rep, i);
      when.textContent = frameTime(f);
      head.textContent = words.head;
      play.textContent = words.play;
      var t = frameTotals(f), places = placesAt(t);
      var before = i ? frameTotals(rep.frames[i - 1]) : t;
      var order = t.map(function (v, ci) { return ci; }).sort(function (a, b) { return t[b] - t[a] || rep.coaches[a].localeCompare(rep.coaches[b]); });
      var shown = order.slice(0, 5);
      if (mine >= 0 && shown.indexOf(mine) < 0) shown.push(mine);
      board.textContent = "";
      shown.forEach(function (ci) {
        var moved = t[ci] - before[ci];
        board.appendChild(el("li", { class: ci === mine ? "me" : null }, [
          el("span", { class: "pos", text: (places.filter(function (p) { return p === places[ci]; }).length > 1 ? "T" : "") + places[ci] }),
          el("span", { class: "nm", text: rep.coaches[ci] }),
          el("span", { class: "tot num", text: String(t[ci]) }),
          el("span", { class: "mv " + (moved > 0 ? "up" : moved < 0 ? "down" : ""), text: moved > 0 ? "+" + moved : moved < 0 ? "−" + (-moved) : "" })
        ]));
      });
      var lead = leadersAt(t);
      rep.leadText.textContent = lead.length === 1 ? "Leading: " + rep.coaches[lead[0]] + " with " + t[lead[0]]
        : lead.length <= 3 ? "Level at the top on " + t[lead[0]] + ": " + listNames(lead.map(function (ci) { return rep.coaches[ci]; }))
        : plural(lead.length, "coach", "coaches") + " level at the top on " + t[lead[0]];
    };
    rep.leadText = el("span", { class: "rp-lead" });
    var slider = el("input", { type: "range", min: "0", max: String(n - 1), step: "1", value: String(start), class: "rp-slider",
      "aria-label": "Move through the week", oninput: function (e) { stopReplay(); replayGo(rep, Number(e.target.value)); } });
    rep.slider = slider;
    var playBtn = el("button", { class: "btn rp-play-btn", type: "button", text: "▶ Play" });
    playBtn.addEventListener("click", function () {
      if (replayTimer) { stopReplay(); playBtn.textContent = "▶ Play"; return; }
      var i = replayPos[w.week] >= n - 1 ? 0 : replayPos[w.week];
      var step = Math.max(35, Math.round(14000 / n));
      playBtn.textContent = "❚❚ Pause";
      replayGo(rep, i);
      replayTimer = setInterval(function () {
        if (!slider.isConnected) { stopReplay(); return; }
        i++;
        replayGo(rep, i);
        if (i >= n - 1) { stopReplay(); playBtn.textContent = "▶ Play"; }
      }, step);
    });
    function nudge(by) { return function () { stopReplay(); playBtn.textContent = "▶ Play"; replayGo(rep, (replayPos[w.week] || 0) + by); }; }
    rep.week = w.week;
    var box = el("div", { class: "replay" }, [
      chartBox("replay-" + w.week, 230, function (width) { return replayChart(rep, width, replayPos[w.week], focus); }),
      el("div", { class: "rp-controls" }, [playBtn,
        el("button", { class: "btn", type: "button", "aria-label": "Back one", text: "‹", onclick: nudge(-1) }),
        slider,
        el("button", { class: "btn", type: "button", "aria-label": "On one", text: "›", onclick: nudge(1) })]),
      el("div", { class: "rp-read" }, [el("div", { class: "rp-moment" }, [when, head, play]),
        el("div", { class: "rp-standing" }, [rep.leadText, board])]),
      rep.adjusted && rep.adjusted.length ? el("p", { class: "note", text: "The last step puts in the pool’s own scores for " + listNames(rep.adjusted) + ", whose card the replay only partly knew." }) : null,
      el("p", { class: "note", text: "Each step is a kickoff, a score or a final whistle. The scores show where the week stood at that moment. The line is wins behind the leader." })
    ]);
    rep.fill(start);
    return module("The week, replayed", aside, [box], { "data-card": "replay", id: "replay-card" });
  }

  // ---- bad beats: what only the order of things tells -----------------------------------
  function beatsModule(w) {
    var beats = w.beats || [];
    if (!beats.length) return null;
    var canWatch = !!w.replay;
    return module("Bad beats", "and the moments that decided it", beats.map(function (b) {
      return el("div", { class: "award beat", "data-beat": b.kind }, [
        el("span", { class: "t", text: b.title }),
        el("span", { class: "w", text: b.who }),
        el("span", { class: "why", text: b.detail }),
        el("span", { class: "beat-foot" }, [b.at ? el("span", { class: "when", text: frameTime([b.at]) }) : null,
        canWatch && b.frame != null ? el("button", { class: "linkish watch", type: "button", text: "Watch it",
          onclick: function () {
            stopReplay();
            replayPos[w.week] = b.frame;
            var got = replays[w.week];
            var rep = got && got.data ? got.data : w.replay && w.replay.data;
            if (rep && rep.slider && rep.slider.isConnected) replayGo(rep, b.frame);
            var card = document.getElementById("replay-card");
            if (card) card.scrollIntoView({ behavior: "smooth", block: "start" });
          } }) : null])
      ]);
    }), { "data-card": "beats" });
  }

  // ---- blind spots, the line move and chaos (patterns.py) -----------------------------------
  // Every split is set against how the rest of the pool did in the same games, so a
  // hard week or a trap line counts against nobody.
  function pctText(x) { return Math.round(100 * x) + "%"; }
  function signed(x, digits) { return (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(digits == null ? 1 : digits); }
  function spotRecord(s) { return s.right + "–" + (s.picks - s.right); }
  function firstLower(text) { return text.charAt(0).toLowerCase() + text.slice(1); }
  function blindSpotsModule(p) {
    var pt = p.patterns;
    if (!pt || !pt.overall || !pt.overall.picks) return null;
    var kids = [];
    function row(kind, s) {
      return el("div", { class: "award", "data-spot": kind }, [
        el("span", { class: "t", text: kind === "blind" ? "Blind spot" : "Strong suit" }),
        el("span", { class: "w", text: s.label + " · " + spotRecord(s) }),
        el("span", { class: "why", text: pctText(s.right / s.picks) + " right, where the rest of the pool hit " + pctText(s.field) + " in the same games." })
      ]);
    }
    (pt.blind || []).forEach(function (s) { kids.push(row("blind", s)); });
    (pt.strong || []).forEach(function (s) { kids.push(row("strong", s)); });
    if (!kids.length) kids.push(el("p", { class: "note", text: "No blind spot or strong suit stands out yet – " + p.name + " picks about as well as usual everywhere." }));
    function teamList(list) { return list.map(function (s) { return firstLower(s.label) + " " + spotRecord(s); }).join(", "); }
    var teams = [];
    if ((pt.weak_teams || []).length) teams.push("weakest " + teamList(pt.weak_teams));
    if ((pt.best_teams || []).length) teams.push("best " + teamList(pt.best_teams));
    if (teams.length) kids.push(el("p", { class: "race-sum", text: "By team: " + teams.join("; ") + "." }));
    var m = pt.move;
    if (m && m.moved) kids.push(el("p", { class: "race-sum", text: "The line move: on the side the line moved toward " + m.with + " of " + plural(m.moved, "time") +
      " it moved a point or more – " + signed(m.gained, 2) + " wins of value between the opening line and kickoff, " + ordinal(m.rank) + " of " + m.of + "." }));
    var a = pt.adjusted;
    if (a) {
      var text = "Weighed by how hard each week was: " + a.adjusted.toFixed(1) + " a week, " + ordinal(a.rank) + " (" + ordinal(a.actual) + " as scored).";
      if (a.wild != null) text += " In wild weeks " + signed(a.wild) + " against the pool" + (a.calm != null ? ", in calm ones " + signed(a.calm) + "." : ".");
      kids.push(el("p", { class: "race-sum", text: text }));
    }
    kids.push(el("p", { class: "note", text: "Each one is compared with how the rest of the pool did in the same games. The line move is settled before kickoff, so it’s skill rather than luck." }));
    return module("Blind spots", spotRecord(pt.overall) + " on every pick", kids, { "data-card": "spots" });
  }

  // How wild a week was against the lines: 0 every favourite came in, 10 once in years.
  function chaosModule(w) {
    var c = w.chaos;
    if (!c) return null;
    return module("Chaos rating", "week " + w.week, [
      el("div", { class: "meter" }, [
        el("div", { class: "top" }, [el("b", { text: c.label }), el("span", { class: "num", text: c.rating.toFixed(1) })]),
        el("div", { class: "track", role: "img", "aria-label": "Chaos rating " + c.rating.toFixed(1) + " of 10" }, [
          el("div", { class: "fill", style: "width:" + Math.round(c.rating * 10) + "%" })]),
        el("span", { class: "why", text: plural(c.upsets, "upset") + " where the lines expected " + c.expected.toFixed(1) + "." +
          (c.biggest ? " The biggest: " + c.biggest + "." : "") })
      ]),
      el("p", { class: "note", text: "A score out of 10 for how surprising the week’s results were. A 7 means seven weeks in ten would have been calmer." })
    ], { "data-card": "chaos" });
  }

  // ---- pick twins and nemeses ---------------------------------------------------------------
  // From every game played: who picks most like this coach and least like them,
  // and who has had the better of them week for week - and who they've had the
  // better of. Head-to-head shows any pair in full.
  var TWIN_MIN_GAMES = 10;
  function matchups(name) {
    return names().filter(function (n) { return n !== name; }).map(function (n) {
      var c = compare(name, n), margin = 0;
      c.weeks.forEach(function (r) { if (r.a != null && r.b != null) margin += r.a - r.b; });
      return { name: n, c: c, agree: c.both >= TWIN_MIN_GAMES ? c.agree / c.both : null, net: c.aWeeks - c.bWeeks, margin: margin };
    });
  }
  function twinsModule(p) {
    var all = matchups(p.name);
    var known = all.filter(function (m) { return m.agree != null; });
    if (!known.length) return null;
    function best(list, better) { return list.slice().sort(better)[0]; }
    var twin = best(known, function (a, b) { return b.agree - a.agree || b.c.both - a.c.both || a.name.localeCompare(b.name); });
    var opposite = best(known, function (a, b) { return a.agree - b.agree || b.c.both - a.c.both || a.name.localeCompare(b.name); });
    var nemesis = best(all.filter(function (m) { return m.net < 0; }), function (a, b) { return a.net - b.net || a.margin - b.margin || a.name.localeCompare(b.name); });
    var victim = best(all.filter(function (m) { return m.net > 0; }), function (a, b) { return b.net - a.net || b.margin - a.margin || a.name.localeCompare(b.name); });
    function pct(m) { return Math.round(100 * m.agree) + "%"; }
    function weeksText(m) {
      var more = m.margin > 0 ? p.name : m.margin < 0 ? m.name : "";
      return "Higher score: " + p.name + " " + plural(m.c.aWeeks, "week") + ", " + m.name + " " + m.c.bWeeks +
        (m.c.level ? ", level " + m.c.level : "") + (more ? " · " + more + " by " + plural(Math.abs(m.margin), "win") + " in all" : "");
    }
    function row(kind, label, m, big, meta) {
      return el("button", { class: "twin", type: "button", "data-twin": kind, title: "Head-to-head: " + p.name + " and " + m.name,
        onclick: function () { state.a = p.name; state.b = m.name; store(VS_KEY, m.name); go("h2h"); } }, [
        el("span", { class: "k", text: label }),
        el("span", { class: "nm", text: m.name }),
        el("span", { class: "big num", text: big }),
        el("span", { class: "meta", text: meta })
      ]);
    }
    var kids = [];
    kids.push(row("twin", "Pick twin", twin, pct(twin), "The same side in " + twin.c.agree + " of " + plural(twin.c.both, "game")));
    if (opposite && opposite.name !== twin.name) kids.push(row("opposite", "Opposite", opposite, pct(opposite),
      "The same side in only " + opposite.c.agree + " of " + plural(opposite.c.both, "game")));
    if (nemesis) kids.push(row("nemesis", "Nemesis", nemesis, nemesis.c.aWeeks + "–" + nemesis.c.bWeeks, weeksText(nemesis)));
    if (victim) kids.push(row("victim", "Favourite victim", victim, victim.c.aWeeks + "–" + victim.c.bWeeks, weeksText(victim)));
    var up = all.filter(function (m) { return m.net > 0; }).length, down = all.filter(function (m) { return m.net < 0; }).length;
    var even = all.length - up - down;
    var parts = ["the better of " + (up || "none") + (up ? " of " + plural(all.length, "coach", "coaches") : ""),
      down ? "the worse of " + down : "the worse of nobody"];
    if (even) parts.push("even with " + even);
    kids.push(el("p", { class: "race-sum", text: "Week for week, " + p.name + " has had " + parts.slice(0, -1).join(", ") + " and " + parts[parts.length - 1] + "." }));
    kids.push(el("p", { class: "note", text: "Tap one for the full head-to-head. Twins are counted over every game played. Weeks include Big Loser points." }));
    return module("Twins and nemeses", null, [el("div", { class: "twins" }, kids)], { "data-card": "twins" });
  }

  // ---- Me: pick your name once, then your page --------------------------------------------
  function meView() {
    if (hasMe()) return coachView(player(state.me));
    var filterText = state.filter || "";
    var all = names().slice().sort(function (a, b) { return a.localeCompare(b); });
    var shown = all.filter(function (n) { return !filterText || n.toLowerCase().indexOf(filterText.toLowerCase()) >= 0; });
    var input = el("input", { class: "filter", id: "name-filter", type: "search", placeholder: "Find your name", "aria-label": "Find your name", value: filterText,
      oninput: function (e) {
        state.filter = e.target.value;
        var grid = document.getElementById("name-grid");
        if (!grid) return;
        Array.prototype.forEach.call(grid.children, function (b) {
          b.hidden = !!state.filter && b.getAttribute("data-name").toLowerCase().indexOf(state.filter.toLowerCase()) < 0;
        });
      } });
    return el("div", { class: "view", "data-view": "me" }, [
      el("div", { class: "pagehead" }, [el("h1", { text: "Who are you?" })]),
      el("p", { class: "lede", text: "Pick your name and the site puts you first: your week on the home page, your rows highlighted, your own page here. It’s remembered on this phone only." }),
      input,
      el("div", { class: "namegrid", id: "name-grid" }, all.map(function (n) {
        return el("button", { type: "button", "data-name": n, hidden: shown.indexOf(n) < 0,
          onclick: function () { state.me = n; remember(n); state.filter = ""; noteMyChanceSoon(); render({ top: true }); } },
          [el("span", { class: "initials", style: avatarStyle(n), text: initials(n) }), el("span", { text: n })]);
      }))
    ]);
  }
  function noteMyChanceSoon() { if (hasLive() && live.fetched) setTimeout(function () { noteMyChance(liveTally()); }, 0); }

  // ---- one coach's page (the viewer's own is Me) -------------------------------------------
  function coachView(p) {
    var mine = isMe(p.name);
    var s = p.suicide;
    var lead = DATA.players.length ? DATA.players[0].wins : 0;
    var weeks = DATA.weeks.slice().sort(function (a, b) { return b.week - a.week; });
    var played = 0, won = 0, best = null, worst = null, diff = 0, moneyWon = 0;
    var rows = [];
    weeks.forEach(function (w) {
      var me = null;
      for (var i = 0; i < w.scores.length; i++) if (w.scores[i].name === p.name) me = w.scores[i];
      if (!me) return;

        el("div", {}, [el("b", { text: "Champion " + y }), el("span", { class: "note", text: champs[y].note || "Won the season" })])]);
    }).concat(mine.map(function (a) {
      return el("div", { class: "trophy" }, [el("span", { class: "ic", "aria-hidden": "true", text: a.icon }),
        el("div", {}, [el("b", { text: a.title + (a.current ? "" : " " + a.year) }),
          el("span", { class: "note", text: a.text + (a.who.length > 1 ? ", shared" : "") + (a.current ? " · holds it so far" : "") })])]);
    }));
    return module("Trophy shelf", kids.length ? plural(kids.length, "trophy", "trophies") : null,
      kids.length ? [el("div", { class: "trophies shelf" }, kids), moreLink("Every award", "awards")]
        : [el("p", { class: "note", text: "Nothing on the shelf yet. " + (DATA.weeks.length < 2 ? "Trophies start once two weeks are done." : "There’s a season of them to win.") }),
          moreLink("The awards", "awards")],
      { "data-card": "trophies-for" });
  }
  // Every trophy one coach holds, this season and in the archive.
  function trophiesOf(name) {
    var out = [];
    allSeasons().forEach(function (s) {
      seasonAwards(s).forEach(function (a) { if (a.who.indexOf(name) >= 0) out.push(a); });
    });
    return out;
  }

  // ---- share my week: a picture for the group chat -----------------------------------------
  // Drawn on the phone itself - no server - in the site's on-air colours. It
  // opens the phone's share sheet where there is one, and offers the file to
  // save everywhere else.
  function shareWeek(name) {
    var p = player(name);
    if (!p) return;
    var W = 1080, H = 1350;
    var canvas = document.createElement("canvas");
    canvas.width = W;
    canvas.height = H;
    var g = canvas.getContext("2d");
    var DISPLAY = '"Big Shoulders", "Big Shoulders Display", "Barlow Condensed", "Arial Narrow", sans-serif';
    var BODY = '"Barlow", "Segoe UI", system-ui, sans-serif';
    var fontsReady = document.fonts && document.fonts.load ? Promise.all([
      document.fonts.load("800 120px " + DISPLAY), document.fonts.load("600 40px " + BODY)
    ]).catch(function () {}) : Promise.resolve();
    var img = new Image();
    var crestReady = new Promise(function (resolve) {
      img.onload = resolve;
      img.onerror = resolve;
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(CREST.replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" '));
    });
    var timeout = new Promise(function (resolve) { setTimeout(resolve, 1500); });
    Promise.race([Promise.all([fontsReady, crestReady]), timeout]).then(function () {
      draw();
      canvas.toBlob(function (blob) { if (blob) offer(blob); }, "image/png");
    });

    function fit(text, size, weight, family, room) {
      var s = size;
      g.font = weight + " " + s + "px " + family;
      while (g.measureText(text).width > room && s > size * 0.45) { s -= 2; g.font = weight + " " + s + "px " + family; }
      return s;
    }
    function draw() {
      g.fillStyle = "#0a0c0b";
      g.fillRect(0, 0, W, H);
      // a gold slash in the corner, like the lower third's
      g.save();
      g.fillStyle = "rgba(232, 178, 58, 0.14)";
      g.beginPath(); g.moveTo(W - 300, 0); g.lineTo(W - 160, 0); g.lineTo(W - 420, H); g.lineTo(W - 560, H); g.closePath(); g.fill();
      g.restore();
      g.fillStyle = "#efb32f";
      g.fillRect(0, 0, 14, H);
      if (img.complete && img.naturalWidth) g.drawImage(img, 70, 64, 120, 134);
      g.textBaseline = "alphabetic";
      g.fillStyle = "#f3f6fa";
      g.font = "800 84px " + DISPLAY;
      g.fillText("ACQL", 214, 150);
      var w1 = g.measureText("ACQL ").width;
      g.fillStyle = "#efb32f";
      g.fillText(String(seasonYear()), 214 + w1, 150);
      g.fillStyle = "#a9b3ab";
      g.font = "600 30px " + BODY;
      g.fillText("Arm Chair Quarterback League", 216, 192);

      g.fillStyle = "#f3f6fa";
      var size = fit(p.name, 150, 800, DISPLAY, W - 140);
      g.fillText(p.name, 70, 380);

      // this week, or the last one played
      var lines = weekLines(p);
      g.fillStyle = "#151b17";
      g.fillRect(70, 440, W - 140, 330);
      g.fillStyle = "#efb32f";
      g.fillRect(70, 440, W - 140, 8);
      g.fillStyle = "#efb32f";
      g.font = "700 36px " + BODY;
      g.fillText(lines.kicker, 110, 520);
      g.fillStyle = "#f3f6fa";
      fit(lines.big, 120, 800, DISPLAY, W - 220);
      g.fillText(lines.big, 110, 640);
      g.fillStyle = "#c5cdc6";
      g.font = "500 38px " + BODY;
      g.fillText(lines.small, 110, 718);

      // the season, the side pools
      var s = p.suicide;
      var rows = [
        ["Season", plural(p.wins, "win") + (p.place != null ? ", " + ordinal(p.place) + " of " + DATA.entrants : "") + (p.move ? (p.move > 0 ? "  ▲" : "  ▼") + Math.abs(p.move) : "")],
        ["Suicide pool", s.alive ? "still in" : s.out ? "out in week " + s.out : "not in it"],
        ["Big Loser", plural(p.big_loser || 0, "point")]
      ];
      var y = 880;
      rows.forEach(function (r) {
        g.fillStyle = "#a9b3ab";
        g.font = "600 34px " + BODY;
        g.fillText(r[0], 70, y);
        g.fillStyle = "#f3f6fa";
        g.font = "800 60px " + DISPLAY;
        g.fillText(r[1], 70, y + 64);
        y += 140;
      });
      g.fillStyle = "#a9b3ab";
      g.font = "500 28px " + BODY;
      var site = LIVE.hosted ? location.origin + location.pathname : "";
      g.fillText(site.replace(/^https?:\/\//, "").replace(/\/$/, ""), 70, H - 50);
      return size;
    }
    function offer(blob) {
      var file = null;
      var fileName = "ACQL " + seasonYear() + " - " + p.name.replace(/[^\w .-]+/g, "") + ".png";
      try { file = new File([blob], fileName, { type: "image/png" }); } catch (e) { file = null; }
      var url = URL.createObjectURL(blob);
      var canShare = !!(file && navigator.canShare && navigator.canShare({ files: [file] }));
      var view = el("div", { class: "shareview", role: "dialog", "aria-modal": "true", "aria-label": "Share " + p.name + "’s week",
        onclick: function (e) { if (e.target === view) close(); }, onkeydown: function (e) { if (e.key === "Escape") close(); }, tabindex: "-1" }, [
        el("div", { class: "inner" }, [
          el("img", { src: url, alt: p.name + "’s week, as a picture" }),
          el("div", { class: "acts" }, [
            canShare ? el("button", { class: "btn primary", type: "button", onclick: function () {
              navigator.share({ files: [file], title: "ACQL", text: p.name + "’s week" }).catch(function () { /* closed: fine */ });
            } }, [icon("share"), "Share"]) : null,
            el("a", { class: "btn" + (canShare ? "" : " primary"), href: url, download: fileName, text: "Save picture" }),
            el("button", { class: "btn", type: "button", text: "Close", onclick: close })
          ]),
          el("p", { class: "note", style: "color:#c5cdc6;text-align:center", text: "On a phone you can also press and hold the picture to save it." })
        ])
      ]);
      function close() { view.remove(); URL.revokeObjectURL(url); }
      document.body.appendChild(view);
      view.focus();
    }
  }
  // What the picture says about the week: the one being played if it has
  // started, else the last one finished.
  function weekLines(p) {
    if (hasLive() && live.fetched) {
      var t = liveTally();
      var r = t.rows.filter(function (x) { return x.c.name === p.name; })[0];
      if (r && t.games.some(function (x) { return x.state !== "pre"; })) {
        var place = 1 + t.rows.filter(function (o) { return o.now > r.now; }).length;
        var over = weekOver(t);
        return { kicker: "Week " + DATA.live.week + (over ? ", final" : " live"),
          big: plural(r.now, "win") + ", " + ordinal(place),
          small: over ? (place === 1 ? "Won the week" : "of " + t.rows.length) : pct(simulate(t).chance[p.name] || 0) + " to win the week" };
      }
    }
    var w = weekData(DATA.through_week);
    var mine = w ? w.scores.filter(function (s) { return s.name === p.name; })[0] : null;
    if (!mine) return { kicker: "After week " + DATA.through_week, big: plural(p.wins, "win"), small: "this season" };
    var rank = 1 + w.scores.filter(function (o) { return o.total > mine.total; }).length;
    var won = w.winners.indexOf(p.name) >= 0;
    return { kicker: "Week " + w.week, big: plural(mine.total, "win") + ", " + ordinal(rank) + (won ? " ★" : ""),
      small: won ? "Won the week" + (w.payout_each ? ", " + money(w.payout_each) : "") : "of " + w.scores.length + ", the pool averaged " + w.average.toFixed(1) };
  }

  // ---- starting up -----------------------------------------------------------------
  // Whatever DATA the page shows, the things worked out from it start afresh.
  function dataChanged() {
    poolProfile = null;
    formCache = null;
    historyData = null;
    historyError = "";
    simCache = { key: "", sim: null };
  }
  function route(hash) {
    var wanted = String(hash || "").replace("#", "");
    state.coach = "";
    if (wanted.indexOf("coach=") === 0) {
      try { state.coach = decodeURIComponent(wanted.slice(6)); } catch (e) { state.coach = ""; }
    } else if (wanted.indexOf("vs=") === 0) {
      // a shared matchup: #vs=First%20coach&Second%20coach
      var both = wanted.slice(3).split("&");
      try { state.a = decodeURIComponent(both[0] || ""); state.b = decodeURIComponent(both[1] || ""); } catch (e) { state.a = state.b = ""; }
      state.view = "h2h";
    } else if (wanted) {
      var v = ALIASES[wanted] || wanted;
      if (VIEWS[v]) state.view = v;
    }
    if (!available(state.view)) state.view = "home";
  }
  route(location.hash);
  window.addEventListener("hashchange", function () { route(location.hash); render({ top: true }); freshen(); });
  if (live.fetched && hasLive()) lastSeen = seen(liveTally());
  if (hasLive()) setTimeout(fetchScores, 0);
  render();
  // Saved to a phone's home screen, the site opens at once and works with no signal.
  if (LIVE.hosted === "web" && "serviceWorker" in navigator &&
      (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { /* the site works the same without it */ });
    });
  }

  // ---- updating the page (only whoever can edit it sees any of this) -----------------
  function pageSource(data) {
    var style = document.getElementById("pool-style").textContent;
    var code = document.getElementById("pool-app").textContent;
    var json = JSON.stringify(data).replace(/</g, "\\u003c");
    return "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">" +
      "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">" +
      "<title>" + TITLE + "</title>" +
      "<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">" +
      "<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>" +
      FONTS.map(function (f) { return "<link rel=\"stylesheet\" href=\"" + f + "\">"; }).join("") +
      "<style id=\"pool-style\">" + style + "</style></head><body>" +
      "<div id=\"app\" class=\"page\"></div>" +
      "<script type=\"application/json\" id=\"pool-data\">" + json + "<\/script>" +
      "<script id=\"pool-app\">" + code + "<\/script></body></html>";
  }
  function checkData(d) {
    if (!d || d.schema !== 1 || !Array.isArray(d.players) || !Array.isArray(d.weeks) || typeof d.through_week !== "number") {
      return "That isn’t a pool page file. In the dashboard click Results › Pool page, then choose the file it saves (ACQL pool page - week N.json, in Downloads).";
    }
    if (!d.players.length) return "That file has no coaches in it.";
    if (!d.weeks.length) return "That file has no finished weeks in it yet.";
    return "";
  }
  // Who can update the page: the top button shows once the page knows this
  // viewer can edit it. Everyone else gets a small link at the bottom that
  // offers the same thing - and, where this view can't publish, says why -
  // so the owner is never left without a way in.
  // On the pool's own website (DATA.hosted) the dashboard publishes the page, so there is nothing to update here.
  var caps = { checking: !LIVE.hosted && !!(window.claude && typeof window.claude.use === "function"), artifact: null, editor: null };
  var ownerShown = false;
  var input = el("input", { type: "file", accept: ".json,application/json", hidden: true });
  var updateBox = el("div", { class: "update", role: "status" });
  function show(kids) {
    updateBox.textContent = "";
    kids.forEach(function (k) { if (k) updateBox.appendChild(k); });
    updateBar = updateBox;
    render();
    try { window.scrollTo({ top: 0, behavior: "smooth" }); } catch (e) { window.scrollTo(0, 0); }
  }
  function close() {
    updateBar = null;
    DATA = LIVE;
    dataChanged();
    input.value = "";
    render();
  }
  function closeButton() {
    return el("div", { class: "owner" }, [el("button", { class: "btn", type: "button", text: "Close", onclick: close })]);
  }
  function startUpdate() {
    if (caps.checking) {
      show([el("p", { text: "Still checking whether this view can update the page. Try again in a few seconds." }), closeButton()]);
    } else if (!caps.artifact) {
      show([el("p", { class: "error", text: "This view can’t update the page. Open it signed in to your Claude account on a computer (claude.ai in a browser, or the Claude app), then try again." }), closeButton()]);
    } else {
      input.click();
    }
  }
  function publishing(data) {
    var publish = el("button", { class: "btn primary", type: "button", text: "Publish for everyone" });
    var cancel = el("button", { class: "btn", type: "button", text: "Cancel", onclick: close });
    publish.addEventListener("click", function () {
      publish.disabled = true;
      cancel.disabled = true;
      publish.textContent = "Publishing…";
      caps.artifact.publish(pageSource(data)).then(function () {
        publish.textContent = "Published · reloading";
      }).catch(function (err) {
        var code = err && err.code;
        if (code === "conflict") return;          // a newer version won; the page is reloading to it
        cancel.disabled = false;
        var readOnly = ["not_writer", "not_granted", "not_declared", "consent_required", "capability_disabled", "capability_removed"].indexOf(code) >= 0;
        publish.disabled = readOnly;
        publish.textContent = "Publish for everyone";
        updateBox.appendChild(el("p", { class: "error", text:
          readOnly ? "This view can’t publish the page (" + code + "). Only the page’s owner can, signed in to their Claude account on a computer." :
          code === "too_large" ? "That file is too big for the page." :
          code === "rate_limited" ? "Published too often just now. Wait a minute, then try again." :
          "Couldn’t publish just now (" + (code || "unknown") + "). Try again in a minute." }));
      });
    });
    return el("div", { class: "owner" }, [publish, cancel]);
  }
  function read(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onerror = function () { show([el("p", { class: "error", text: "Couldn’t read that file." }), closeButton()]); };
    reader.onload = function () {
      var data = null, problem = "";
      try { data = JSON.parse(String(reader.result)); } catch (e) { problem = "That isn’t a pool page file (it isn’t readable JSON)."; }
      problem = problem || checkData(data);
      if (problem) { show([el("p", { class: "error", text: problem }), closeButton()]); return; }
      var older = data.through_week < LIVE.through_week;
      DATA = data;
      dataChanged();
      state.week = data.through_week;
      show([
        el("p", {}, [el("b", { text: "Preview: after week " + data.through_week }),
          " · " + plural(data.players.length, "coach", "coaches") + " · made " + when(data.generated) +
          ". Nobody else sees this until you publish."]),
        older ? el("p", { class: "error", text: "This file is older than the page (week " + data.through_week + ", the page shows week " + LIVE.through_week + ")." }) : null,
        publishing(data)
      ]);
    };
    reader.readAsText(file);
  }
  input.addEventListener("change", function () { read(input.files && input.files[0]); });
  document.body.appendChild(input);
  function ownerFooter() {
    if (ownerShown || LIVE.hosted) return null;
    return el("button", { class: "linkish", type: "button", onclick: startUpdate, text: "Page owner: update this page" });
  }
  function showOwnerButton() {
    var box = document.getElementById("owner");
    if (ownerShown || !box) return;
    ownerShown = true;
    box.appendChild(el("button", { class: "btn", type: "button", onclick: startUpdate, text: "Update this page" }));
    // A file dragged onto the page works too.
    var depth = 0;
    document.addEventListener("dragenter", function (e) {
      if (!e.dataTransfer || Array.prototype.indexOf.call(e.dataTransfer.types || [], "Files") < 0) return;
      depth++;
      document.body.classList.add("dropping");
    });
    document.addEventListener("dragleave", function () {
      depth = Math.max(0, depth - 1);
      if (!depth) document.body.classList.remove("dropping");
    });
    document.addEventListener("dragover", function (e) { e.preventDefault(); });
    document.addEventListener("drop", function (e) {
      e.preventDefault();
      depth = 0;
      document.body.classList.remove("dropping");
      read(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]);
    });
  }
  function settle(promise, ms) {
    return new Promise(function (resolve) {
      var done = false;
      function finish(v) { if (!done) { done = true; resolve(v); } }
      setTimeout(function () { finish(null); }, ms);
      Promise.resolve(promise).then(finish, function () { finish(null); });
    });
  }
  function isEditor(user) {
    if (!user) return Promise.resolve(null);
    var asks = [
      typeof user.canEdit === "function" ? user.canEdit() : null,
      typeof user.isOwner === "function" ? user.isOwner() : null,
      typeof user.can === "function" ? user.can("files.write") : null
    ];
    return Promise.all(asks.map(function (a) { return settle(a, 8000); })).then(function (r) {
      return r[0] === true || r[1] === true || r[2] === true;
    });
  }
  if (caps.checking) {
    Promise.all([settle(window.claude.use("user"), 12000), settle(window.claude.use("artifact"), 12000)])
      .then(function (found) {
        caps.artifact = found[1];
        return isEditor(found[0]).then(function (editor) { caps.editor = editor; });
      })
      .catch(function () { /* treated as a view that can't publish */ })
      .then(function () {
        caps.checking = false;
        if (caps.artifact && caps.editor) showOwnerButton();
        render();
      });
  }

})();
</script>
