<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operation Sunday Lab</title>
<style>
:root {
  --bg: #07080a; --panel: #111317; --panel2: #171a20; --rule: #262a32; --ink: #f2f3f5; --muted: #8b919c;
  --gold: #d4a93c; --blue: #2f8cff; --good: #2fa36b; --bad: #d6453d; --warn: #e0a02a;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace; --body: "Segoe UI", system-ui, sans-serif;
  --r: 4px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--body); }
a { color: var(--blue); }
header { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--rule);
  position: sticky; top: 0; background: var(--bg); z-index: 5; flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); font-size: 13px; }
.brand small { color: var(--muted); letter-spacing: .1em; margin-left: 8px; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav a { color: var(--muted); text-decoration: none; font: 600 11px/1 var(--body); letter-spacing: .12em;
  text-transform: uppercase; padding: 8px 10px; border: 1px solid transparent; border-radius: var(--r); }
nav a.on { color: var(--ink); border-color: var(--blue); }
main { padding: 16px; max-width: 1280px; margin: 0 auto; }
h1 { font-size: 20px; margin: 0 0 4px; } h2 { font-size: 15px; margin: 18px 0 8px; }
.lbl { font: 600 10.5px/1.2 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.sub { color: var(--muted); margin: 0 0 14px; max-width: 80ch; }
.box { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r); padding: 12px; margin-bottom: 12px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 12px; }
.tile { background: var(--panel2); border: 1px solid var(--rule); border-radius: var(--r); padding: 10px; }
.tile b { display: block; font: 700 22px/1.1 var(--mono); margin-top: 4px; }
.num, td.n { font-family: var(--mono); font-variant-numeric: tabular-nums; }
label.f { display: flex; flex-direction: column; gap: 4px; }
select, input, textarea, button { font: inherit; color: var(--ink); background: var(--panel2); border: 1px solid var(--rule);
  border-radius: var(--r); padding: 6px 8px; }
button { cursor: pointer; } button.on, button.primary { border-color: var(--blue); color: #fff; background: #12305a; }
button:focus-visible, a:focus-visible, select:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th { font: 600 10.5px/1.2 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
th.s { cursor: pointer; } td.n, th.n { text-align: right; }
tr.sel td { background: #12305a55; } tr.click { cursor: pointer; } tr.click:hover td { background: #ffffff08; }
.note { color: var(--muted); font-size: 12.5px; } .warn { border-left: 3px solid var(--warn); padding-left: 10px; }
.tag { display: inline-block; font: 600 10px/1 var(--body); letter-spacing: .1em; text-transform: uppercase;
  padding: 3px 6px; border-radius: var(--r); border: 1px solid var(--rule); color: var(--muted); }
.tag.good { color: var(--good); border-color: var(--good); } .tag.bad { color: var(--bad); border-color: var(--bad); }
.tag.warn { color: var(--warn); border-color: var(--warn); } .tag.blue { color: var(--blue); border-color: var(--blue); }
.chip { display: inline-flex; gap: 6px; align-items: center; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.empty { color: var(--muted); padding: 24px; text-align: center; }
.err { color: var(--bad); }
.skel { height: 120px; border-radius: var(--r); background: linear-gradient(90deg, var(--panel) 0%, var(--panel2) 50%, var(--panel) 100%);
  background-size: 200% 100%; }
@media (prefers-reduced-motion: no-preference) { .skel { animation: sk 1.4s linear infinite; } }
@keyframes sk { to { background-position: -200% 0; } }
svg text { fill: var(--muted); font: 11px var(--mono); }
.tip { position: fixed; pointer-events: none; background: #000d; border: 1px solid var(--rule); padding: 6px 8px;
  border-radius: var(--r); font: 12px/1.4 var(--mono); z-index: 9; display: none; max-width: 280px; }
/* live */
.status { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.ok { background: var(--good); } .dot.stale { background: var(--warn); } .dot.down { background: var(--bad); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r); padding: 10px 12px;
  transition: border-color .5s ease, background-color .5s ease, opacity .5s ease; position: relative; }
.card[data-phase="live"] { border-color: var(--bad); }
.card[data-phase="halftime"] { border-color: var(--warn); }
.card[data-phase="final"] { opacity: .82; }
.card[data-phase="called-off"] { opacity: .5; }
.card { padding-top: 34px; } .card .ph { position: absolute; top: 9px; right: 12px; }
.card .t { display: flex; justify-content: space-between; align-items: baseline; padding: 2px 0; }
.card .t b { font: 700 22px/1.1 var(--mono); display: inline-block; min-width: 2ch; text-align: right; border-radius: var(--r); padding: 0 4px; }
.card .t.lead b { color: var(--gold); }
.card .d { color: var(--muted); font-size: 12px; margin-top: 4px; min-height: 1.4em; }
.card .sel { outline: 2px solid var(--blue); }
@media (prefers-reduced-motion: no-preference) {
  .flash { animation: flash 1.6s ease-out; }
  .card.pop { animation: pop .6s ease-out; }
  .card[data-phase="live"] .ph::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--bad); margin-right: 5px; animation: blink 1.6s ease-in-out infinite; vertical-align: middle; }
}
@media (prefers-reduced-motion: reduce) { .flash { outline: 2px solid var(--gold); } }
@keyframes flash { 0% { background: var(--gold); color: #000; } 100% { background: transparent; } }
@keyframes pop { 0% { box-shadow: 0 0 0 0 #2f8cff99; } 100% { box-shadow: 0 0 0 12px #2f8cff00; } }
@keyframes blink { 50% { opacity: .2; } }
.feed { max-height: 200px; overflow: auto; font: 12px/1.6 var(--mono); color: var(--muted); }
.teamgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.teamgrid a { display: flex; justify-content: space-between; padding: 6px 8px; text-decoration: none; color: var(--ink);
  border-bottom: 1px solid var(--rule); }
.teamgrid a:hover { background: #ffffff08; }
.answer { white-space: pre-wrap; line-height: 1.55; }
.presets button { margin: 0 6px 6px 0; font-size: 12.5px; }
@media (max-width: 600px) { main { padding: 12px; } header { padding: 10px 12px; } .tile b { font-size: 18px; } }
</style>
</head>
<body>
<header>
  <div class="brand">Operation Sunday <small>Lab · private, this computer only</small></div>
  <nav id="nav"></nav>
</header>
<main id="main"><div class="skel"></div></main>
<div class="tip" id="tip"></div>
<script>
"use strict";
var PAGES = [["live", "Live"], ["teams", "Teams"], ["strength", "Strength"], ["calibration", "Calibration"],
  ["confidence", "Confidence"], ["markets", "Markets"], ["stats", "Stats"], ["postmortems", "Postmortems"],
  ["assistant", "Assistant"]];
var COLORS = ["#2f8cff", "#d4a93c", "#2fa36b", "#d6453d", "#b07cff", "#4fd1c5"];
var cache = {};

// ---- small helpers ---------------------------------------------------------------
function el(tag, attrs, kids) {
  var n = document.createElement(tag);
  for (var k in attrs || {}) {
    var v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "text") n.textContent = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  (kids || []).forEach(function (c) { if (c != null) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return n;
}
function S(tag, attrs, kids) {
  var n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (var k in attrs || {}) if (attrs[k] != null) {
    if (k === "text") n.textContent = attrs[k];
    else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
  return n;
}
function pct(x, d) { return x == null ? "–" : (100 * x).toFixed(d == null ? 1 : d) + "%"; }
function fx(x, d) { return x == null ? "–" : Number(x).toFixed(d == null ? 2 : d); }
function signed(x, d) { return x == null ? "–" : (x > 0 ? "+" : "") + Number(x).toFixed(d == null ? 1 : d); }
function up(t) { return String(t || "").toUpperCase(); }
function ago(sec) {
  if (sec == null) return "never";
  var s = Math.max(0, Math.round(Date.now() / 1000 - sec));
  return s < 60 ? s + " s ago" : s < 3600 ? Math.round(s / 60) + " min ago" : Math.round(s / 3600) + " h ago";
}
function when(iso) {
  if (!iso) return "–";
  var d = typeof iso === "number" ? new Date(iso * 1000) : new Date(iso);
  return isNaN(d) ? String(iso) : d.toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}
function api(path) {
  if (cache[path]) return cache[path];
  cache[path] = fetch(path).then(function (r) {
    return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; });
  });
  cache[path].catch(function () { delete cache[path]; });
  return cache[path];
}
function post(path, body) {
  return fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Lab": "1" }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); });
}
function tip(e, text) {
  var t = document.getElementById("tip");
  if (!text) { t.style.display = "none"; return; }
  t.textContent = text; t.style.display = "block";
  t.style.left = Math.min(window.innerWidth - 290, e.clientX + 12) + "px"; t.style.top = (e.clientY + 12) + "px";
}
function loading(main) { main.innerHTML = ""; main.appendChild(el("div", { class: "skel" })); }
function failed(main, err) {
  main.innerHTML = "";
  main.appendChild(el("div", { class: "box err", text: "Couldn't load this page: " + (err && err.message || err) }));
}
function sel(label, options, value, onchange) {
  var s = el("select", { onchange: function () { onchange(s.value); } }, options.map(function (o) {
    var v = Array.isArray(o) ? o[0] : o, t = Array.isArray(o) ? o[1] : o;
    return el("option", { value: v, selected: String(v) === String(value) ? "selected" : null, text: t });
  }));
  return el("label", { class: "f" }, [el("span", { class: "lbl", text: label }), s]);
}
function table(heads, rows, opts) {
  opts = opts || {};
  var state = { key: opts.sort == null ? null : opts.sort, dir: opts.dir || -1 };
  var wrap = el("div", { class: "scroll" });
  function draw() {
    var data = rows.slice();
    if (state.key != null) data.sort(function (a, b) {
      var x = a.cells[state.key], y = b.cells[state.key];
      x = x && x.v !== undefined ? x.v : x; y = y && y.v !== undefined ? y.v : y;
      if (x == null) return 1; if (y == null) return -1;
      return (x > y ? 1 : x < y ? -1 : 0) * state.dir;
    });
    wrap.innerHTML = "";
    wrap.appendChild(el("table", {}, [
      el("thead", {}, [el("tr", {}, heads.map(function (h, i) {
        var num = h[1] === "n";
        return el("th", { class: (num ? "n " : "") + "s", scope: "col", "aria-sort": state.key === i ? (state.dir > 0 ? "ascending" : "descending") : null,
          onclick: function () { state.dir = state.key === i ? -state.dir : -1; state.key = i; draw(); },
          text: h[0] + (state.key === i ? (state.dir > 0 ? " ▲" : " ▼") : "") });
      }))]),
      el("tbody", {}, data.length ? data.map(function (r) {
        return el("tr", { class: (r.onclick ? "click " : "") + (r.cls || ""), onclick: r.onclick },
          r.cells.map(function (c, i) {
            var show = c && c.t !== undefined ? c.t : c;
            var td = el("td", { class: heads[i][1] === "n" ? "n" : null });
            if (show instanceof Node) td.appendChild(show); else td.textContent = show == null ? "–" : show;
            return td;
          }));
      }) : [el("tr", {}, [el("td", { colspan: heads.length, class: "empty", text: opts.empty || "Nothing matches." })])])
    ]));
  }
  draw();
  return wrap;
}
function tag(text, kind) { return el("span", { class: "tag " + (kind || ""), text: text }); }
function status(s) {
  return s === "eligible" ? tag("locked pregame", "good") : s === "postgame" ? tag("recorded after kickoff", "bad")
    : tag(s || "unknown", "warn");
}

// ---- charts ------------------------------------------------------------------------
function lineChart(series, opts) {
  // series: [{name, color, points: [{x, y, tip}]}]
  var W = 760, H = opts.height || 260, P = { l: 44, r: 12, t: 12, b: 28 };
  var xs = [], ys = [];
  series.forEach(function (s) { s.points.forEach(function (p) { if (p.y != null) { xs.push(p.x); ys.push(p.y); } }); });
  if (!ys.length) return el("div", { class: "empty", text: opts.empty || "No points to draw." });
  var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  var y0 = Math.min.apply(null, ys.concat(opts.yzero ? [0] : [])), y1 = Math.max.apply(null, ys.concat(opts.yzero ? [0] : []));
  if (y0 === y1) { y0 -= 1; y1 += 1; }
  var pad = (y1 - y0) * 0.08; y0 -= pad; y1 += pad;
  var X = function (x) { return P.l + (x1 === x0 ? 0.5 : (x - x0) / (x1 - x0)) * (W - P.l - P.r); };
  var Y = function (y) { return H - P.b - (y - y0) / (y1 - y0) * (H - P.t - P.b); };
  var svg = S("svg", { viewBox: "0 0 " + W + " " + H, width: "100%", role: "img", "aria-label": opts.label || "chart" });
  for (var i = 0; i <= 4; i++) {
    var v = y0 + (y1 - y0) * i / 4;
    svg.appendChild(S("line", { x1: P.l, x2: W - P.r, y1: Y(v), y2: Y(v), stroke: "#262a32" }));
    svg.appendChild(S("text", { x: P.l - 6, y: Y(v) + 4, "text-anchor": "end", text: v.toFixed(1) }));
  }
  if (opts.yzero && y0 < 0 && y1 > 0) svg.appendChild(S("line", { x1: P.l, x2: W - P.r, y1: Y(0), y2: Y(0), stroke: "#8b919c", "stroke-dasharray": "3 3" }));
  for (var x = x0; x <= x1; x++) svg.appendChild(S("text", { x: X(x), y: H - 8, "text-anchor": "middle", text: (opts.xprefix || "") + x }));
  series.forEach(function (s) {
    var d = "", pen = false;
    s.points.forEach(function (p) {
      if (p.y == null) { pen = false; return; }
      d += (pen ? "L" : "M") + X(p.x).toFixed(1) + " " + Y(p.y).toFixed(1); pen = true;
    });
    svg.appendChild(S("path", { d: d, fill: "none", stroke: s.color, "stroke-width": 2, "stroke-dasharray": s.dash }));
    s.points.forEach(function (p) {
      if (p.y == null) return;
      svg.appendChild(S("circle", { cx: X(p.x), cy: Y(p.y), r: p.r || 3.5, fill: p.fill || s.color, stroke: "#07080a", "stroke-width": 1,
        onmousemove: function (e) { tip(e, p.tip); }, onmouseleave: function (e) { tip(e, null); } }));
    });
  });
  return svg;
}
function legend(series) {
  return el("div", { class: "row note" }, series.map(function (s) {
    return el("span", { class: "chip" }, [el("span", { class: "sw", style: "background:" + s.color }), s.name]);
  }));
}

// ---- router ------------------------------------------------------------------------
function route() {
  var hash = location.hash.replace(/^#/, "") || "live";
  var parts = hash.split("/"), page = parts[0];
  if (!PAGES.some(function (p) { return p[0] === page; })) page = "live";
  var nav = document.getElementById("nav"); nav.innerHTML = "";
  PAGES.forEach(function (p) { nav.appendChild(el("a", { href: "#" + p[0], class: p[0] === page ? "on" : null, "aria-current": p[0] === page ? "page" : null, text: p[1] })); });
  var main = document.getElementById("main");
  if (page !== "live") LIVE.detach();
  (VIEWS[page] || VIEWS.live)(main, parts.slice(1));
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

// ---- 1 + 8: live cards, one shared stream -------------------------------------------
var LIVE = {
  snap: null, rows: {}, es: null, failures: 0, timer: null, main: null, feed: [], selected: null, conn: "connecting",
  attach: function (main) {
    this.main = main; var me = this;
    main.innerHTML = "";
    main.appendChild(el("h1", { text: "Live scoreboard" }));
    main.appendChild(el("p", { class: "sub", text: "One reader on this computer asks ESPN's scoreboard (every 30 s while a game is on, " +
      "longer otherwise) and sends this page only what changed. ESPN has no streaming feed, so this is polling - " +
      "scores can be up to a poll behind the broadcast. Live scores never touch the locked Thursday forecasts." }));
    this.bar = el("div", { class: "status box" }); main.appendChild(this.bar);
    this.grid = el("div", { class: "cards", "aria-live": "polite" }); main.appendChild(this.grid);
    main.appendChild(el("h2", { text: "What changed" }));
    this.feedBox = el("div", { class: "feed box" }); main.appendChild(this.feedBox);
    this.rows = {};
    api("/api/live").then(function (s) { delete cache["/api/live"]; me.snap = s; me.lastVersion = s.version; me.drawAll(); me.connect(); })
      .catch(function (e) { me.bar.textContent = "Live scores unavailable: " + e.message; });
    this.tick = setInterval(function () { me.drawBar(); }, 1000);
  },
  detach: function () {
    if (this.es) { this.es.close(); this.es = null; }
    clearTimeout(this.timer); clearInterval(this.tick); this.main = null;
  },
  connect: function () {
    var me = this;
    if (!window.EventSource || this.failures > 3) return this.pollFallback();
    this.es = new EventSource("/events?since=" + this.snap.version);
    this.es.onopen = function () { me.conn = "streaming"; me.failures = 0; me.drawBar(); };
    this.es.onmessage = function (m) { me.apply(JSON.parse(m.data)); };
    this.es.onerror = function () {
      me.conn = "reconnecting"; me.failures++; me.drawBar();
      if (me.failures > 3) { me.es.close(); me.es = null; me.pollFallback(); }
    };
  },
  pollFallback: function () {
    // the stream won't hold: ask for the whole snapshot, backing off 5 s -> 2 min
    var me = this, wait = Math.min(120, 5 * Math.pow(2, Math.max(0, this.failures - 4)));
    this.conn = "polling the Lab server";
    this.timer = setTimeout(function () {
      if (!me.main) return;
      fetch("/api/live").then(function (r) { return r.json(); }).then(function (s) {
        me.failures = 4; me.mergeSnapshot(s);
      }).catch(function () { me.failures++; me.conn = "disconnected from the Lab server"; me.drawBar(); })
        .then(function () { me.pollFallback(); });
    }, wait * 1000);
  },
  mergeSnapshot: function (s) {
    var me = this, old = this.snap;
    this.snap = s;
    s.games.forEach(function (g) {
      var key = g.away + "@" + g.home, before = old && old.games.filter(function (x) { return x.away + "@" + x.home === key; })[0];
      if (!before || JSON.stringify(before) !== JSON.stringify(g)) {
        var kind = !before ? "new" : (before.away_points !== g.away_points || before.home_points !== g.home_points) ? "score"
          : before.phase !== g.phase ? "phase" : "clock";
        me.apply({ kind: kind, game: key, row: g, before: before, version: s.version, at: s.now }, true);
      }
    });
    this.drawBar();
  },
  apply: function (e, fromSnap) {
    if (!this.main || !this.snap) return;
    if (!fromSnap) {
      if (e.version <= (this.lastVersion || 0)) return;   // duplicate after a reconnect
      this.lastVersion = e.version;
    }
    if (e.kind === "error") { this.snap.error = e.text; this.snap.failures = (this.snap.failures || 0) + 1; this.drawBar(); return; }
    if (e.kind === "heartbeat") { this.snap.ok_at = e.ok_at; this.snap.error = ""; this.snap.failures = 0; this.drawBar(); return; }
    if (!e.row) return;
    var list = this.snap.games, i = list.findIndex(function (g) { return g.away + "@" + g.home === e.game; });
    if (i >= 0) list[i] = e.row; else list.push(e.row);
    this.drawCard(e.row, e);
    if (e.kind === "score" || e.kind === "phase") {
      var b = e.before || {};
      this.feed.unshift(new Date().toLocaleTimeString() + "  " + up(e.row.away) + " " + e.row.away_points + " - " +
        e.row.home_points + " " + up(e.row.home) + "  " + (e.kind === "score" ? "score (was " + b.away_points + "-" + b.home_points + ")" : b.phase + " → " + e.row.phase));
      this.feed = this.feed.slice(0, 50);
      this.feedBox.textContent = this.feed.join("\n");
    }
  },
  drawAll: function () {
    var me = this;
    this.grid.innerHTML = ""; this.rows = {};
    var order = { live: 0, halftime: 0, upcoming: 1, final: 2, "called-off": 3 };

    var ta = el("textarea", { rows: 3, style: "width:100%", placeholder: "Ask about Deadeye's forecasts, teams, markets or experiments", "aria-label": "Question" });

    var out = el("div");
    box.appendChild(el("div", { class: "presets" }, PRESETS.map(function (p) { return el("button", { text: p, onclick: function () { ta.value = p; } }); })));
    box.appendChild(ta); box.appendChild(el("div", { class: "row", style: "margin-top:8px" }, [go, el("span", { class: "note", text: "Each question costs a few cents of API credit." })]));
    main.appendChild(box); main.appendChild(out);
    go.addEventListener("click", function () {

          return el("p", { class: "note num", text: c.tool + " " + JSON.stringify(c.input) + (c.error ? "  (error)" : "") + "  · " + c.chars + " chars returned" });
        }))));

        .then(function () { go.disabled = false; });
    });
    // the same tools, no AI
    main.appendChild(el("h2", { text: "Data answers (no AI, always available)" }));
    var dbox = el("div", { class: "box presets" }), dout = el("div");
    [["Biggest errors (locked forecasts)", function () {
      return post("/api/tool", { name: "postmortems", args: { sort: "brier", limit: 10 } }).then(function (r) {

          return { cells: [g.week, up(g.away) + " @ " + up(g.home), up(g.favoured), pct(g.p), { t: fx(g.brier, 3), v: g.brier }, g.right ? "right" : "wrong"] };

      });

          var v = by[t]; return { cells: [up(t), v.length, { t: fx(v.reduce(function (a, b) { return a + b; }, 0) / v.length, 3), v: v.reduce(function (a, b) { return a + b; }, 0) / v.length }] };
