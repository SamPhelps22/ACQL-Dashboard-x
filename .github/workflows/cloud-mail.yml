name: ACQL cloud mail

# The emails and texts while the PC is off (acql/site/snapshot.py). Every hour
# GitHub downloads the PC's locked copy of the pool's data, unlocks it with
# ACQL_SNAPSHOT_KEY, and sends what is due on the PC's own schedule (Chicago
# time): the deadline texts, Deadeye's card Tue/Wed/Thu from noon, the Sunday
# brief from 9am. Nothing is sent until the PC runs
# `python -m acql.site.snapshot --cloud-on` - and then the PC stops sending.
# This log is public: the job prints only what it did, never the data.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build everything but send nothing (may spend 3 odds requests)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cloud-mail
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Chicago
      QT_QPA_PLATFORM: offscreen
      ACQL_CLOUD: "1"
      ACQL_SNAPSHOT_KEY: ${{ secrets.ACQL_SNAPSHOT_KEY }}
      ACQL_GMAIL_ADDRESS: ${{ secrets.ACQL_GMAIL_ADDRESS }}
      ACQL_GMAIL_APP_PASSWORD: ${{ secrets.ACQL_GMAIL_APP_PASSWORD }}
      ACQL_ODDS_API_KEY: ${{ secrets.ACQL_ODDS_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Secrets are in place
        run: |
          missing=""
          for name in ACQL_SNAPSHOT_KEY ACQL_GMAIL_ADDRESS ACQL_GMAIL_APP_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then echo "::error::Add these repository secrets:$missing"; exit 1; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt's runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0 > /dev/null

      - name: Install dependencies
        run: python -m pip install -q --disable-pip-version-check -r requirements.txt

      - name: What earlier runs sent
        uses: actions/cache/restore@v4
        with:
          path: carried.json
          key: cloud-mail-carried-${{ github.run_id }}
          restore-keys: cloud-mail-carried-

      - name: Unlock the PC's snapshot
        run: python -m acql.site.snapshot --fetch SamPhelps22/ACQL---Pool

      - name: Carry in
        run: python -m acql.site.snapshot --carry-in carried.json

      - name: Send what is due
        run: python -m acql.site.snapshot --run ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Carry out
        if: always()
        run: python -m acql.site.snapshot --carry-out carried.json || true

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: carried.json
          key: cloud-mail-carried-${{ github.run_id }}
